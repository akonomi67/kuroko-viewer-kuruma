<script>
const D={"name": "運転が好きなかたの一台", "file": "098_運転が好きなかたの一台", "dur": 843.1, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 2.966666666666667, "x": "少しだけ目をつぶってみてください。"}, {"t": 5.966666666666667, "x": "これまで乗ってきた車のなかで、いちばん楽しかった一台を思い出します。"}, {"t": 11.133333333333333, "x": "若いころに初めて自分のお金で買った車でしょうか。"}, {"t": 14.966666666666667, "x": "仕事で毎日のように走らせた車かもしれません。"}, {"t": 18.733333333333334, "x": "休みの日に山の道をのんびり走った車、というかたもいるでしょう。"}, {"t": 23.933333333333334, "x": "思い出せたら目を開けてください。"}, {"t": 28.133333333333333, "x": "その車は、たぶん背の低い車だったのではないでしょうか。"}, {"t": 32.7, "x": "ハンドルを切ったぶんだけ素直に曲がって、軽やかに走る車です。"}, {"t": 38.03333333333333, "x": "ところが70代で車を買い替えに行くと、話が変わってきます。"}, {"t": 43.266666666666666, "x": "「これからは乗り降りの楽な、背の高い車にしましょう」。"}, {"t": 47.63333333333333, "x": "こう言われて、四角い箱のような車ばかり並べられるのです。"}, {"t": 52.43333333333333, "x": "もちろん、それで助かるかたもたくさんいらっしゃいます。"}, {"t": 56.36666666666667, "x": "ただ運転そのものが好きなかたには、少しさびしい話です。"}, {"t": 61.13333333333333, "x": "今日はそういうかたのための一台をお話しします。"}, {"t": 64.8, "x": "運転の楽しさを残したまま、今の安全装備もそろっている車です。"}, {"t": 70.5, "x": "答えは早めに第3章で申し上げます。"}, {"t": 73.7, "x": "後半では、マニュアル車を選んでよいかというご質問にもお答えします。"}, {"t": 80.3, "x": "お店で70代のかたに勧められやすい車には、決まった型があります。"}, {"t": 85.73333333333333, "x": "背が高くて、後ろの扉が横に開く軽自動車や小さなミニバンです。"}, {"t": 91.56666666666666, "x": "乗り降りが楽で荷物もたくさん積めます。"}, {"t": 95.03333333333333, "x": "勧める側から見れば外れの少ない選びかたです。"}, {"t": 99.0, "x": "ところが運転好きのかたからは別の声をよく聞きます。"}, {"t": 103.83333333333333, "x": "「座るとバスの運転席みたいでどうも落ち着かない」。"}, {"t": 108.13333333333334, "x": "「曲がるときに体が外へ振られる感じが苦手なんだ」。"}, {"t": 112.2, "x": "「風の強い日の橋の上で車が横に押される気がする」。"}, {"t": 116.8, "x": "背の高い車はどうしても重心が上のほうに来ます。"}, {"t": 120.9, "x": "横から風を受ける面も大きくなります。"}, {"t": 124.36666666666666, "x": "これは形の性質なので、作りの良し悪しとは別の話です。"}, {"t": 129.53333333333333, "x": "もう1つは気持ちの問題です。"}, {"t": 132.0, "x": "好きでもない車に乗ると、運転がただの用事になります。"}, {"t": 136.76666666666668, "x": "用事になると、出かける回数が少しずつ減っていきます。"}, {"t": 141.23333333333332, "x": "出かけなくなって毎日に張りがなくなった、というお客さまもいました。"}, {"t": 146.36666666666667, "x": "楽しいから出かけるという気持ちは、とても大切な力です。"}, {"t": 150.96666666666667, "x": "ですから好みを我慢してまで、箱型を選ばなくてよいと店長は考えています。"}, {"t": 156.63333333333333, "x": "ただし条件が1つあります。"}, {"t": 159.06666666666666, "x": "今の安全装備がしっかり付いていることです。"}, {"t": 162.46666666666667, "x": "楽しさと安全の両方を満たす一台を、次の章で名指しします。"}, {"t": 169.73333333333332, "x": "今日の答えはスズキのスイフトです。"}, {"t": 173.1, "x": "今の型が売り出されたのは2023年の12月です。"}, {"t": 177.86666666666667, "x": "マニュアル車は少し遅れて、2024年の1月に加わりました。"}, {"t": 183.16666666666666, "x": "長さは3860ミリで幅は1695ミリです。"}, {"t": 188.66666666666666, "x": "屋根の高さは前輪駆動の車で1500ミリです。"}, {"t": 192.96666666666667, "x": "背の高い軽自動車と並べると、ずっと低く構えた形をしています。"}, {"t": 198.13333333333333, "x": "エンジンは1.2リットルの三気筒です。"}, {"t": 201.4, "x": "上の2つの形には、小さなモーターで走りを手助けする仕組みが付きます。"}, {"t": 207.3, "x": "形は大きく分けて3つあります。"}, {"t": 210.3, "x": "いちばん手ごろなのがXGで、真ん中がハイブリッドMX。"}, {"t": 215.43333333333334, "x": "いちばん上がハイブリッドMZです。"}, {"t": 218.33333333333334, "x": "この車を選んだ理由は3つあります。"}, {"t": 221.5, "x": "1つめは、軽くて小さいので思ったとおりに走ってくれることです。"}, {"t": 226.53333333333333, "x": "2つめは、座る高さとハンドルを体に合わせて変えられることです。"}, {"t": 231.53333333333333, "x": "3つめは、この大きさで安全装備がしっかりそろっていることです。"}, {"t": 236.46666666666667, "x": "しかも今では数少ないマニュアル車まで選べます。"}, {"t": 240.1, "x": "運転好きのかたが見て乗って納得しやすい一台です。"}, {"t": 244.4, "x": "では順番に見ていきましょう。"}, {"t": 248.26666666666668, "x": "まずは重さの話です。"}, {"t": 250.46666666666667, "x": "いちばん軽いのはXGの前輪駆動で910キロです。"}, {"t": 255.8, "x": "マニュアル車は920キロで、いちばん上のMZでも950キロです。"}, {"t": 262.03333333333336, "x": "前輪駆動ならどの形を選んでも1トンを下回ります。"}, {"t": 267.1, "x": "四輪駆動にしても1020キロにとどまります。"}, {"t": 270.8333333333333, "x": "車が軽いと、エンジンの力が小さくても走りが重たくなりません。"}, {"t": 276.3333333333333, "x": "燃費にももちろん良く効いてきます。"}, {"t": 279.1, "x": "次は大きさです。"}, {"t": 281.03333333333336, "x": "長さの3860ミリは、軽自動車の枠より46センチ長いだけです。"}, {"t": 287.96666666666664, "x": "幅の1695ミリは、5ナンバーの枠に収まっています。"}, {"t": 292.9, "x": "小回りの目安になる数字は、前輪駆動で4.8メートルです。"}, {"t": 298.56666666666666, "x": "細い路地や狭い駐車場でも、持て余すことはないでしょう。"}, {"t": 303.23333333333335, "x": "それでいて、軽自動車よりひと回り大きな体を持っています。"}, {"t": 308.03333333333336, "x": "高速道路で落ち着いて走れる、と乗り換えたお客さまはよく言われます。"}, {"t": 313.26666666666665, "x": "運転好きのかたにとって、この軽さは楽しさそのものです。"}, {"t": 318.3, "x": "アクセルを少し踏めばすっと前に出る。"}, {"t": 321.3333333333333, "x": "ハンドルを少し切ればすっと向きを変える。"}, {"t": 324.5, "x": "この「すっと」が、毎日の買い物を少し楽しい時間に変えてくれます。"}, {"t": 329.73333333333335, "x": "スズキも、曲がるときに車が傾きにくいよう足回りを見直したと説明しています。"}, {"t": 336.3333333333333, "x": "数字だけでは分からないので、試乗では角を1つ曲がってみてください。"}, {"t": 343.0, "x": "運転が好きなかたほど、座ったときの感じを大事にされます。"}, {"t": 348.23333333333335, "x": "スイフトの運転席は、背の高い車のように上から見下ろす形ではありません。"}, {"t": 354.0, "x": "足を前に伸ばして座る、昔ながらの乗用車の座り方です。"}, {"t": 359.5, "x": "長く乗ってきた車と同じ感覚で、体がなじみやすいはずです。"}, {"t": 364.3, "x": "一方で気になるのは乗り降りではないでしょうか。"}, {"t": 367.7, "x": "屋根が低いぶん、頭を少しかがめて乗り込むことになります。"}, {"t": 372.1333333333333, "x": "ここで役に立つのが座る高さを変えるレバーです。"}, {"t": 376.23333333333335, "x": "スイフトは、全部の形に運転席の高さを変える仕組みが付いています。"}, {"t": 381.6666666666667, "x": "ハンドルの高さを変える仕組みも、全部の形に付いています。"}, {"t": 386.4, "x": "座面を少し上げると、前の見え方も乗り降りも楽になります。"}, {"t": 391.56666666666666, "x": "上げすぎると頭が天井に近づくので、ちょうどよい所を探してください。"}, {"t": 397.2, "x": "車庫入れで、まわりが見えにくいと感じるかたもいるでしょう。"}, {"t": 401.46666666666664, "x": "まわりを映すカメラ付きのナビを付けると、車を上から見たような映像が出ます。"}, {"t": 407.2, "x": "これは真ん中のMXと上のMZで、注文のときに選べる追加の装備です。"}, {"t": 413.3, "x": "お店で運転好きのかたが最初にされるのは、座ってハンドルを握ることです。"}, {"t": 420.1666666666667, "x": "そのとき「しっくりくる」と感じるかどうかが、何より正直な答えです。"}, {"t": 426.7, "x": "楽しさの次は安全の話です。"}, {"t": 430.03333333333336, "x": "国の衝突試験の結果は、以前の安全な5台の回でお話ししました。"}, {"t": 435.46666666666664, "x": "今日は点数ではなく、どんな装備が付いているかを見ていきます。"}, {"t": 440.2, "x": "まずは、ぶつかりそうなときに止まろうとするブレーキです。"}, {"t": 444.56666666666666, "x": "スイフトのものは、電波とカメラの2つの目で前を見ています。"}, {"t": 449.46666666666664, "x": "車や歩く人だけでなく、自転車やオートバイも見分けます。"}, {"t": 454.3666666666667, "x": "急に出てくる自転車がこわい、というかたには大事な点です。"}, {"t": 459.06666666666666, "x": "次はライトの装備です。"}, {"t": 461.23333333333335, "x": "MXとXGには、ハイビームとロービームを自動で切り替える機能が付きます。"}, {"t": 467.03333333333336, "x": "上のMZには、前の車をまぶしくしないよう光の一部を隠すライトが付きます。"}, {"t": 473.43333333333334, "x": "道の白線からはみ出しそうになると、知らせて戻そうとする機能もあります。"}, {"t": 479.03333333333336, "x": "道路の標識を読み取って画面に映す機能もあります。"}, {"t": 482.9, "x": "エアバッグは前の席の正面と横、窓側のカーテンを合わせて6つです。"}, {"t": 488.8, "x": "そしてスズキで初めて、運転する人の様子をカメラで見守る仕組みも用意されました。"}, {"t": 494.96666666666664, "x": "これはMZで、まわりを映すナビと一緒に選ぶ追加の装備です。"}, {"t": 500.1333333333333, "x": "ここまでの装備は、背の高い車と比べても見劣りしません。"}, {"t": 504.93333333333334, "x": "ただし大事な注意が1つあります。"}, {"t": 507.73333333333335, "x": "駐車場での踏み間違いに備える装備は、マニュアル車には付きません。"}, {"t": 512.8666666666667, "x": "この話は第8章でくわしくお話しします。"}, {"t": 517.9, "x": "次はお財布の話です。"}, {"t": 520.1, "x": "国の審査の燃費は、ハイブリッドのCVTで1リットルあたり24.5キロです。"}, {"t": 526.9333333333333, "x": "マニュアル車は25.4キロで、全部の形のなかでいちばん良い数字です。"}, {"t": 532.8666666666667, "x": "いちばん手ごろなXGでも23.4キロあります。"}, {"t": 537.0, "x": "年に5000キロ走るとすると、ハイブリッドのCVTでおよそ204リットルです。"}, {"t": 543.2, "x": "値段はメーカーの希望小売価格で見ていきます。"}, {"t": 546.8333333333334, "x": "いちばん手ごろなXGの前輪駆動は、172万7000円です。"}, {"t": 552.8, "x": "真ん中のハイブリッドMXは、CVTでもマニュアルでも192万2800円です。"}, {"t": 559.6, "x": "いちばん上のハイブリッドMZは、216万7000円です。"}, {"t": 565.1, "x": "四輪駆動にすると、どの形も16万5000円上がります。"}, {"t": 569.9, "x": "店長のおすすめは真ん中のMXのCVTです。"}, {"t": 574.2333333333333, "x": "ハイブリッドの燃費と、ひととおりの安全装備がそろっています。"}, {"t": 578.8, "x": "光を隠すライトや、信号待ちで足を離せる機能が欲しいならMZです。"}, {"t": 585.3, "x": "MZとMXの差は24万4200円です。"}, {"t": 590.3666666666667, "x": "発売のときと同じ値段が、今もスズキの表に載っています。"}, {"t": 595.2, "x": "200万円前後で、走って楽しい普通車が手に入るわけです。"}, {"t": 601.9333333333333, "x": "お店でよく聞かれるのがこの質問です。"}, {"t": 604.9333333333333, "x": "「若いころからずっとマニュアルなんだが、まだ乗っていいだろうか」。"}, {"t": 609.6333333333333, "x": "スイフトは、今では数少ないマニュアル車が選べる車です。"}, {"t": 614.4, "x": "選べるのは、真ん中のハイブリッドMXの前輪駆動だけです。"}, {"t": 619.5666666666667, "x": "ギアは5段で値段はCVTと同じです。"}, {"t": 623.4666666666667, "x": "ただ先に知っておいていただきたい違いがあります。"}, {"t": 626.9333333333333, "x": "マニュアル車には、低い速さで壁や車にぶつからないよう助ける機能が付きません。"}, {"t": 632.9, "x": "止まった所からの踏み間違いに備える機能も、前と後ろとも付きません。"}, {"t": 638.5, "x": "前の車について走る機能も、止まるところまでは追いかけません。"}, {"t": 643.3666666666667, "x": "ではサポカー限定の免許との関係はどうでしょう。"}, {"t": 647.5333333333333, "x": "これは、安全装備の付いた車だけを運転できるようにする免許の条件です。"}, {"t": 653.8333333333334, "x": "警察庁の説明では、マニュアル車は国の認定を受けたブレーキだけが条件です。"}, {"t": 659.9333333333333, "x": "踏み間違いの装備がなくても、条件を満たす場合があるということです。"}, {"t": 665.0, "x": "スイフトのマニュアル車が当てはまるかは、販売店で書類を見せてもらってください。"}, {"t": 670.4, "x": "とはいえ店長の考えははっきりしています。"}, {"t": 673.6666666666666, "x": "マニュアル車は、長年乗り続けてきたかただけにお勧めします。"}, {"t": 678.4333333333333, "x": "しばらくオートマに乗っていたかたが、今から戻るのはお勧めしません。"}, {"t": 683.2333333333333, "x": "迷ったらCVTを選んでください。"}, {"t": 686.1333333333333, "x": "CVTなら、踏み間違いへの備えがきちんと付いてきます。"}, {"t": 690.8, "x": "運転の楽しさは、変速機の種類だけで決まるものではありません。"}, {"t": 695.3666666666667, "x": "軽い車体と素直な曲がり方は、CVTでも同じように味わえます。"}, {"t": 702.4, "x": "もちろんスイフトが向かないかたもいます。"}, {"t": 705.7666666666667, "x": "まず、膝や腰が痛くて、低い座席への乗り降りがつらいかた。"}, {"t": 711.2, "x": "座る高さを上げても、背の高い車ほどの楽さにはなりません。"}, {"t": 716.3, "x": "このかたは無理をせず背の高い車を選んでください。"}, {"t": 720.5, "x": "次に後ろの席に人を乗せる日が多いかた。"}, {"t": 724.0333333333333, "x": "後ろの扉は普通の開き戸で、横に滑る扉ではありません。"}, {"t": 729.0333333333333, "x": "足の弱いご家族の乗り降りを手伝うなら、横に開く扉のほうが楽です。"}, {"t": 735.0, "x": "3つめは大きな荷物をよく運ぶかたです。"}, {"t": 738.5, "x": "後ろの席は6対4に分けて倒せますが、背の高い車ほどは積めません。"}, {"t": 744.1666666666666, "x": "最後に雪の深い土地にお住まいのかたです。"}, {"t": 747.5333333333333, "x": "地面とのすき間は前輪駆動で120ミリ、四輪駆動でも145ミリです。"}, {"t": 754.1, "x": "深い雪の道を毎日走るなら、車高のある車とも比べてみてください。"}, {"t": 760.1666666666666, "x": "どれにも当てはまらなければ、スイフトは長く付き合える相棒になります。"}, {"t": 767.0, "x": "今日のお話を短く振り返ります。"}, {"t": 769.9, "x": "年を重ねたからといって、箱型の車を選ばなければならない決まりはありません。"}, {"t": 775.7, "x": "運転が好きなかたには、スズキのスイフトをお勧めします。"}, {"t": 780.3, "x": "前輪駆動ならどの形も重さは1トンを下回ります。"}, {"t": 785.1, "x": "幅は1695ミリで5ナンバーの枠に収まります。"}, {"t": 789.5, "x": "自転車まで見分けるブレーキと、6つのエアバッグが付いています。"}, {"t": 794.4333333333333, "x": "値段は172万7000円からで、店長のおすすめはMXのCVTです。"}, {"t": 801.3666666666667, "x": "マニュアル車はずっと乗り続けてきたかただけに。"}, {"t": 804.6666666666666, "x": "迷ったら、踏み間違いへの備えが付くCVTにしてください。"}, {"t": 809.6333333333333, "x": "最後にもう一度だけ目をつぶってみてください。"}, {"t": 813.1333333333333, "x": "はじめに思い出したあの楽しかった車です。"}, {"t": 817.0333333333333, "x": "試乗でスイフトに乗ったら、その車と比べてみてください。"}, {"t": 821.5, "x": "似た気持ちがよみがえったら、それがあなたの答えです。"}, {"t": 825.6333333333333, "x": "値段と装備は、今日の時点でスズキが公式に載せているものです。"}, {"t": 830.5666666666667, "x": "契約の前には、販売店で最新の装備表を見せてもらってください。"}, {"t": 835.7666666666667, "x": "楽しい運転を、これからも長く続けていただけますように。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
