<style>

<script>
const D={"name": "孫を乗せる一台", "file": "099_孫を乗せる一台", "dur": 799.8, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "先週の閉店のあと、お店でちょっとした試しごとをしました。"}, {"t": 7.766666666666667, "x": "倉庫にあったチャイルドシートを1つ、店の車に順番に付けてみたのです。"}, {"t": 13.3, "x": "セダンと小さな普通車、そして背の高い軽自動車です。"}, {"t": 18.433333333333334, "x": "時間や長さを測ったわけではありません。"}, {"t": 21.566666666666666, "x": "付けるあいだに、体がどんな動きをするかだけを見ました。"}, {"t": 26.033333333333335, "x": "腰をどこまで曲げるか、どこに手をつくか。"}, {"t": 29.866666666666667, "x": "頭を屋根にぶつけそうになるかどうか。"}, {"t": 32.86666666666667, "x": "やってみると、車によって体のつらさがまるで違いました。"}, {"t": 37.36666666666667, "x": "なぜこんなことをしたかというと、同じご相談が続いたからです。"}, {"t": 42.233333333333334, "x": "「娘に孫の保育園の送り迎えを頼まれまして」。"}, {"t": 46.1, "x": "「チャイルドシートを付けたり外したりで腰を痛めそうでね」。"}, {"t": 50.333333333333336, "x": "こうしたお話を、この秋だけで何度も伺いました。"}, {"t": 54.63333333333333, "x": "お孫さんを乗せる日があるのは、70代のかたにとって嬉しいことです。"}, {"t": 59.766666666666666, "x": "ただ、その嬉しさが腰の痛みと引きかえでは困ります。"}, {"t": 64.13333333333334, "x": "今日はお孫さんを乗せる日があるかたに、一台をはっきりお勧めします。"}, {"t": 69.6, "x": "答えは第3章で申し上げます。"}, {"t": 72.53333333333333, "x": "後半では、おじいさんとおばあさんが知っておきたい決まりもお話しします。"}, {"t": 79.16666666666667, "x": "試してみて分かったのは、つらい動きが3つあることです。"}, {"t": 83.5, "x": "1つめは、チャイルドシートを車に付ける動きです。"}, {"t": 87.33333333333333, "x": "重さのある椅子を抱えて、車の中へ入れなければなりません。"}, {"t": 92.0, "x": "しかも奥の金具を探して、しっかりはめ込む必要があります。"}, {"t": 96.56666666666666, "x": "入り口が狭い車だと、体を半分ねじったまま腕だけで押し込むことになります。"}, {"t": 102.56666666666666, "x": "2つめは、お孫さんを抱えて座らせる動きです。"}, {"t": 106.5, "x": "小さい子でも、抱えたまま中腰になると腰にずしりと来ます。"}, {"t": 111.76666666666667, "x": "足をばたばたさせる子ならなおさらです。"}, {"t": 114.83333333333333, "x": "3つめは、ベルトを締めて外す動きです。"}, {"t": 118.46666666666667, "x": "股の間の金具に手を伸ばすとき、頭が屋根の縁に当たりそうになります。"}, {"t": 124.16666666666667, "x": "この3つは、送り迎えのたびに必ず繰り返されます。"}, {"t": 128.43333333333334, "x": "朝に1回、夕方にもう1回です。"}, {"t": 132.1, "x": "保育園が週に5日なら1週間で10回になります。"}, {"t": 136.2, "x": "1回なら我慢できても、10回となると話は別です。"}, {"t": 140.76666666666668, "x": "試した中では、背の低い車ほど3つの動きがつらくなりました。"}, {"t": 145.96666666666667, "x": "屋根が低いと、どうしても腰を深く曲げることになるからです。"}, {"t": 150.7, "x": "手伝ってくれた店の若い者でさえ、途中で何度も腰を伸ばしていました。"}, {"t": 156.26666666666668, "x": "小さな普通車も、後ろの扉が手前に開く形だと入り口の角が邪魔をします。"}, {"t": 163.16666666666666, "x": "ではどんな車なら楽になるのでしょうか。"}, {"t": 166.56666666666666, "x": "答えは入り口の広さと、中で体を起こしたまま動けることでした。"}, {"t": 173.5, "x": "今日の答えは、ダイハツのタントです。"}, {"t": 176.56666666666666, "x": "屋根の高い、背の高い軽自動車の仲間です。"}, {"t": 180.53333333333333, "x": "今年の夏に改良されたばかりで、その中身は前の軽の5台の回でお話ししました。"}, {"t": 187.1, "x": "今日はお孫さんを乗せるという1点だけで見ていきます。"}, {"t": 191.03333333333333, "x": "さきほどの3つの動きに、タントは1つずつ答えを持っています。"}, {"t": 196.1, "x": "付ける動きには助手席側の柱のない大きな入り口。"}, {"t": 200.56666666666666, "x": "座らせる動きには背の高い室内と、横に滑って開く後ろの扉。"}, {"t": 206.33333333333334, "x": "ベルトの動きには左右別々に前後へ動かせる後ろの席です。"}, {"t": 211.0, "x": "そして、どの形にもチャイルドシート用の金具が後ろの席に付いています。"}, {"t": 216.96666666666667, "x": "試しごとでもタントがいちばん腰を曲げずに済みました。"}, {"t": 221.0, "x": "ただ、タントにも弱いところがあります。"}, {"t": 224.16666666666666, "x": "それも隠さずに第8章でお話しします。"}, {"t": 227.53333333333333, "x": "まずは、タントの名前と一緒に語られることの多いドアから見ていきましょう。"}, {"t": 234.3, "x": "ふつうの車には、前の扉と後ろの扉の間に一本の柱があります。"}, {"t": 239.93333333333334, "x": "タントの助手席側にはこの柱が見当たりません。"}, {"t": 243.56666666666666, "x": "柱は前と後ろの扉の中に組み込まれていて、両方開けると大きな口になります。"}, {"t": 250.3, "x": "ダイハツはこれをミラクルオープンドアと呼んでいます。"}, {"t": 254.03333333333333, "x": "いちばん手ごろな形から上まで、全部の形に付いています。"}, {"t": 259.03333333333336, "x": "入り口の幅については、ずっと前の軽自動車5台の回でお話ししました。"}, {"t": 264.96666666666664, "x": "今日はその広さで送り迎えの何が楽になるかをお話しします。"}, {"t": 270.1666666666667, "x": "まずチャイルドシートを付けるときです。"}, {"t": 272.93333333333334, "x": "柱がないので、椅子を抱えたまま体の正面から入れられます。"}, {"t": 277.8333333333333, "x": "体をねじらずに済むので、腰への負担がぐっと減ります。"}, {"t": 282.4, "x": "次にお孫さんを乗せるときです。"}, {"t": 285.0, "x": "お孫さんの手を引いて一緒に入り口をくぐることもできます。"}, {"t": 289.26666666666665, "x": "荷物で手がふさがっていてもそのまま乗り降りできる、とダイハツは説明しています。"}, {"t": 295.4, "x": "保育園のかばんと着替えの袋を持っていても、慌てずに済むわけです。"}, {"t": 300.46666666666664, "x": "後ろの扉は横に滑って開くスライドドアです。"}, {"t": 304.6, "x": "狭い駐車場でも、隣の車に扉をぶつける心配がありません。"}, {"t": 309.4, "x": "助手席側のスライドドアは、Lという形を除いてボタン1つで開け閉めできます。"}, {"t": 315.76666666666665, "x": "運転席側も電動にしたいなら、Xでは注文のときに5万5000円で付けられます。"}, {"t": 322.53333333333336, "x": "カスタムと名の付く形なら両側とも初めから電動です。"}, {"t": 327.0, "x": "電動の扉には、予約しておけば鍵を持って近づくだけで開く機能もあります。"}, {"t": 332.8666666666667, "x": "お孫さんを抱っこしたまま、手を使わずに扉が開くのは本当に助かります。"}, {"t": 340.3333333333333, "x": "次はチャイルドシートそのものの話です。"}, {"t": 343.46666666666664, "x": "付けかたには大きく分けて2つあります。"}, {"t": 346.43333333333334, "x": "1つは、車のシートベルトでぐるりと締めて固定するやり方です。"}, {"t": 351.53333333333336, "x": "もう1つは、座席の奥にある金具に椅子の爪を差し込むやり方です。"}, {"t": 357.06666666666666, "x": "この金具の決まりはアイソフィックスと呼ばれています。"}, {"t": 360.46666666666664, "x": "金具は座る所と背もたれのすき間の奥にあります。"}, {"t": 364.3, "x": "タントはどの形でも、後ろの席にこの金具が付いています。"}, {"t": 369.1, "x": "椅子の上のほうをひもで引っぱって留める所も付いています。"}, {"t": 373.26666666666665, "x": "シートベルトで締めるやり方は力も慣れも要ります。"}, {"t": 377.6333333333333, "x": "きつく締めたつもりでも、あとで少しゆるんでいることがあります。"}, {"t": 382.1, "x": "警察庁の今年の調べでは、正しく付けられていたのは77.6%でした。"}, {"t": 388.26666666666665, "x": "付いてはいても、4つに1つ近くは付けかたに問題があったということです。"}, {"t": 393.8, "x": "子どもが正しく座れていた割合は58.7%にとどまりました。"}, {"t": 399.8, "x": "金具に差し込むやり方なら、付いたかどうかが分かりやすくなります。"}, {"t": 404.56666666666666, "x": "ただし金具で付けられるのは、金具に合うチャイルドシートだけです。"}, {"t": 409.23333333333335, "x": "娘さんの家のチャイルドシートが合うかどうかは、説明書で確かめてください。"}, {"t": 414.6333333333333, "x": "もう1つ大事なのは、どちら側の席に付けるかです。"}, {"t": 418.8666666666667, "x": "店長のお勧めは助手席の後ろの席です。"}, {"t": 422.6666666666667, "x": "道の左側に止めれば、お孫さんは歩道の側から乗り降りできます。"}, {"t": 427.8333333333333, "x": "しかもタントなら、そちら側が柱のない大きな入り口です。"}, {"t": 432.6666666666667, "x": "付けるのも乗せるのも広い側でまとめて済ませられます。"}, {"t": 438.1333333333333, "x": "タントのもう1つの良さは席を動かせる幅の大きさです。"}, {"t": 443.03333333333336, "x": "後ろの席は、左右別々に前と後ろへ動かせます。"}, {"t": 447.46666666666664, "x": "動かせる長さは24センチです。"}, {"t": 450.3333333333333, "x": "荷物を置く後ろの側からもレバーで動かせるようになっています。"}, {"t": 455.2, "x": "これを送り迎えでどう使うかをお話しします。"}, {"t": 458.7, "x": "お孫さんの席だけ前に出せば、止まっているときに前の席から手が届きやすくなります。"}, {"t": 464.8666666666667, "x": "反対に後ろへ下げれば、足元が広くなってベルトを締める作業が楽になります。"}, {"t": 470.96666666666664, "x": "助手席も前へ38センチ動かせます。"}, {"t": 474.96666666666664, "x": "これもいちばん手ごろな形から上まで全部に付いています。"}, {"t": 479.26666666666665, "x": "助手席をいちばん前まで出すと、後ろの席の足元が大きく空きます。"}, {"t": 484.93333333333334, "x": "大人がそこに入って、お孫さんと向き合いながらベルトを締められます。"}, {"t": 490.1666666666667, "x": "運転席には注文のときに付けられる大きく動く席があります。"}, {"t": 495.1666666666667, "x": "L以外の形で選べて、値段は3万3000円です。"}, {"t": 499.9, "x": "最大で54センチ動くので、運転席と後ろの席を行き来しやすくなります。"}, {"t": 506.06666666666666, "x": "お孫さんがぐずったときに、車の外へ回らずにそばへ行けるわけです。"}, {"t": 511.3333333333333, "x": "ただし、この席を動かせるのはシフトがPのときだけです。"}, {"t": 515.8, "x": "走っているあいだは背もたれを倒しすぎないよう、ダイハツも注意しています。"}, {"t": 522.8333333333334, "x": "ここでお孫さんを乗せるときの決まりを確かめておきます。"}, {"t": 527.0, "x": "6歳未満の子どもを車に乗せるときは、チャイルドシートを使う決まりです。"}, {"t": 532.6666666666666, "x": "道路交通法の第71条の3に書かれています。"}, {"t": 536.9666666666667, "x": "守る責任があるのは運転する人です。"}, {"t": 540.6, "x": "おじいさんが運転するなら、おじいさんの責任になります。"}, {"t": 545.0333333333333, "x": "これはお孫さんを預かって運ぶときも同じです。"}, {"t": 548.7666666666667, "x": "「近所のスーパーまでだから」というのは例外になりません。"}, {"t": 552.9666666666667, "x": "例外として決められているのは限られた場合だけです。"}, {"t": 557.3, "x": "たとえば、けがや病気でチャイルドシートが体に良くないとき。"}, {"t": 561.7, "x": "授乳など、付けたままではできないお世話をしているとき。"}, {"t": 565.9, "x": "急なけがや病気で、病院へ急いで運ぶときなどです。"}, {"t": 570.1333333333333, "x": "ここで1つ、タントで気をつけたいことがあります。"}, {"t": 573.7666666666667, "x": "タントは軽自動車なので、乗れるのは運転する人を入れて4人までです。"}, {"t": 579.1666666666666, "x": "おじいさんとおばあさん、お孫さん2人でもういっぱいです。"}, {"t": 583.7333333333333, "x": "警察庁は、チャイルドシートを使わないときの危なさも数字で出しています。"}, {"t": 589.2333333333333, "x": "亡くなる割合が、正しく使ったときのおよそ5.3倍になるそうです。"}, {"t": 594.7333333333333, "x": "特に気をつけたいのは5歳になったお孫さんです。"}, {"t": 599.0333333333333, "x": "今年の調べでは、5歳の子が使っている割合は65.7%まで下がっていました。"}, {"t": 606.0, "x": "大きくなると嫌がる子も増えますが、6歳になるまでは使う決まりです。"}, {"t": 611.3666666666667, "x": "嫌がるお孫さんには「おじいちゃんの車の決まりだよ」と言ってあげてください。"}, {"t": 618.1666666666666, "x": "ここまでほめてきましたが、タントが向かないご家庭もあります。"}, {"t": 622.4333333333333, "x": "1つめはさきほどの人数の話です。"}, {"t": 625.9333333333333, "x": "お孫さんが3人以上いて、みんなで出かける日が多いなら、5人以上乗れる車をお考えください。"}, {"t": 633.7333333333333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
