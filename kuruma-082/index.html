<script>
const D={"name": "N-BOXとスペーシアどっち", "file": "082_N-BOXとスペーシアどっち", "dur": 804.56665625, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "今日は答えを最初に言ってしまいます。"}, {"t": 5.866666666666666, "x": "七十代のかたに店長がすすめるのは、スペーシアです。"}, {"t": 10.1, "x": "ただしひとつ条件が付きます。"}, {"t": 12.633333333333333, "x": "その条件を外すかたには、答えが逆になります。"}, {"t": 16.866666666666667, "x": "N-BOXのほうが良いということです。"}, {"t": 19.5, "x": "この条件が何なのかは、五つめの章でくわしくお話しします。"}, {"t": 24.4, "x": "きっかけはお店に来られたご夫婦の一言でした。"}, {"t": 27.9, "x": "「前の動画ではスペーシアと言っていましたね」。"}, {"t": 31.166666666666668, "x": "「でも近所の駐車場は、どこを見てもN-BOXなんです」。"}, {"t": 35.86666666666667, "x": "「みんなが乗っている車のほうが、安心じゃありませんか」。"}, {"t": 39.96666666666667, "x": "もっともなご質問です。"}, {"t": 42.06666666666667, "x": "数字で見ても、この二台は軽自動車の一番と二番です。"}, {"t": 46.8, "x": "全国軽自動車協会連合会の発表を見てみます。"}, {"t": 50.8, "x": "今年の四月から九月までの半年で、N-BOXは10万1564台でした。"}, {"t": 57.266666666666666, "x": "スペーシアは8万296台です。"}, {"t": 60.86666666666667, "x": "九月の一か月だけでも順位は同じでした。"}, {"t": 64.16666666666667, "x": "差はおよそ二万台ですから、たしかに街で見かけるのはN-BOXです。"}, {"t": 69.6, "x": "ですが売れている数と、七十代のかたに合うかどうかは別のお話です。"}, {"t": 75.26666666666667, "x": "今日はこの二台だけを、ひとつずつ並べて比べていきます。"}, {"t": 79.66666666666667, "x": "章ごとに勝ち負けを付けて、最後に表にまとめます。"}, {"t": 85.4, "x": "比べる前に同じところを先に片付けておきます。"}, {"t": 89.03333333333333, "x": "同じところで迷うのは時間がもったいないからです。"}, {"t": 93.0, "x": "まず外の大きさです。"}, {"t": 95.1, "x": "二台とも長さは3メートル39センチ5ミリです。"}, {"t": 99.73333333333333, "x": "幅は1メートル47センチ5ミリで、こちらもぴったり同じです。"}, {"t": 104.93333333333334, "x": "軽自動車には大きさの上限があります。"}, {"t": 107.93333333333334, "x": "二台ともその枠いっぱいに作ってあります。"}, {"t": 110.93333333333334, "x": "屋根の高さは、N-BOXが1790ミリ。"}, {"t": 114.9, "x": "スペーシアが1785ミリです。"}, {"t": 118.06666666666666, "x": "その差はわずか5ミリです。"}, {"t": 120.53333333333333, "x": "車庫に入るかどうかで悩むことはありません。"}, {"t": 123.76666666666667, "x": "つぎに後ろのドアです。"}, {"t": 125.96666666666667, "x": "二台とも左右どちらも横に滑るスライドドアです。"}, {"t": 130.13333333333333, "x": "隣の車にドアをぶつける心配がないのも同じです。"}, {"t": 134.23333333333332, "x": "それから税金です。"}, {"t": 136.2, "x": "軽自動車ですから、毎年の税金も車検の重量税も同じ金額になります。"}, {"t": 142.23333333333332, "x": "つまりこの二台は、外から見るとほとんど双子です。"}, {"t": 146.33333333333334, "x": "ちがいは中身と、付いてくる装備にあります。"}, {"t": 150.13333333333333, "x": "ここからはそのちがいだけを順番に見ていきます。"}, {"t": 155.06666666666666, "x": "最初は乗り降りです。"}, {"t": 157.1, "x": "七十代のかたがお店でいちばん気にされるところですね。"}, {"t": 161.66666666666666, "x": "スペーシアは、後ろの乗り口の段の高さを数字で出しています。"}, {"t": 166.66666666666666, "x": "地面から345ミリです。"}, {"t": 169.5, "x": "ドアが開いたときの入り口は、幅が600ミリです。"}, {"t": 173.7, "x": "高さは1250ミリと発表されています。"}, {"t": 177.3, "x": "持ち手を大きくした乗り降り用のグリップも付いています。"}, {"t": 181.3, "x": "一方のN-BOXは、乗り口の段の高さをホンダが数字で出していません。"}, {"t": 186.76666666666668, "x": "ですからどちらが何ミリ低いとは、今日は申し上げられません。"}, {"t": 191.26666666666668, "x": "数字の無いものを、店長の感覚で勝ち負けにするのはやめておきます。"}, {"t": 196.46666666666667, "x": "N-BOXはスライドドアの縁に、指をかけやすいくぼみを付けています。"}, {"t": 201.76666666666668, "x": "つかまる取っ手は、運転席と助手席と後ろの左右に全部付いています。"}, {"t": 207.53333333333333, "x": "どちらにもつかまる場所はある、ということです。"}, {"t": 211.23333333333332, "x": "もうひとつ室内の高さも見ておきます。"}, {"t": 214.3, "x": "N-BOXは1400ミリ、スペーシアは1415ミリです。"}, {"t": 219.3, "x": "こちらはスペーシアが15ミリ高くなっています。"}, {"t": 222.53333333333333, "x": "ただ頭を下げずに入れるのは、二台とも同じです。"}, {"t": 226.86666666666667, "x": "数字で勝ちと言えるのは、スペーシアのほうです。"}, {"t": 230.63333333333333, "x": "ただしこれは、相手が数字を出していないための勝ちです。"}, {"t": 234.96666666666667, "x": "お店では二台を続けて、乗って降りてを三回ずつしてみてください。"}, {"t": 240.13333333333333, "x": "膝の痛いほうの足から乗ってみると、ちがいが分かりやすくなります。"}, {"t": 246.53333333333333, "x": "つぎは運転席に座ったときの見え方です。"}, {"t": 249.9, "x": "七十代のかたが怖いと感じるのは、交差点で曲がるときの左右です。"}, {"t": 255.36666666666667, "x": "N-BOXはいまの型になったときに、小さな鏡を動かしました。"}, {"t": 260.1666666666667, "x": "左前の柱の内側にあった鏡を、ドアの鏡のほうへまとめたのです。"}, {"t": 265.96666666666664, "x": "これで左前の見通しがよくなったと、ホンダは説明しています。"}, {"t": 270.6333333333333, "x": "ハンドルの前の台も平らにして、前を見下ろしやすくしています。"}, {"t": 275.6333333333333, "x": "スペーシアは、前の柱そのものを細くしました。"}, {"t": 279.4, "x": "交差点で横断歩道を渡る人を見つけやすくなったと、スズキは説明しています。"}, {"t": 285.1, "x": "どちらも同じところを、ちがう方法で直しているのが面白いところです。"}, {"t": 290.4, "x": "柱の太さを角度で比べた const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
