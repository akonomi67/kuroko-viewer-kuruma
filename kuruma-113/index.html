<script>
const D={"name": "カローラとプリウスどっち", "file": "113_カローラとプリウスどっち", "dur": 819.8, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "今日は1つクイズから始めさせてください。"}, {"t": 6.0, "x": "燃費のいい車と聞いて、まず思い浮かぶのはどの車でしょうか。"}, {"t": 11.133333333333333, "x": "多くのかたがトヨタのプリウスと答えるはずです。"}, {"t": 14.733333333333333, "x": "ところが標準の形どうしで比べると、プリウスより燃費のいい車があります。"}, {"t": 20.533333333333335, "x": "それが同じトヨタの4つのドアのカローラです。"}, {"t": 24.433333333333334, "x": "しかも値段はプリウスより58万円近く安いのです。"}, {"t": 28.566666666666666, "x": "なぜそんなことが起きるのかは、第7章で数字を並べてお見せします。"}, {"t": 34.1, "x": "先日、お店に70代の前半のご主人がお見えになりました。"}, {"t": 38.86666666666667, "x": "「若いころから、ずっとカローラに乗ってきました」。"}, {"t": 42.63333333333333, "x": "「今の車も10年を超えたので、そろそろ替えどきだと思いまして」。"}, {"t": 47.43333333333333, "x": "「ところが息子が、これからはプリウスにしなよと言うんです」。"}, {"t": 51.86666666666667, "x": "「家の車庫は古くて狭いし、前の道も細いんですよ」。"}, {"t": 56.4, "x": "ご主人は慣れたカローラを続けるか、プリウスに替えるかで迷っておられました。"}, {"t": 62.13333333333333, "x": "今日はこの2台を、ご主人の暮らしに当てはめて比べていきます。"}, {"t": 66.93333333333334, "x": "答えは第9章でお伝えしますので、最後までお付き合いください。"}, {"t": 73.0, "x": "はじめに今日くらべる形をはっきり決めておきます。"}, {"t": 76.7, "x": "カローラは、トランクの付いたセダンの「カローラ」です。"}, {"t": 80.66666666666667, "x": "背の高いカローラ クロスや、荷物を多く積めるツーリングとは別の車です。"}, {"t": 87.13333333333334, "x": "今のカローラのセダンは、全部の形が1.8リットルのハイブリッドです。"}, {"t": 92.56666666666666, "x": "形は上から順にW×BとGとXの3つがあります。"}, {"t": 98.13333333333334, "x": "今日は真ん中のGで、前のタイヤを回す形にします。"}, {"t": 102.4, "x": "値段は274万5600円で、5月現在のメーカー希望小売価格です。"}, {"t": 109.3, "x": "プリウスは2.0リットルのハイブリッドの、Gという形にします。"}, {"t": 114.13333333333334, "x": "こちらも前のタイヤを回す形で、値段は332万4200円です。"}, {"t": 120.46666666666667, "x": "じつはプリウスにも1.8リットルのUという形があります。"}, {"t": 125.2, "x": "ただしUは、トヨタの決まった月払いの仕組みでしか手に入りません。"}, {"t": 130.1, "x": "お店でふつうに買うプリウスは、2.0リットルからになるわけです。"}, {"t": 135.36666666666667, "x": "雪の多い所のかたには、2台とも4つのタイヤを回す形も用意されています。"}, {"t": 141.7, "x": "使うガソリンはどちらもレギュラーです。"}, {"t": 144.73333333333332, "x": "なおプリウスはこの7月1日に改良されて、今の形になっています。"}, {"t": 150.53333333333333, "x": "今日の数字は、トヨタの新しい諸元表と装備一覧表で確かめました。"}, {"t": 158.1, "x": "ここからは外から見た大きさです。"}, {"t": 161.1, "x": "意外に思われるかもしれませんが、屋根の高さはほぼ同じです。"}, {"t": 165.9, "x": "カローラが1435ミリで、プリウスは1430ミリです。"}, {"t": 171.3, "x": "差は5ミリなので、横に並べて見ても違いは分かりません。"}, {"t": 176.0, "x": "違うのは長さで、カローラが4495ミリでプリウスが4600ミリです。"}, {"t": 182.6, "x": "プリウスのほうが10.5センチ長いことになります。"}, {"t": 186.43333333333334, "x": "幅はカローラが1745ミリで、プリウスは1780ミリです。"}, {"t": 192.53333333333333, "x": "プリウスのほうが3.5センチ広く、車庫ではここが効いてきます。"}, {"t": 197.56666666666666, "x": "前と後ろのタイヤの間の長さも、プリウスが11センチ長くなっています。"}, {"t": 203.36666666666667, "x": "地面から車の底までの高さはカローラが130ミリです。"}, {"t": 208.43333333333334, "x": "プリウスは150ミリなので、こちらはプリウスが2センチ高くとってあります。"}, {"t": 214.16666666666666, "x": "車の重さはカローラのGが1350キロで、プリウスのGが1400キロです。"}, {"t": 221.1, "x": "外の形は同じ高さのまま、プリウスがひと回り大きいと覚えてください。"}, {"t": 228.13333333333333, "x": "次はご主人がいちばん気にしていた小回りの話です。"}, {"t": 232.66666666666666, "x": "小回りのしやすさは、最小回転半径という数字で比べます。"}, {"t": 237.7, "x": "ハンドルをいっぱいに切って回った時の、円の大きさのことです。"}, {"t": 242.16666666666666, "x": "カローラのGは5.0メートルで、プリウスのGは5.4メートルです。"}, {"t": 247.8, "x": "差は40センチあり、この2台の間ではいちばん大きな違いです。"}, {"t": 253.43333333333334, "x": "40センチというと、細い道の中ではかなりのゆとりになります。"}, {"t": 258.4, "x": "狭い角を曲がる時や車庫に入れる時の、切り返しの回数に表れます。"}, {"t": 264.53333333333336, "x": "プリウスが大きく回るのは、19インチの大きなタイヤを履いているからです。"}, {"t": 269.8333333333333, "x": "プリウスのGは17インチの鉄のホイールにも替えられます。"}, {"t": 273.96666666666664, "x": "そうすると回転半径は5.3メートルまで小さくなります。"}, {"t": 278.23333333333335, "x": "それでもカローラのGの5.0メートルには届きません。"}, {"t": 282.3, "x": "なお、カローラでもいちばん上のW×Bだけは5.3メートルです。"}, {"t": 288.06666666666666, "x": "小回りを大事にするなら、カローラのGかXが向いています。"}, {"t": 294.3, "x": "続いて車の中の広さです。"}, {"t": 296.73333333333335, "x": "中の長さはカローラが1830ミリで、プリウスは1840ミリです。"}, {"t": 303.2, "x": "中の幅はカローラが1510ミリで、プリウスは1500ミリです。"}, {"t": 309.1, "x": "この2つはどちらも1センチの差なので、引き分けと言えます。"}, {"t": 313.73333333333335, "x": "違いが出たのは天井までの高さです。"}, {"t": 316.76666666666665, "x": "カローラの中は1160ミリで、プリウスの中は1130ミリです。"}, {"t": 322.4, "x": "外の屋根は同じ高さなのに、中はカローラが3センチ高いのです。"}, {"t": 327.6666666666667, "x": "プリウスの屋根は後ろへなだらかに下がるので、ここで差がつきます。" は約8.3リットルになります。"}, {"t": 503.23333333333335, "x": "ただし、プリウスを17インチの鉄のホイールにすると話が変わります。"}, {"t": 508.4, "x": "燃費は31.7キロになり、今度はプリウスのほうが上になります。"}, {"t": 513.6666666666666, "x": "このホイールにすると、プリウスの値段は11万2200円下がります。"}, {"t": 519.0333333333333, "x": "見た目より燃費と値段を取るなら、この形を覚えておいてください。"}, {"t": 524.0333333333333, "x": "一方で走る力にははっきり差があります。"}, {"t": 527.3666666666667, "x": "エンジンの力はプリウスが155馬力で、カローラは98馬力です。"}, {"t": 533.7, "x": "車を押すモーターの力もプリウスが113馬力で、カローラは95馬力です。"}, {"t": 540.5, "x": "高速道路の合流や長い上り坂では、プリウスの余裕が感じられます。"}, {"t": 546.1, "x": "ちなみに、プリウスのUとカローラはエンジンとモーターが同じ型です。"}, {"t": 552.7666666666667, "x": "次は値段の差がいくらになるかです。"}, {"t": 555.6333333333333, "x": "カローラのGが274万5600円で、プリウスのGが332万4200円でした。"}, {"t": 564.7, "x": "差は57万8600円になります。"}, {"t": 568.2, "x": "ここで、プリウスにだけ最初から付いていたシートヒーターを思い出してください。"}, {"t": 573.4666666666667, "x": "カローラのGに2万7500円で足すと、277万3100円になります。"}, {"t": 580.4, "x": "それでもプリウスとの差は55万1100円あります。"}, {"t": 584.8333333333334, "x": "この55万円でプリウスは走る力の余裕と、後ろを見張る仕組みが付いてきます。"}, {"t": 591.6, "x": "後ろの歩く人で止まるブレーキと、大きく開く後ろの扉もプリウスの側です。"}, {"t": 598.0, "x": "逆にカローラは55万円安いうえに、40センチ小さく回れます。"}, {"t": 603.8333333333334, "x": "中の天井の3センチと細めの車体と良い燃費もカローラの側です。"}, {"t": 609.3666666666667, "x": "もっと安くしたいかたには、カローラのXという形もあります。"}, {"t": 614.1666666666666, "x": "値段は238万400円で、Gより36万5200円安くなります。"}, {"t": 620.6666666666666, "x": "ただしXでは、斜め後ろの車を知らせる仕組みが3万9600円の追加です。"}, {"t": 627.6666666666666, "x": "横から来る車で止まるブレーキも、Xでは追加で付ける装備になります。"}, {"t": 633.1333333333333, "x": "なおどちらの車も、色によっては値段が上がるものがあります。"}, {"t": 637.9, "x": "お店では、付けたい装備を全部入れた見積もりどうしで比べてください。"}, {"t": 644.5, "x": "それではご主人への店長の答えです。"}, {"t": 647.5333333333333, "x": "店長はこのご主人にはカローラのGをお勧めしました。"}, {"t": 651.8, "x": "いちばんの理由は、古くて狭い車庫と細い前の道です。"}, {"t": 656.6, "x": "40センチ小さく回れるぶん、切り返しの回数が減ります。"}, {"t": 661.3, "x": "車の幅も3.5センチ細いので、車庫の柱との間にゆとりが出ます。"}, {"t": 667.0666666666667, "x": "そしてシートヒーターの2万7500円は付けていただきました。"}, {"t": 671.5, "x": "冬の朝に腰を温めながら走り出していただくためです。"}, {"t": 675.8333333333334, "x": "それでもプリウスより55万円安く収まります。"}, {"t": 679.9666666666667, "x": "ご主人はカ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
