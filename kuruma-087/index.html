<script>
const D={"name": "国の試験で安全な5台", "file": "087_国の試験で安全な5台", "dur": 831.9333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "軽自動車のN-BOXと、普通車のプリウス。"}, {"t": 6.966666666666667, "x": "国の試験で点数が高かったのはどちらだと思いますか。"}, {"t": 11.4, "x": "答えはN-BOXです。"}, {"t": 13.5, "x": "その差はわずか0.6点でした。"}, {"t": 16.7, "x": "軽は小さいから危ないと思っていたかたには意外な数字かもしれません。"}, {"t": 21.833333333333332, "x": "先日、娘さんに付き添われたお客さんがこうおっしゃいました。"}, {"t": 26.433333333333334, "x": "「安全な車にしてねと言われても、どれも安全と書いてあるんだよ」。"}, {"t": 31.566666666666666, "x": "たしかにカタログを開けばどのメーカーも安全をうたっています。"}, {"t": 36.03333333333333, "x": "それでは比べようがありません。"}, {"t": 38.333333333333336, "x": "そこで今日は、国が同じやり方で試した点数だけを物差しにします。"}, {"t": 43.6, "x": "使う数字は国が公表しているものをそのまま写しました。"}, {"t": 48.03333333333333, "x": "店長の好みや売れ行きは一切まぜません。"}, {"t": 51.43333333333333, "x": "取り上げるのは五台です。"}, {"t": 53.53333333333333, "x": "スペーシア、スイフト、プリウス、N-BOX、そしてクラウンです。"}, {"t": 58.93333333333333, "x": "五台とも2023年度という同じ年に同じ試験を受けました。"}, {"t": 64.43333333333334, "x": "点数の低い順に紹介して、最後に一位を発表します。"}, {"t": 69.23333333333333, "x": "途中で「点数は高いのに星が少ない車」のお話も出てきます。"}, {"t": 74.46666666666667, "x": "ここが今日いちばんの見どころです。"}, {"t": 78.63333333333334, "x": "この試験は「自動車アセスメント」と呼ばれています。"}, {"t": 82.63333333333334, "x": "国土交通省とナスバが、1995年度から続けている取り組みです。"}, {"t": 88.6, "x": "ねらいは二つあります。"}, {"t": 90.53333333333333, "x": "買う人が安全な車を選びやすくすること。"}, {"t": 93.93333333333334, "x": "そしてメーカーに、もっと安全な車を作ってもらうことです。"}, {"t": 98.6, "x": "試す車はよく売れている車を中心に選ばれます。"}, {"t": 102.6, "x": "しかもお店で売っている車をそのまま買ってきて試します。"}, {"t": 106.76666666666667, "x": "メーカーから借りた特別な一台ではありません。"}, {"t": 110.2, "x": "私たちが買うのと同じ車が試されているわけです。"}, {"t": 114.13333333333334, "x": "2023年度に試されたのは十六台でした。"}, {"t": 117.9, "x": "そのうち普通車が十二台で、軽自動車が四台です。"}, {"t": 122.2, "x": "試験は大きく二本立てです。"}, {"t": 124.76666666666667, "x": "一本目はぶつからないための試験です。"}, {"t": 127.7, "x": "これを予防安全と呼びます。"}, {"t": 130.33333333333334, "x": "前の車や歩く人に近づいたとき、自分でブレーキがかかるか。"}, {"t": 136.23333333333332, "x": "自転車が相手のときも同じように調べます。"}, {"t": 139.6, "x": "白線からはみ出しそうなときに元へ戻してくれるかも見ます。"}, {"t": 143.93333333333334, "x": "夜道で前を照らすライトの働きや、ペダルの踏み間違いへの備えも項目に入っています。"}, {"t": 150.73333333333332, "x": "二本目はぶつかったときの試験です。"}, {"t": 153.63333333333333, "x": "こちらは衝突安全と呼びます。"}, {"t": 156.36666666666667, "x": "人形を乗せた車を正面から壁に当てます。"}, {"t": 160.0, "x": "正面の一部だけを当てる試験や、横から当てる試験もあります。"}, {"t": 165.06666666666666, "x": "後ろから追突されたときの首の守りも調べます。"}, {"t": 169.03333333333333, "x": "さらに車の前に歩く人がいたとして、頭や脚がどれだけ守られるかも測ります。"}, {"t": 175.46666666666667, "x": "もう一つ、別枠の項目があります。"}, {"t": 178.86666666666667, "x": "事故の知らせを自動で送る装置が付いているかどうかです。"}, {"t": 184.66666666666666, "x": "2023年度の満点は197点でした。"}, {"t": 189.6, "x": "内わけは、ぶつかったときの試験が100点です。"}, {"t": 193.33333333333334, "x": "ぶつからないための試験が89点です。"}, {"t": 197.1, "x": "そして事故を知らせる装置が8点です。"}, {"t": 200.36666666666667, "x": "この合計をもとに星の数が決まります。"}, {"t": 203.6, "x": "二つの試験には、それぞれAからEまでのランクも付きます。"}, {"t": 208.4, "x": "Aがいちばん上で、Eがいちばん下です。"}, {"t": 211.9, "x": "合計が高くても、どこか一つの項目が低すぎるとAはもらえません。"}, {"t": 217.6, "x": "星は一つから五つまでの五段階です。"}, {"t": 220.66666666666666, "x": "星の数と二つのランクをセットで見るのがコツです。"}, {"t": 224.63333333333333, "x": "ここで覚えておいてほしい決まりがあります。"}, {"t": 228.03333333333333, "x": "星五つをもらうには、二つの試験の両方で最上位のAを取らねばなりません。"}, {"t": 234.0, "x": "そのうえで事故を知らせる装置も要ります。"}, {"t": 237.13333333333333, "x": "つまりどちらか片方がBなら、合計が高くても星は四つです。"}, {"t": 242.43333333333334, "x": "実際に2023年度には、こんな車がありました。"}, {"t": 246.73333333333332, "x": "トヨタのアルファードとヴェルファイアです。"}, {"t": 249.36666666666667, "x": "合計は181.78点で、今日の五台に入れたプリウスより上でした。"}, {"t": 255.73333333333332, "x": "それでも星は四つです。"}, {"t": 258.0, "x": "ぶつかったときの試験がBだったからです。"}, {"t": 260.96666666666664, "x": "星の数だけでは見えないことがある、という一つの例です。"}, {"t": 265.7, "x": "もう一つの注意は年度です。"}, {"t": 268.3, "x": "試験の中身と配点は年度によって変わります。"}, {"t": 271.93333333333334, "x": "たとえば2024年度は、満点が193.8点に変わりました。"}, {"t": 277.8, "x": "国も、年度のちがう車どうしで点数の大小は比べられないと書いています。"}, {"t": 283.8666666666667, "x": "今日の五台を同じ年度でそろえたのはそのためです。"}, {"t": 289.3333333333333, "x": "五位はスズキのスペーシアです。"}, {"t": 292.3333333333333, "x": "合計は169.75点で、星は四つでした。"}, {"t": 297.0 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
