<script>
const D={"name": "サポカー限定で乗る一台", "file": "104_サポカー限定で乗る一台", "dur": 797.1333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "今日は最初にひとつ質問をさせてください。"}, {"t": 6.266666666666667, "x": "いまお乗りの車は、サポカー限定の免許で運転できるでしょうか。"}, {"t": 11.533333333333333, "x": "すぐに「できる」と答えられるかたは、実はそう多くありません。"}, {"t": 16.3, "x": "このところ、ご家族と一緒にお店へ来られるかたが増えました。"}, {"t": 21.0, "x": "「父に限定の免許を勧めたんだけど、今の車で大丈夫かな」。"}, {"t": 25.966666666666665, "x": "こういうご相談です。"}, {"t": 27.766666666666666, "x": "調べてみると、今の車では乗れないと分かることもあります。"}, {"t": 32.3, "x": "その場合は、免許と一緒に車も替えることになります。"}, {"t": 36.46666666666667, "x": "今日はその次の一台を先に決めてしまおうというお話です。"}, {"t": 41.166666666666664, "x": "免許の申し込み方やしくみの細かいところは、今日は話しません。"}, {"t": 46.233333333333334, "x": "それは以前の回でお話ししましたので、そちらをご覧ください。"}, {"t": 51.03333333333333, "x": "今日の動画は、その続きの車選びの回だと思って聞いてください。"}, {"t": 55.93333333333333, "x": "今日の中心は、あくまで車選びです。"}, {"t": 59.53333333333333, "x": "前半では、いまの車が当てはまるかの見分けかたをお伝えします。"}, {"t": 64.53333333333333, "x": "そのあと店長が名指しする一台をご紹介します。"}, {"t": 68.46666666666667, "x": "最後にはその車をお勧めしないかたのお話もいたします。"}, {"t": 74.6, "x": "条件をひとことで言うと、2つの装備が最初から付いた車です。"}, {"t": 79.9, "x": "難しい名前がついていますが、中身はとても単純です。"}, {"t": 84.63333333333334, "x": "1つめは前の車や歩く人にぶつかりそうなとき、止まろうとするブレーキ。"}, {"t": 90.4, "x": "2つめはアクセルを踏み間違えても、急に飛び出さない仕組みです。"}, {"t": 95.1, "x": "どちらも国の基準を満たしたものに限られます。"}, {"t": 98.63333333333334, "x": "マニュアル車の場合は、1つめのブレーキだけで足ります。"}, {"t": 102.76666666666667, "x": "そしてここが今日いちばん大事な点です。"}, {"t": 106.06666666666666, "x": "あとから取り付けた装置は数に入りません。"}, {"t": 109.16666666666667, "x": "警察庁の説明にも、後付けの装置は対象にならないとはっきり書いてあります。"}, {"t": 115.2, "x": "お店でよく聞かれるのが、踏み間違いに備える後付けの装置です。"}, {"t": 120.46666666666667, "x": "古い車に付けて安心しているかたも、少なくありません。"}, {"t": 124.9, "x": "付けること自体はとても良いことです。"}, {"t": 127.8, "x": "ただ、それで限定の免許で乗れる車になるわけではないのです。"}, {"t": 132.83333333333334, "x": "それから軽自動車もこの免許の対象に入ります。"}, {"t": 136.66666666666666, "x": "軽も免許の上では普通自動車の仲間だからです。"}, {"t": 140.5, "x": "なお限定の条件を付けられるのは普通免許だけです。"}, {"t": 145.13333333333333, "x": "条件の話はここまでにして、次はいまの車の確かめかたです。"}, {"t": 151.76666666666668, "x": "いまの車が当てはまるかはどう見分ければよいのでしょう。"}, {"t": 155.7, "x": "いちばん確かなのは車検証を使う方法です。"}, {"t": 159.6, "x": "車検証は、たいてい車の中の書類入れにしまってあります。"}, {"t": 163.86666666666667, "x": "車検証には、車台番号という車ごとの番号が書いてあります。"}, {"t": 169.43333333333334, "x": "警察庁のホームページには、メーカーごとの対象の車の一覧があります。"}, {"t": 174.83333333333334, "x": "その一覧に、ご自分の車の番号が入っているかを見るのです。"}, {"t": 179.86666666666667, "x": "一覧があるのは、国内の8つのメーカーと海外の3つの会社です。"}, {"t": 185.1, "x": "ここで気をつけたいことが2つあります。"}, {"t": 187.96666666666667, "x": "1つは同じ名前の車でも、年式によって外れる場合があることです。"}, {"t": 193.53333333333333, "x": "一覧には番号の範囲がこまかく区切って書いてあります。"}, {"t": 198.03333333333333, "x": "古い年式のものはその範囲に入らないことがあるのです。"}, {"t": 202.53333333333333, "x": "たとえばホンダのN-WGNは、改良の前の型なら一覧に載っています。"}, {"t": 207.7, "x": "ところが去年の9月に改良された今の型は、記号が変わってまだ見当たりません。"}, {"t": 214.2, "x": "車の名前だけで、「うちのは大丈夫」と決めないでください。"}, {"t": 218.8, "x": "もう1つは一覧の日付です。"}, {"t": 221.56666666666666, "x": "一覧はそのつど書き直されますが、メーカーによって新しさが違います。"}, {"t": 226.86666666666667, "x": "今年の夏に書き直されたものもあれば、去年の春のままのものもあります。"}, {"t": 232.36666666666667, "x": "しばらく書き直されていない一覧もあります。"}, {"t": 235.83333333333334, "x": "番号がずらりと並んでいて、ご自分で読むのは少し骨が折れます。"}, {"t": 241.16666666666666, "x": "老眼鏡をかけても数字を追うのはなかなか大変です。"}, {"t": 245.2, "x": "そういうときは車検証を持って、販売店で見てもらうのが早道です。"}, {"t": 250.4, "x": "調べた結果が「当てはまらない」なら、いよいよ次の一台の出番です。"}, {"t": 257.1666666666667, "x": "今日お勧めするのは、日産のデイズです。"}, {"t": 260.3666666666667, "x": "背の高さがほどよい、4人乗りの軽自動車です。"}, {"t": 264.7, "x": "今の形が生まれたのは2019年で、今年の7月にも改良されました。"}, {"t": 270.5, "x": "選んだ理由は、とても分かりやすいものです。"}, {"t": 274.1666666666667, "x": "限定の免許に要る2つの装備が、全部の形に初めから付いています。"}, {"t": 279.93333333333334, "x": "いちばん手ごろな形にもいちばん高い形にもです。"}, {"t": 284.1666666666667, "x": "しかも全部の形がオートマです。"}, {"t": 286.96666666666664, "x": "どれを選んでも装備が足りずに外れる心配がありません。"}, {"t": 290.93333333333334, "x": "家族が代わりに選びに行っても間違えようがない車です。"}, {"t": 295.43333333333334, "x": "この形だけは付いていないという落とし穴がないのです。"}, {"t": 299.7, "x": "そしてもう1つ、今日いちばん大事な理由があります。"}, {"t": 303.56666666666666, "x": "警察庁の日産の一覧は、今年の7月の時点のものです。"}, {"t": 308.76666666666665, "x": "そこに、今売っているデイズの型の記号がそろって載っています。"}, {"t": 313.5, "x": "対象の装置の欄には、全部の形に標準で付いていると書かれています。"}, {"t": 319.06666666666666, "x": "日産の装備の表を見ても、2つの装備は全部の形で標準になっています。"}, {"t": 325.53333333333336, "x": "先ほどのN-WGNのような、記号のずれの心配がないわけです。"}, {"t": 330.26666666666665, "x": "新しく買っても中古で買っても、番号で確かめられる。"}, {"t": 334.46666666666664, "x": "ご家族に説明するときも、ここがいちばん伝えやすい点です。"}, {"t": 339.1, "x": "もちろん契約の前には、車検証の番号で念のため確かめてください。"}, {"t": 346.2, "x": "まずは1つめのブレーキからです。"}, {"t": 349.03333333333336, "x": "デイズのブレーキは、前に付いたカメラで前の様子を見ています。"}, {"t": 354.03333333333336, "x": "前の車や歩く人とぶつかりそうになると止まろうとします。"}, {"t": 358.8666666666667, "x": "今年の7月の改良では、このカメラが横に見渡せる幅が広がりました。"}, {"t": 364.6, "x": "日産はこれで、ブレーキの働きが良くなったと説明しています。"}, {"t": 369.5, "x": "2つめは、踏み間違いでぶつかるのを防ぐ仕組みです。"}, {"t": 373.6333333333333, "x": "止まっている所からゆっくり動き出すときに、働きます。"}, {"t": 377.93333333333334, "x": "ブレーキと間違えてアクセルを踏んでしまったときの、いちばん怖い場面への備えです。"}, {"t": 383.93333333333334, "x": "車の前と後ろには、近くの物を見張るセンサーも付いています。"}, {"t": 389.06666666666666, "x": "ここまでが限定の免許に関わる部分です。"}, {"t": 392.46666666666664, "x": "ほかにも、全部の形に付いている見張りがいくつもあります。"}, {"t": 397.03333333333336, "x": "白線からはみ出しそうになると知らせて、戻そうとする機能。"}, {"t": 401.6, "x": "前の車が動き出したのに気づかないとき、知らせてくれる機能。"}, {"t": 406.6, "x": "ふらつきに気づいて、休むように声をかけてくれる機能もあります。"}, {"t": 411.4, "x": "今年の改良では、後ろの席の荷物の忘れ物を知らせる機能も付きました。"}, {"t": 417.46666666666664, "x": "エアバッグは、前の席の正面と横と窓側のカーテン。"}, {"t": 422.4, "x": "そのうえ、運転席の膝を守るものまで付いています。"}, {"t": 426.8333333333333, "x": "上の形では、高速道路で前の車について走る機能も選べます。"}, {"t": 432.0, "x": "ただ限定の免許のためなら、そこまでは要りません。"}, {"t": 436.2, "x": "毎日の買い物や病院への行き帰りなら、Xの装備で十分です。"}, {"t": 443.1333333333333, "x": "デイズは軽のなかでは真ん中くらいの背の高さです。"}, {"t": 447.1666666666667, "x": "屋根までの高さは、前輪駆動の車で1650ミリです。"}, {"t": 453.06666666666666, "x": "背の高いスライドドアの軽ほど屋根は高くありません。"}, {"t": 457.1333333333333, "x": "それでも中の天井までは1270ミリあり、頭の上には余裕があります。"}, {"t": 463.6666666666667, "x": "後ろの席は前後に動かせるので、荷物と足もとの広さを使い分けられます。"}, {"t": 469.46666666666664, "x": "限定の免許を考えるころは、体の具合も少しずつ変わってきます。"}, {"t": 474.8, "x": "そこで見ていただきたいのが座る位置を合わせる仕組みです。"}, {"t": 479.3666666666667, "x": "デイズは全部の形に、運転席の高さを変えるレバーが付いています。"}, {"t": 485.26666666666665, "x": "レバーを何度か引いて、少しずつ座面を上げていく仕組みです。"}, {"t": 490.4, "x": "ハンドルも全部の形で、上下に角度を変えられます。"}, {"t": 494.93333333333334, "x": "座る高さを少し上げると前の見え方も乗り降りも楽になります。"}, {"t": 500.0, "x": "上げすぎると頭が天井に近づくので、ちょうどよい所を探してください。"}, {"t": 505.46666666666664, "x": "肩や腕に力が入らない姿勢は、長く運転するほど効いてきます。"}, {"t": 510.6666666666667, "x": "地面とのすき間は155ミリあります。"}, {"t": 514.1666666666666, "x": "幅は1475ミリで長さは3395ミリ、軽の枠いっぱいの大きさです。"}, {"t": 522.2666666666667, "x": "小回りの目安は、ターボの付かない形で4.5メートルです。"}, {"t": 527.2, "x": "細い道の多い住宅地でも取り回しに困ることは少ないでしょう。"}, {"t": 532.0, "x": "試乗では、座る高さとハンドルを合わせてから走り出してください。"}, {"t": 537.1, "x": "できれば、ふだんの買い物の道を一回り走らせてもらうと安心です。"}, {"t": 542.2333333333333, "x": "合わせる前と後では前の見え方がずいぶん変わります。"}, {"t": 548.3, "x": "次は値段です。"}, {"t": 550.1666666666666, "x": "メーカーの希望小売価格を消費税込みで見ていきます。"}, {"t": 554.6333333333333, "x": "いちばん手ごろなXの前輪駆動は150万400円です。"}, {"t": 560.6333333333333, "x": "顔つきの違うハイウェイスターXは、174万5700円です。"}, {"t": 566.6666666666666, "x": "Xとの差は24万5300円で、外の飾りやアルミのホイールが変わります。"}, {"t": 573.1666666666666, "x": "高速道路で前の車について走る機能が付く形は、183万4800円です。"}, {"t": 580.5666666666667, "x": "力に余裕のあるターボの形は、188万8700円からです。"}, {"t": 587.2333333333333, "x": "Xを四輪駆動にすると、17万7100円上がります。"}, {"t": 592.3666666666667, "x": "どの形を選んでも、限定の免許に要る2つの装備は同じように付いてきます。"}, {"t": 598.5, "x": "燃費は国の審査の数字で、Xの前輪駆動が1リットルあたり23.2キロです。"}, {"t": 605.4333333333333, "x": "年に3000キロ走るとすると、およそ129リットルの計算です。"}, {"t": 611.0, "x": "月にならすと11リットルほどで、給油は月に一度もあれば足ります。"}, {"t": 616.4333333333333, "x": "ガソリンは普通のレギュラーで、タンクは27リットルです。"}, {"t": 621.0666666666667, "x": "店長のお勧めはいちばん手ごろなXです。"}, {"t": 625.0333333333333, "x": "限定の免許に要る装備は、Xでも高い形でも変わらないからです。"}, {"t": 630.1333333333333, "x": "浮いたお金は、冬のタイヤや毎年の点検に回してください。"}, {"t": 634.7333333333333, "x": "雪の多い土地にお住まいなら、四輪駆動を選ぶと安心です。"}, {"t": 639.6, "x": "車庫入れが苦手なかたは、車を上から見たような映像が出るカメラも考えてください。"}, {"t": 646.0333333333333, "x": "Xでは注文のときに選ぶ追加の装備で、ハイウェイスターには初めから付いています。"}, {"t": 652.0333333333333, "x": "もう1つ、駐車のときのブレーキの形も違います。"}, {"t": 656.1666666666666, "x": "Xは足で踏む昔ながらの形です。"}, {"t": 659.5, "x": "ボタン式は、前の車について走る機能が付く形に付いています。"}, {"t": 666.3666666666667, "x": "もちろんデイズが合わないかたもいらっしゃいます。"}, {"t": 670.1, "x": "まず後ろの席に人を乗せて、乗り降りを手伝うことが多いかた。"}, {"t": 675.1, "x": "後ろの扉は普通の開き戸で、横に滑る扉ではありません。"}, {"t": 680.2666666666667, "x": "狭い駐車場で後ろの席をよく使うなら、スライドドアの軽も見てください。"}, {"t": 686.1333333333333, "x": "次に5人で乗りたいかたです。"}, {"t": 688.6666666666666, "x": "軽自動車なので、乗れるのは4人までです。"}, {"t": 692.3, "x": "3つめは高速道路で遠くまで出かけることが多いかた。"}, {"t": 696.5, "x": "Xはターボの付かないエンジンです。"}, {"t": 699.4333333333333, "x": "坂道や合流で力が足りないと感じたら、ターボの形も試してください。"}, {"t": 704.9, "x": "最後はいまの車が一覧に載っていたかたです。"}, {"t": 708.6666666666666, "x": "その場合は慌てて買い替える必要はありません。"}, {"t": 712.5, "x": "免許の条件は車を替えなくても切り替えられるからです。"}, {"t": 716.9333333333333, "x": "いまの車のまま限定の免許に切り替えればよいのです。"}, {"t": 721.4, "x": "乗り慣れた車を大事に乗るのも立派な選びかたです。"}, {"t": 726.7666666666667, "x": "今日のお話を振り返ります。"}, {"t": 729.1, "x": "限定の免許で乗れるのは、2つの装備が初めから付いた車です。"}, {"t": 734.3666666666667, "x": "後から付けた装置は数に入りません。"}, {"t": 737.4, "x": "一覧は警察庁のホームページで、だれでも見ることができます。"}, {"t": 742.0666666666667, "x": "いまの車が当てはまるかは車検証の番号と警察庁の一覧で確かめます。"}, {"t": 748.2333333333333, "x": "同じ名前の車でも、型の記号で載っていないことがあります。"}, {"t": 752.7333333333333, "x": "当てはまらなければ、店長は日産のデイズをお勧めします。"}, {"t": 757.1333333333333, "x": "2つの装備が全部の形に付いていて、今の型が一覧に載っているからです。"}, {"t": 763.2, "x": "座る高さとハンドルの角度を体に合わせて変えられます。"}, {"t": 767.6666666666666, "x": "値段は150万400円からで、お勧めは手ごろなXです。"}, {"t": 773.4333333333333, "x": "値段と装備は、今日の時点で日産が公式に出しているものです。"}, {"t": 778.5333333333333, "x": "免許を限定に切り替えるのは、運転をやめる準備ではありません。"}, {"t": 783.3333333333334, "x": "安心して運転を続けるための切り替えです。"}, {"t": 786.9666666666667, "x": "まずは今夜、車検証を出して番号を見てみてください。"}, {"t": 791.4666666666667, "x": "それが次の一台を決めるいちばん初めの一歩になります。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
