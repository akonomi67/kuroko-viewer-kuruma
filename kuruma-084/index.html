<script>
const D={"name": "中古で選ぶならこの一台", "file": "084_中古で選ぶならこの一台", "dur": 779.3, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "はじめにひとつ当ててみてください。"}, {"t": 5.366666666666666, "x": "自動ブレーキ付きのフィットは、中古車のサイトに何台並んでいるでしょう。"}, {"t": 10.8, "x": "2026年10月19日に大手の中古車サイト「グーネット」で数えてきました。"}, {"t": 17.0, "x": "フィットの「13G・L ホンダセンシング」という種類にしぼった数です。"}, {"t": 22.866666666666667, "x": "答えは百五十八台でした。"}, {"t": 25.766666666666666, "x": "ところが車両本体が八十万円以下となると、たったの二十五台です。"}, {"t": 31.133333333333333, "x": "画面いっぱいに並んでいるようで、予算で切ると六台に一台しか残りません。"}, {"t": 37.1, "x": "「中古はどれが当たりか分からない」。"}, {"t": 39.6, "x": "お店でいちばんよく聞くお悩みが、これなんですね。"}, {"t": 43.56666666666667, "x": "選べる車が多すぎると、人はかえって決められなくなります。"}, {"t": 48.3, "x": "そこで今日は、思いきって一台だけに決めてしまいます。"}, {"t": 52.56666666666667, "x": "予算は八十万円です。"}, {"t": 54.86666666666667, "x": "年式も走った距離も、種類の名前まで決めてお話しします。"}, {"t": 60.0, "x": "以前に百万円で選べる中古を五台並べた回がありました。"}, {"t": 64.6, "x": "今日はその反対です。迷う余地をなるべく残さない回にします。"}, {"t": 69.63333333333334, "x": "最後まで聞いていただくと、お店で口にする言葉まで決まります。"}, {"t": 76.0, "x": "まずは八十万円でどのあたりの車に手が届くのかを見ます。"}, {"t": 80.66666666666667, "x": "今日の主役は、三代目と呼ばれるフィットです。"}, {"t": 84.63333333333334, "x": "2013年9月から2020年2月まで売られていた型になります。"}, {"t": 90.3, "x": "この型の「13G・L ホンダセンシング」は、年式で値段がはっきり分かれます。"}, {"t": 96.63333333333334, "x": "2017年式は真ん中の値段がおよそ八十六万円でした。"}, {"t": 101.9, "x": "2018年式になると、およそ九十九万円です。"}, {"t": 106.73333333333333, "x": "2019年式では百六万円ほどまで上がります。"}, {"t": 110.9, "x": "一年新しくなるごとに十万円前後ずつ高くなる計算ですね。"}, {"t": 116.16666666666667, "x": "2020年式も六台ありましたが、八十万円に入るものはありませんでした。"}, {"t": 121.8, "x": "ですから八十万円に入ってくるのは、どうしても2017年式が中心です。"}, {"t": 127.76666666666667, "x": "実際に八十万円以下の二十五台を数えると、十六台が2017年式でした。"}, {"t": 134.33333333333334, "x": "走った距離の真ん中は八万二千キロです。"}, {"t": 137.83333333333334, "x": "八万キロと聞くと、ずいぶん走った車だと感じるかもしれません。"}, {"t": 142.86666666666667, "x": "ですが九年で八万キロなら、一年あたり九千キロほどです。"}, {"t": 147.9, "x": "買い物と通院に使ってきた車なら、ごくふつうの距離なんですね。"}, {"t": 152.93333333333334, "x": "もう一つ値段の見かたを先にそろえておきます。"}, {"t": 156.66666666666666, "x": "サイトに大きく出ている数字は車両本体の値段です。"}, {"t": 161.2, "x": "実際に払うお金には登録の手数料や税金などが上に乗ってきます。"}, {"t": 166.83333333333334, "x": "この種類で見ると、上に乗るぶんの真ん中はおよそ十三万円でした。"}, {"t": 172.03333333333333, "x": "八十万円以下の二十五台では、払う総額の真ん中が八十八万円です。"}, {"t": 178.36666666666667, "x": "本体八十万円の車は九十万円近く払う車だと覚えておいてください。"}, {"t": 186.2, "x": "それでは答えを申し上げます。"}, {"t": 188.63333333333333, "x": "八十万円で一台選ぶなら、ホンダのフィットです。"}, {"t": 192.7, "x": "型は三代目で年式は2017年式です。"}, {"t": 196.7, "x": "種類の名前は「13G・L ホンダセンシング」になります。"}, {"t": 201.56666666666666, "x": "エンジンは千三百ccのガソリン車です。前の輪で走る車を選びます。"}, {"t": 207.7, "x": "走った距離は六万キロから九万キロのあいだにしぼります。"}, {"t": 212.0, "x": "そして事故で骨組みを直した記録、修復歴が無いことです。"}, {"t": 217.06666666666666, "x": "ここまで条件を重ねても、二十五台のうち七台が残りました。"}, {"t": 222.3, "x": "一台に決めるといってもお店を選ぶ余地はちゃんとあるわけです。"}, {"t": 227.0, "x": "ハイブリッドではなくガソリン車にしたのにも訳があります。"}, {"t": 231.33333333333334, "x": "ガソリン車には走るための大きな電池が積まれていません。"}, {"t": 235.53333333333333, "x": "古くなった電池の心配をせずに九年目の車を買えるということです。"}, {"t": 241.16666666666666, "x": "千三百ccなので自動車税は千五百cc以下の区分に入ります。"}, {"t": 247.1, "x": "税金の話はのちほどくわしくいたします。"}, {"t": 250.26666666666668, "x": "ちなみにこの種類は、新車のときに百六十五万円あまりしました。"}, {"t": 255.4, "x": "九年たってその半分より安い値段で手に入るということですね。"}, {"t": 260.3, "x": "小さすぎず大きすぎない車なので、近所の細い道でも扱いやすい大きさです。"}, {"t": 267.93333333333334, "x": "ではなぜ2017年式なのか。"}, {"t": 271.06666666666666, "x": "決め手になったのは、2017年6月30日に出た改良です。"}, {"t": 276.5, "x": "このとき三代目のフィットに初めてホンダセンシングが用意されました。"}, {"t": 281.1, "x": "ホンダセンシングはぶつかりそうなときに自動でブレーキをかける仕組みです。"}, {"t": 285.8, "x": "踏み間違えたときに急に飛び出すのを抑える働きも入っています。"}, {"t": 290.46666666666664, "x": "前の車について走る手助けや、車線から外れにくくする手助けもあります。"}, {"t": 296.2, "x": "ホンダの発表では、ぜんぶで八つの働きをまとめたものです。"}, {"t": 300.9, "x": "ここで気をつけていただきたいことがあります。"}, {"t": 303.73333333333335, "x": "同じ2017年式でも、6月より前に作られた車には付いていません。"}, {"t": 309.8333333333333, "x": "しかも改良のあとでさえ付いていない仕様が用意されていました。"}, {"t": 314.3666666666667, "x": "年式だけを見て選ぶと、自動ブレーキの無い車を引くことがあるんですね。"}, {"t": 319.6333333333333, "x": "ですから見るのは年式よりも種類の名前です。"}, {"t": 323.3333333333333, "x": "名前のおしりに「ホンダセンシング」と入っているか。"}, {"t": 327.23333333333335, "x": "今日のお話でここだけは必ず持ち帰ってください。"}, {"t": 331.06666666666666, "x": "この改良では前後のバンパーも新しくなり、見た目も少し変わりました。"}, {"t": 336.8333333333333, "x": "ただ見た目で見分けようとするより、名前を見るほうがずっと確かです。"}, {"t": 341.8666666666667, "x": "2018年式まで広げれば選べる台数はたしかに増えます。"}, {"t": 347.2, "x": "ただ2018年式で八十万円以下は七台しかありませんでした。"}, {"t": 352.6, "x": "予算に入る2018年式を見つけたら、早めに見に行く値打ちがあります。"}, {"t": 358.6333333333333, "x": "逆に2017年式で名前に何も付いていない車は、どれだけ安くても外します。"}, {"t": 365.3333333333333, "x": "自動ブレーキの無い車を買い直すことになれば、安さはすぐ消えてしまいます。"}, {"t": 372.43333333333334, "x": "お店へ行ったら、この車ならではの見どころが三つあります。"}, {"t": 377.0, "x": "一つめは自動ブレーキが本当に生きているかです。"}, {"t": 381.2, "x": "名前に付いていても、前の持ち主の使いかたで状態は変わります。"}, {"t": 386.3666666666667, "x": "お店の人に「ホンダセンシングは正常に働く状態ですか」と聞いてください。"}, {"t": 391.8333333333333, "x": "エンジンをかけて、メーターに警告の表示が出ていないかも一緒に見ます。"}, {"t": 397.23333333333335, "x": "二つめは止まった状態から動き出すときの具合です。"}, {"t": 401.0, "x": "試乗をお願いして、ゆっくり発進と停止を何度かくり返します。"}, {"t": 406.2, "x": "ぎくしゃくする感じや、ひっかかる感じがあれば見送ります。"}, {"t": 410.46666666666664, "x": "九年目の車は、こうした動きに前の持ち主のくせが出やすいんですね。"}, {"t": 415.8, "x": "三つめは鍵が二本そろっているかです。"}, {"t": 418.8333333333333, "x": "今日数えた掲載の半分あまりに、スマートキーと書かれていました。"}, {"t": 424.3333333333333, "x": "鍵が一本しか無いと、なくしたときに作り直す手間がかかります。"}, {"t": 429.53333333333336, "x": "予備の鍵まで書いてある掲載は少ないので、お店で直接聞いてください。"}, {"t": 434.6333333333333, "x": "この三つはお店の人に聞けば五分で済む話です。"}, {"t": 438.8333333333333, "x": "答えをにごすお店なら、その時点で別のお店を当たりましょう。"}, {"t": 445.06666666666666, "x": "次は、八十万円でつい手が伸びる車の話です。"}, {"t": 449.6, "x": "選ばないほうがいい車には、はっきりした傾向があります。"}, {"t": 454.1333333333333, "x": "車の名前は出しません。形で覚えてください。"}, {"t": 458.0, "x": "一つめは大きなエンジンの車が安く出ているものです。"}, {"t": 462.1333333333333, "x": "自動車税はエンジンの大きさで決まります。"}, {"t": 465.3666666666667, "x": "2019年9月までに登録された車で、千五百cc以下なら年に三万四千五百円です。"}, {"t": 473.93333333333334, "x": "これが二千五百ccを超えて三千cc以下になると、五万千円になります。"}, {"t": 479.96666666666664, "x": "買うときは安くても、毎年の税金で差が開いていくわけですね。"}, {"t": 484.7, "x": "二つめは同じ年式なのに飛びぬけて安い車です。"}, {"t": 488.93333333333334, "x": "値段の出ていた百五十四台のうち、十七台に修復歴がありました。"}, {"t": 494.56666666666666, "x": "八十万円以下の二十五台にしぼると、四台がそうです。"}, {"t": 499.3333333333333, "x": "安さに目がいったら、まず修復歴の欄を見てください。"}, {"t": 504.0, "x": "修復歴のある車がすべて悪いわけではありません。"}, {"t": 508.0, "x": "ただ八十万円で一台選ぶなら、わざわざそこから選ぶ理由はありません。"}, {"t": 513.4666666666667, "x": "三つめは十三年目が近い車です。"}, {"t": 516.5333333333333, "x": "登録から十三年を超えると、自動車税はおよそ一割五分上がります。"}, {"t": 522.1333333333333, "x": "2017年式のフィットなら、その年が来るのは2030年です。"}, {"t": 527.6333333333333, "x": "あと四年ほどは、今の税金のまま乗れる計算になります。"}, {"t": 532.3, "x": "同じ八十万円でももっと古い年式なら、その日はもうすぐそこです。"}, {"t": 537.9666666666667, "x": "何年乗るつもりかを決めてから年式を見ると、損をしにくくなります。"}, {"t": 544.7666666666667, "x": "ではこの車を買ったあと一年でどんなお金がかかるのか。"}, {"t": 549.2, "x": "まず毎年かかるのが自動車税です。"}, {"t": 552.1666666666666, "x": "2019年9月より前に登録されたフィットなので、年に三万四千五百円です。"}, {"t": 559.1333333333333, "x": "次に二年に一度の車検があります。"}, {"t": 562.0666666666667, "x": "車検のたびに払う自賠責保険は、2026年11月に始まる契約から少し上がります。"}, {"t": 569.7666666666667, "x": "ふつうの乗用車の二年ぶんで、一万八千五百六十円です。"}, {"t": 574.7333333333333, "x": "一年にならすと九千円あまりということになります。"}, {"t": 578.4, "x": "車検ではこのほかに、重さで決まる税金と整備の費用がかかります。"}, {"t": 583.6, "x": "整備の費用はお店によって幅が大きいので、見積もりで確かめてください。"}, {"t": 589.1, "x": "そして任意保険です。"}, {"t": 591.3, "x": "これは年齢や等級で大きく変わります。今の保険会社に一度聞いてみましょう。"}, {"t": 597.5, "x": "ここで一つお願いがあります。"}, {"t": 599.8333333333334, "x": "買う前に、次の車検がいつ来るかを必ず確かめてください。"}, {"t": 605.0, "x": "掲載には「車検整備付」と書かれた車もあれば、残りの月が書かれた車もあります。"}, {"t": 612.0, "x": "買って半年で車検となれば、最初の一年の出費はぐっと増えます。"}, {"t": 617.2666666666667, "x": "本体の値段だけでなく、一年目に出ていくお金で比べてほしいんですね。"}, {"t": 624.0333333333333, "x": "近くでフィットが見つからなかったときの代わりも、一台だけ挙げます。"}, {"t": 628.7666666666667, "x": "マツダのデミオです。"}, {"t": 630.6666666666666, "x": "選ぶのは2018年式の「13S」という種類です。"}, {"t": 635.1666666666666, "x": "デミオは2017年4月20日の改良で、全部の種類に自動ブレーキを付けました。"}, {"t": 642.1, "x": "踏み間違えたときの飛び出しを抑える働きも一緒に付いています。"}, {"t": 646.5333333333333, "x": "斜め後ろの車を知らせる仕組みも、全部の種類にそろいました。"}, {"t": 651.7666666666667, "x": "バックで出るときに、横から来る車を知らせる仕組みもあります。"}, {"t": 656.3, "x": "ただし一部の種類は、作り始めが6月以降と発表されています。"}, {"t": 661.3666666666667, "x": "2018年式にしておけば、改良のあとの車だと分かりやすいわ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
