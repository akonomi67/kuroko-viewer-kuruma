<script>
const D={"name": "普通車ならこの一台", "file": "081_普通車ならこの一台", "dur": 809.7333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "前に軽自動車を一台だけ選んでお答えした回をお出ししました。"}, {"t": 7.8, "x": "選んだのはスズキのスペーシアでした。"}, {"t": 10.633333333333333, "x": "今日はその続きのお話です。"}, {"t": 13.233333333333333, "x": "あの回の終わりで、合わないかたのことも少しだけ申し上げました。"}, {"t": 18.333333333333332, "x": "毎週のように高速を長く走るかた。"}, {"t": 21.633333333333333, "x": "それから五人で乗ることがあるかたです。"}, {"t": 24.333333333333332, "x": "ですが合わないのは、そういうかただけではありません。"}, {"t": 28.066666666666666, "x": "数字の上では軽で足りていても気持ちが落ち着かない。"}, {"t": 32.266666666666666, "x": "そういうかたも、店にはたくさんいらっしゃいます。"}, {"t": 36.06666666666667, "x": "「軽で十分ですよ」と言われても不安が消えない。"}, {"t": 40.06666666666667, "x": "その不安は気のせいとして片づけてよいものではありません。"}, {"t": 44.266666666666666, "x": "毎日乗る車で、ずっと不安を抱えて走るのはつらいことです。"}, {"t": 49.7, "x": "今日は軽では心細いというかたに、普通車を一台だけお答えします。"}, {"t": 55.4, "x": "ただし大きな車を勧めるつもりはありません。"}, {"t": 58.7, "x": "運転できる大きさのまま、心細さだけを減らす一台です。"}, {"t": 65.0, "x": "まず、どんなときに軽で不安になるのかを整理しておきます。"}, {"t": 69.53333333333333, "x": "店でお話をうかがうと、だいたい三つの場面に分かれます。"}, {"t": 74.43333333333334, "x": "一つめは高速道路です。"}, {"t": 76.9, "x": "合流で思ったほど速度が上がらない。"}, {"t": 79.9, "x": "大きなトラックに抜かれると車ごと横に押される感じがする。"}, {"t": 84.46666666666667, "x": "そういう声をよくお聞きします。"}, {"t": 87.16666666666667, "x": "高速に乗るたびに肩に力が入る。"}, {"t": 90.26666666666667, "x": "それが続くと、遠出そのものをやめてしまうかたもいます。"}, {"t": 94.36666666666666, "x": "二つめは、ぶつかったときのことです。"}, {"t": 97.36666666666666, "x": "事故を起こすつもりで運転するかたはいません。"}, {"t": 100.73333333333333, "x": "それでも、もしもの時に家族を守れるのかは気になります。"}, {"t": 105.13333333333334, "x": "お孫さんを乗せる日は、なおさらだと思います。"}, {"t": 108.86666666666666, "x": "車が小さいと、それだけで頼りなく見えてしまう。"}, {"t": 112.8, "x": "そのお気持ちは、店長にもよく分かります。"}, {"t": 116.43333333333334, "x": "三つめは人数です。"}, {"t": 118.6, "x": "前の回のスペーシアは四人乗りの車です。"}, {"t": 122.33333333333333, "x": "ご夫婦と娘さん夫婦、それにお孫さんが一人。"}, {"t": 126.43333333333334, "x": "これだけでもう五人になります。"}, {"t": 129.0, "x": "法事やお墓参りで親せきを乗せることもあるでしょう。"}, {"t": 132.63333333333333, "x": "四人までしか乗れない車では、二台に分かれて出かけることになります。"}, {"t": 137.63333333333333, "x": "この三つのどれかに当てはまるかたは、今日の話を聞いてください。"}, {"t": 142.56666666666666, "x": "どれにも当てはまらないかたは、前の回の軽で十分です。"}, {"t": 148.86666666666667, "x": "では先に答えを申し上げます。"}, {"t": 151.56666666666666, "x": "店長が選ぶ普通車の一台は、トヨタのシエンタです。"}, {"t": 156.0, "x": "シエンタは後ろの扉が横に開くミニバンです。"}, {"t": 159.96666666666667, "x": "ミニバンと聞くと大きな車を思い浮かべるかもしれません。"}, {"t": 164.26666666666668, "x": "家族で旅行に行くような、背の高い大きな車です。"}, {"t": 168.56666666666666, "x": "ですがシエンタは、ミニバンのなかでいちばん小さい組に入ります。"}, {"t": 173.7, "x": "乗れる人数は五人か七人のどちらかを選べます。"}, {"t": 177.8, "x": "いまの形が出たのは二〇二二年の夏でした。"}, {"t": 181.93333333333334, "x": "そのあと二〇二五年の夏に装備が大きく見直されました。"}, {"t": 186.46666666666667, "x": "そして今年の八月にも改良を受けています。"}, {"t": 190.06666666666666, "x": "出てから四年たっても手が入り続けている車です。"}, {"t": 194.03333333333333, "x": "長く売られている車には、良いところがもう一つあります。"}, {"t": 198.4, "x": "部品やお店の経験がたっぷりたまっていることです。"}, {"t": 202.33333333333334, "x": "困ったことが起きても、たいていの整備工場で話が通じます。"}, {"t": 207.03333333333333, "x": "では、なぜこの一台なのか。"}, {"t": 209.83333333333334, "x": "さっきの三つの場面に沿って順にお話しします。"}, {"t": 213.53333333333333, "x": "その前に、いちばん気になる大きさの話から始めます。"}, {"t": 217.9, "x": "大きさで運転をあきらめてしまっては、元も子もないからです。"}, {"t": 224.03333333333333, "x": "普通車にしたら運転できなくなるのではないか。"}, {"t": 227.83333333333334, "x": "いちばん多いご心配がこれです。"}, {"t": 230.6, "x": "数字だけでは分かりにくいので、ここは一つずつ見ていきます。"}, {"t": 235.16666666666666, "x": "そこで前の回のスペーシアと数字を並べてみます。"}, {"t": 239.13333333333333, "x": "スペーシアの長さは3,395ミリです。"}, {"t": 243.13333333333333, "x": "シエンタは4,260ミリです。"}, {"t": 246.1, "x": "長さはおよそ87センチ長くなります。"}, {"t": 249.6, "x": "次に幅です。"}, {"t": 251.2, "x": "スペーシアは1,475ミリで、シエンタは1,695ミリです。"}, {"t": 257.43333333333334, "x": "幅の差は22センチです。"}, {"t": 260.0, "x": "片側にすると11センチずつ広がる計算になります。"}, {"t": 264.2, "x": "高さは、じつはシエンタのほうが低いのです。"}, {"t": 268.03333333333336, "x": "スペーシアは1,785ミリで、シエンタは1,695ミリです。"}, {"t": 274.53333333333336, "x": "背の高さはむしろ9センチ低くなります。"}, {"t": 277.8, "x": "最後に小回りの目安になる最小回転半径です。"}, {"t": 282.3333333333333, "x": "スペーシアは4.4メートルで、シエンタは5.0メートルです。"}, {"t": 287.3333333333333, "x": "差は60センチあります。"}, {"t": 289.4, "x": "狭い路地の角では、切り返しが一回増えるかもしれません。"}, {"t": 294.1, "x": "ここは正直に申し上げておきます。"}, {"t": 296.93333333333334, "x": "ただ幅が22センチ広がるだけなら、慣れの範囲で収まるかたが多いです。"}, {"t": 302.9, "x": "いちばん差が出るのは車の後ろの長さです。"}, {"t": 306.73333333333335, "x": "ご自宅の車庫に87センチの余裕があるか。"}, {"t": 310.8, "x": "買う前にメジャーで一度測っておいてください。"}, {"t": 313.96666666666664, "x": "よく行くスーパーの駐車場の枠も、一緒に見ておくと安心です。"}, {"t": 319.1, "x": "長さに慣れるまでは、前から入れて止められる場所を選ぶのも手です。"}, {"t": 325.8666666666667, "x": "では一つめの場面、高速道路の話です。"}, {"t": 329.76666666666665, "x": "シエンタのエンジンは1.5リットルです。"}, {"t": 332.96666666666664, "x": "軽自動車のエンジンは0.66リットルまでと決まっています。"}, {"t": 337.6666666666667, "x": "ガソリンのシエンタの力は120馬力あります。"}, {"t": 341.8, "x": "ターボの付かないスペーシアは49馬力です。"}, {"t": 345.73333333333335, "x": "どちらも、ふだんの町なかで困ることはありません。"}, {"t": 349.6333333333333, "x": "数字で比べると、二倍をこえる力の差があります。"}, {"t": 353.7, "x": "この差が出るのが合流の坂を上るときです。"}, {"t": 357.06666666666666, "x": "アクセルを深く踏みこまなくても速度が乗ってきます。"}, {"t": 361.06666666666666, "x": "エンジンの音がうなりにくいのも、疲れにくさにつながります。"}, {"t": 365.56666666666666, "x": "もう一つ、運転を手伝う装置の話をします。"}, {"t": 369.3666666666667, "x": "シエンタは前の車について走る装置が全部の種類に付いています。"}, {"t": 374.8, "x": "前の車が止まればシエンタも止まって、そのまま待ちます。"}, {"t": 379.43333333333334, "x": "渋滞の多い高速では右足の負担がずいぶん軽くなります。"}, {"t": 384.4, "x": "車線の真ん中を走るようにハンドルを支える働きもあります。"}, {"t": 388.6666666666667, "x": "もちろん手を放してよいという装置ではありません。"}, {"t": 392.1666666666667, "x": "あくまで長い距離の疲れを減らす手助けです。"}, {"t": 395.53333333333336, "x": "年に数回、遠くの家族に会いに行く。"}, {"t": 398.9, "x": "そういう使いかたなら、この差ははっきり感じられると思います。"}, {"t": 403.6666666666667, "x": "帰り道の疲れが少なければ、最後の一時間も落ち着いて走れます。"}, {"t": 410.43333333333334, "x": "二つめの場面、ぶつかったときの話です。"}, {"t": 413.8666666666667, "x": "ここでは店長の感想ではなく、国の試験の結果をお話しします。"}, {"t": 418.8333333333333, "x": "国は毎年、売られている車の安全の試験をしています。"}, {"t": 423.1, "x": "シエンタは二〇二二年度の試験を受けました。"}, {"t": 426.6, "x": "ぶつかったときの安全と、ぶつからない仕組み。"}, {"t": 430.4, "x": "その両方で、いちばん上のAという評価でした。"}, {"t": 434.6666666666667, "x": "点数は満点に対して93パーセントです。"}, {"t": 438.6, "x": "そしてその年の最高の賞をもらっています。"}, {"t": 442.46666666666664, "x": "軽の安全が劣っていると言いたいのではありません。"}, {"t": 446.06666666666666, "x": "軽にも点数の高い車はちゃんとあります。"}, {"t": 449.6666666666667, "x": "ただ心細いというお気持ちに、数字で答えられる車ではあります。"}, {"t": 454.76666666666665, "x": "もう一つ、全部の種類に付いている装備をご紹介します。"}, {"t": 459.3666666666667, "x": "運転中に急に具合が悪くなったときの装置です。"}, {"t": 463.4, "x": "運転する人が操作できなくなると、車がそれを見つけます。"}, {"t": 468.2, "x": "そしてゆっくりと速度を落として車線の中で止まります。"}, {"t": 472.46666666666664, "x": "ひとりで運転するかたにとって心強い備えです。"}, {"t": 476.3666666666667, "x": "ご夫婦のどちらかが運転するご家庭でも、助手席のかたが安心できます。"}, {"t": 482.06666666666666, "x": "頭を守る袋も、横の窓に沿って広がるものが付いています。"}, {"t": 487.2, "x": "七人乗りなら、いちばん後ろの席の横まで届きます。"}, {"t": 491.6, "x": "これで三つめの場面の人数の話にもつながります。"}, {"t": 495.56666666666666, "x": "七人乗りを選べば、五人での外出は余裕をもって乗れます。"}, {"t": 500.3333333333333, "x": "後ろの席を畳めば、法事の荷物も一緒に積めます。"}, {"t": 506.1333333333333, "x": "シエンタに決めたら、次に迷うのがここです。"}, {"t": 509.76666666666665, "x": "ハイブリッドにするか、ガソリンにするか。"}, {"t": 513.2333333333333, "x": "両方の一般的な比べかたは以前の回でお話ししました。"}, {"t": 518.1, "x": "今日はシエンタの場合だけに絞ります。"}, {"t": 520.9666666666667, "x": "いちばん安いXという種類で値段を比べてみます。"}, {"t": 524.8666666666667, "x": "五人乗りでガソリンは214万6100円です。"}, {"t": 529.5, "x": "ハイブリッドは250万4700円です。"}, {"t": 533.4, "x": "差は35万8600円になります。"}, {"t": 536.9666666666667, "x": "これは今年八月の改良のあとの値段です。"}, {"t": 540.4666666666667, "x": "お店によって変わることもあります。"}, {"t": 543.0, "x": "次に燃費です。"}, {"t": 544.7666666666667, "x": "同じXの五人乗りで、ハイブリッドは1リットルで28.4キロ。"}, {"t": 550.3666666666667, "x": "ガソリンは18.2キロです。"}, {"t": 553.0666666666667, "x": "ハイブリッドのほうが、同じ量のガソリンで五割ほど長く走れる計算です。"}, {"t": 558.8, "x": "ここで一つ、シエンタならではの分かれ目があります。"}, {"t": 562.7333333333333, "x": "四輪駆動を選べるのはハイブリッドだけなのです。"}, {"t": 566.5333333333333, "x": "雪の多い土地で四輪駆動がほしいなら、答えはもう決まります。"}, {"t": 571.8, "x": "雪の心配がなく、乗るのは近所と月に何回かの遠出だけ。"}, {"t": 576.9333333333333, "x": "それならガソリンで十分というかたも多いです。"}, {"t": 580.5, "x": "浮いたお金で、まわりを映すカメラなどを足すこともできます。"}, {"t": 585.1333333333333, "x": "走る距離が長いかたと四輪駆動がほしいかたはハイブリッド。"}, {"t": 589.9, "x": "迷ったら、この二つだけで決めてしまってかまいません。"}, {"t": 595.1666666666666, "x": "シエンタを見に行 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
