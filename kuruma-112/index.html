<style>

<script>
const D={"name": "タントとN-BOXどっち", "file": "112_タントとN-BOXどっち", "dur": 789.0333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 2.8333333333333335, "x": "今日は軽自動車の売れ行きの数字から始めます。"}, {"t": 6.466666666666667, "x": "この10月にいちばん売れた軽は、ホンダのN-BOXで1万4832台でした。"}, {"t": 13.5, "x": "三番目はダイハツのタントで1万2361台です。"}, {"t": 19.366666666666667, "x": "どちらも背が高くて後ろのドアが横に滑って開く軽です。"}, {"t": 24.266666666666666, "x": "この2台の値段の差は、いちばん手ごろな形どうしで14万800円です。"}, {"t": 30.133333333333333, "x": "ところがある装備をそろえて比べると、この差は8万円台まで縮みます。"}, {"t": 35.833333333333336, "x": "その装備が何なのかは第8章で数字を並べてお見せします。"}, {"t": 40.86666666666667, "x": "店長のお店にも、この2台で迷っているご夫婦がお見えになりました。"}, {"t": 46.13333333333333, "x": "ご主人は70代の半ばで、奥さまは少し年下だそうです。"}, {"t": 51.06666666666667, "x": "「家内が膝を悪くしてから、乗り降りがつらそうなんです」。"}, {"t": 55.3, "x": "「運転するのは私だけで、行くのは買い物と病院くらいです」。"}, {"t": 61.1, "x": "「でも年に何回かは、高速道路で娘の家まで行きます」。"}, {"t": 65.83333333333333, "x": "ご主人はいちばん売れているN-BOXなら間違いないと考えていました。"}, {"t": 70.63333333333334, "x": "一方の奥さまは、柱のないタントのドアが気になっているそうです。"}, {"t": 75.5, "x": "今日はこの2台をご夫婦の暮らしに当てはめて比べます。"}, {"t": 79.63333333333334, "x": "答えは第9章でお伝えしますので、最後までお付き合いください。"}, {"t": 86.13333333333334, "x": "まずは今日比べる形をはっきりさせておきます。"}, {"t": 89.76666666666667, "x": "N-BOXは名前に何も付かない「N-BOX」という形にします。"}, {"t": 94.9, "x": "前のタイヤを回すFFで、値段は176万8800円です。"}, {"t": 100.93333333333334, "x": "これがN-BOXの中でいちばん手ごろな形です。"}, {"t": 104.6, "x": "タントは、Xという形の前のタイヤを回す2WDにします。"}, {"t": 110.03333333333333, "x": "値段は162万8000円で、いちばん手ごろなLの1つ上の形です。"}, {"t": 116.36666666666666, "x": "Lにしなかったのにはわけがあります。"}, {"t": 119.23333333333333, "x": "Lには後ろのドアを電気で開け閉めする仕組みが付かないからです。"}, {"t": 124.16666666666667, "x": "Xなら左側の後ろのドアを電気で開け閉めできます。"}, {"t": 128.53333333333333, "x": "N-BOXもいちばん手ごろな形で左側が電気で開きます。"}, {"t": 133.66666666666666, "x": "これで左のドアの条件がそろいました。"}, {"t": 136.7, "x": "どちらもターボの付かない、ふつうのエンジンの形です。"}, {"t": 141.0, "x": "乗れる人数は軽自動車なのでどちらも4人です。"}, {"t": 144.93333333333334, "x": "N-BOXは、この7月に改良されて今の形になりました。"}, {"t": 149.53333333333333, "x": "タントもこの8月の終わりに改良されています。"}, {"t": 153.03333333333333, "x": "今日の数字はどちらも新しい装備表と諸元表で確かめました。"}, {"t": 157.83333333333334, "x": "値段はどちらも税込みのメーカー希望小売価格です。"}, {"t": 163.9, "x": "次は外から見た大きさです。"}, {"t": 166.46666666666667, "x": "長さはどちらも3395ミリで、幅はどちらも1475ミリです。"}, {"t": 173.8, "x": "軽自動車の決まりの大きさいっぱいなので、ここは同じになります。"}, {"t": 178.73333333333332, "x": "違うのは高さで、N-BOXが1790ミリ、タントが1755ミリです。"}, {"t": 185.46666666666667, "x": "N-BOXのほうが、3.5センチ高いことになります。"}, {"t": 189.73333333333332, "x": "立体の駐車場を使うかたは、入れる高さを先に確かめておきましょう。"}, {"t": 195.16666666666666, "x": "小回りのしやすさは最小回転半径という数字で比べます。"}, {"t": 200.1, "x": "これはハンドルをいっぱいに切って回ったときの円の大きさです。"}, {"t": 204.9, "x": "N-BOXが4.5メートルで、タントが4.4メートルです。"}, {"t": 210.0, "x": "差は10センチなので、ここはほとんど引き分けと言えます。"}, {"t": 214.53333333333333, "x": "前と後ろのタイヤの間の長さは、N-BOXのほうが6センチ長くなっています。"}, {"t": 220.3, "x": "地面から車の底までの高さは、N-BOXが145ミリ、タントが150ミリです。"}, {"t": 227.03333333333333, "x": "外の大きさは高さを除けば双子のような2台です。"}, {"t": 231.33333333333334, "x": "ですから決め手は外ではなく中とドアにあります。"}, {"t": 236.66666666666666, "x": "いよいよ奥さまが気にしているドアの話です。"}, {"t": 240.16666666666666, "x": "タントの左側は、前のドアと後ろのドアの間に柱がありません。"}, {"t": 245.56666666666666, "x": "ダイハツはこれを「ミラクルオープンドア」と呼んでいます。"}, {"t": 250.16666666666666, "x": "この柱のないドアは、いちばん手ごろなLも含めて全部の形に付いています。"}, {"t": 256.5, "x": "前と後ろのドアを両方開けると、大きな1つの入り口になります。"}, {"t": 261.76666666666665, "x": "仕組みのくわしい話は前のタントの回でお話ししました。"}, {"t": 266.56666666666666, "x": "今日はN-BOXと比べたときの違いに絞ります。"}, {"t": 270.4, "x": "N-BOXにはこの柱のないドアはありません。"}, {"t": 273.76666666666665, "x": "そのかわりN-BOXには、前のドアを三段階で止められる仕組みがあります。"}, {"t": 279.3666666666667, "x": "全部の形に付いていてドアを少しだけ開けた所で止められます。"}, {"t": 284.73333333333335, "x": "狭い駐車場で、となりの車にドアを当てにくくなる仕組みです。"}, {"t": 289.6, "x": "後ろの電気のドアにもそれぞれ工夫があります。"}, {"t": 293.43333333333334, "x": "タントの電気のドアは鍵を持って近づくと開くように予約できます。"}, {"t": 298.6, "x": "N-BOXの電気のドアには、物のはさみ込みを防ぐ仕組みが付いています。"}, {"t": 304.06666666666666, "x": "ドアを最後まで閉めきってくれる仕組みは2台とも左右に付いています。"}, {"t": 309.0, "x": "右側のドアも電気にしたいときは、タントのXなら5万5000円です。"}, {"t": 314.53333333333336, "x": "N-BOXの右側はほかの装備と組になったセットで付けることになります。"}, {"t": 319.8, "x": "奥さまの キングブレーキは、どちらもスイッチで掛ける電気の仕組みです。"}, {"t": 489.2, "x": "ただしタントでも、いちばん手ごろなLだけは足で踏むブレーキになります。"}, {"t": 494.53333333333336, "x": "ここも今日Xを選んだわけの1つです。"}, {"t": 499.06666666666666, "x": "次はお財布にかかわる燃費です。"}, {"t": 501.8666666666667, "x": "国の決まった測りかたで、タントは1リットルあたり22.6キロ走ります。"}, {"t": 507.6333333333333, "x": "N-BOXは21.6キロなので、1キロの差でタントが上です。"}, {"t": 513.1, "x": "1000キロ走るのに要るガソリンの量で比べてみます。"}, {"t": 517.2, "x": "タントは約44.2リットルで、N-BOXは約46.3リットルです。"}, {"t": 523.5333333333333, "x": "差は約2.1リットルになります。"}, {"t": 526.4333333333333, "x": "走る距離が短いかたほど、この差はお財布に小さく響きます。"}, {"t": 531.7, "x": "車の重さは、タントが880キロでN-BOXが910キロです。"}, {"t": 537.6666666666666, "x": "タントのほうが30キロ軽くなっています。"}, {"t": 540.7, "x": "燃費の勝ちはタントですが、差は大きくないと言ってよいでしょう。"}, {"t": 546.7, "x": "いよいよ第1章でお約束した値段の話です。"}, {"t": 550.5333333333333, "x": "いちばん手ごろな形どうしの差は、14万800円でした。"}, {"t": 555.6666666666666, "x": "ここで、さきほどの前の車について走る仕組みを思い出してください。"}, {"t": 560.7, "x": "N-BOXには最初から付いていて、タントのXでは5万5000円のセットでした。"}, {"t": 566.4666666666667, "x": "このセットをタントに足すと、タントは168万3000円になります。"}, {"t": 572.1, "x": "するとN-BOXとの差は、8万5800円まで縮まります。"}, {"t": 577.2666666666667, "x": "これが第1章でお話しした8万円台の中身です。"}, {"t": 581.7, "x": "この8万5800円の差で、N-BOXは中の高さの3センチが手に入ります。"}, {"t": 588.1, "x": "前のドアを三段階で止められる仕組みも、N-BOXの側に付いてきます。"}, {"t": 593.7666666666667, "x": "逆にタントは、8万5800円安いうえに柱のないドアが付いてきます。"}, {"t": 599.9666666666667, "x": "38センチ動く助手席と、1キロ良い燃費もタントの側です。"}, {"t": 605.4666666666667, "x": "なお、どちらも色によって値段が上がるものがあります。"}, {"t": 609.2333333333333, "x": "お店では、付けたい装備を全部入れた見積もりどうしで比べてください。"}, {"t": 616.0, "x": "それではご夫婦への店長の答えです。"}, {"t": 619.1333333333333, "x": "店長は、このご夫婦にはタントのXをお勧めしました。"}, {"t": 623.5666666666667, "x": "いちばんの理由は奥さまの膝です。"}, {"t": 626.4666666666667, "x": "柱のないドアなら、入り口が広いぶん足の運びに余裕が出ます。"}, {"t": 631.7333333333333, "x": "助手席を後ろに下げれば、膝を曲げすぎずに座ることもできます。"}, {"t": 638.3, "x": "そして、前の車について走るセットの5万5000円は付けていただきました。"}, {"t": 644.0666666666667, "x": "高速道路で娘さんの家へ行くご主人の、右足の疲れを減らすためです。"}, {"t": 650.2666666666667, "x": "それでも、N-BOXより8万5800円安く収まります。"}, {"t": 655.4, "x": "奥さまはお店でタントの助手席 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
