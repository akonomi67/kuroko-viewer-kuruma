<style>

<script>
const D={"name": "小さな高級車の一台", "file": "102_小さな高級車の一台", "dur": 817.9333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "「車を小さくしたいんだ。でも安っぽいのはいやなんだよ」。"}, {"t": 7.5, "x": "先日お店でこんなご相談を受けました。"}, {"t": 10.766666666666667, "x": "40年近く、大きなセダンを乗り継いでこられたかたです。"}, {"t": 15.6, "x": "お話をうかがうと理由ははっきりしていました。"}, {"t": 19.3, "x": "家の前の細い道で、すれ違うたびに気を使うようになった。"}, {"t": 24.233333333333334, "x": "スーパーの駐車場では、枠に入れるのに何度も切り返してしまう。"}, {"t": 29.066666666666666, "x": "だから車を小さくしたいというのです。"}, {"t": 32.2, "x": "ところがお店に並ぶ小さな車を見ても気持ちが乗らない。"}, {"t": 36.4, "x": "「これに乗るのかと思うと、さびしくなるんだ」とおっしゃいました。"}, {"t": 40.833333333333336, "x": "このお気持ちは店長にもよく分かります。"}, {"t": 43.96666666666667, "x": "車は長いあいだご自分の頑張りの印でもあったはずです。"}, {"t": 48.96666666666667, "x": "小さくすることが何かをあきらめることに思えてしまうのです。"}, {"t": 53.233333333333334, "x": "今日はそういうかたに向けて一台をはっきりお勧めします。"}, {"t": 57.8, "x": "値段は決して安くありません。"}, {"t": 60.2, "x": "それでも、ここまで頑張ってきたご自分へのごほうびに選んでいい車です。"}, {"t": 65.5, "x": "大きさもお金も、いいところだけでなく正直にお話しします。"}, {"t": 71.8, "x": "大きな車から降りようと考えるきっかけは、だいたい決まっています。"}, {"t": 76.9, "x": "1つめは道と駐車場です。"}, {"t": 79.46666666666667, "x": "年を重ねると、車の四隅がどこにあるのか分かりにくくなります。"}, {"t": 84.6, "x": "狭い道で向こうから車が来ると、それだけで肩に力が入ります。"}, {"t": 89.93333333333334, "x": "2つめは車庫入れです。"}, {"t": 92.1, "x": "バックで入れるときに、首を大きく後ろへ回すのがつらくなってきます。"}, {"t": 97.1, "x": "3つめは乗る人数が減ったことです。"}, {"t": 100.0, "x": "子どもたちが家を出て、乗るのはご夫婦2人という日がほとんどです。"}, {"t": 105.16666666666667, "x": "5人がゆったり座れる大きな車を、もう持て余しているのです。"}, {"t": 110.5, "x": "一方で小さくしたくない理由もあります。"}, {"t": 113.6, "x": "いちばん大きいのは乗り心地と静かさです。"}, {"t": 116.96666666666667, "x": "大きな車に長く乗ってきたかたは、道のでこぼこの感じを体で覚えています。"}, {"t": 122.93333333333334, "x": "小さな車に試乗すると、揺れや音がどうしても気になってしまう。"}, {"t": 127.9, "x": "もう1つは見た目と内装です。"}, {"t": 130.63333333333333, "x": "ドアを開けたとき、座ったとき、ハンドルを握ったとき。"}, {"t": 135.36666666666667, "x": "そこで安く作ってあるなと感じると、乗るたびにがっかりします。"}, {"t": 140.26666666666668, "x": "いい車に乗ってきたかたほど、この差にすぐ気づかれます。"}, {"t": 144.73333333333332, "x": "ですから答えはただ小さいだけの車ではありません。"}, {"t": 148.53333333333333, "x": "小さいけれど、作りは大きな車に負けない車です。"}, {"t": 154.4, "x": "今日の答えはレクサスのLBXです。"}, {"t": 157.96666666666667, "x": "レクサスの車のなかでいちばん小さな車です。"}, {"t": 161.7, "x": "日本で注文を受け始めたのは2023年の11月でした。"}, {"t": 167.43333333333334, "x": "発売は同じ年の12月の下旬と案内されていました。"}, {"t": 171.8, "x": "形は背の少し高い小さなSUVです。"}, {"t": 175.63333333333333, "x": "レクサスは発表のときに、大きさの序列を超える車だと説明していました。"}, {"t": 181.06666666666666, "x": "大きい車ほど上等で、小さい車は格下という昔からの見方があります。"}, {"t": 187.13333333333333, "x": "それを変えたいという意味だと店長は受け取っています。"}, {"t": 190.96666666666667, "x": "つまり初めから、大きな車に乗ってきた人に向けて作られた車なのです。"}, {"t": 196.23333333333332, "x": "エンジンは1.5リットルの三気筒で、モーターと組んだハイブリッドです。"}, {"t": 201.6, "x": "前輪で走る形と、後ろにもモーターを付けた四輪駆動があります。"}, {"t": 207.46666666666667, "x": "そして今年の10月に改良が発表されました。"}, {"t": 211.23333333333332, "x": "11月3日からは新しくなった形が売られています。"}, {"t": 215.7, "x": "この改良で、全部の形にドライブレコーダーが付くようになりました。"}, {"t": 220.96666666666667, "x": "速さなどを前のガラスに映すカラーの表示も、全部の形に付きます。"}, {"t": 226.7, "x": "足回りにも手が入り、荒れた道での乗り心地を見直したそうです。"}, {"t": 232.0, "x": "小さくしても格は下げない。"}, {"t": 234.4, "x": "そういう乗り換えにぴったりの一台です。"}, {"t": 238.9, "x": "ここからは大きさの話です。"}, {"t": 241.36666666666667, "x": "良いところだけでなく、気をつけたいところも申し上げます。"}, {"t": 245.66666666666666, "x": "LBXの長さは4190ミリです。"}, {"t": 249.8, "x": "大きなセダンから乗り換えると、ずいぶん短く感じるはずです。"}, {"t": 254.23333333333332, "x": "屋根の高さは1545ミリです。"}, {"t": 257.6333333333333, "x": "ここで正直に申し上げたいのが幅です。"}, {"t": 260.8333333333333, "x": "LBXの幅は1825ミリあります。"}, {"t": 264.7, "x": "5ナンバーの幅の上限は1700ミリなので、12センチ以上も広いのです。"}, {"t": 270.9, "x": "つまり3ナンバーの車です。"}, {"t": 273.46666666666664, "x": "大きなセダンから乗り換えても、幅はほとんど細くならないかもしれません。"}, {"t": 278.73333333333335, "x": "すれ違いが怖いというお悩みは、LBXでは解決しにくいのです。"}, {"t": 284.03333333333336, "x": "一方で、駐車場や車庫入れのお悩みなら話は別です。"}, {"t": 288.43333333333334, "x": "長さが短いと、バックで枠に入れるときの切り返しが減ります。"}, {"t": 293.56666666666666, "x": "前を出すときもお尻が通路にはみ出しにくくなります。"}, {"t": 297.93333333333334, "x": "小回りの目安になる数字は5.2メートルです。"}, {"t": 301.8666666666667, "x": "小さな普通車と比べると、特別に小さい数字ではありません。"}, {"t": 306.46666666666664, "x": "重さは前輪で走る形で1300キロから1310キロです。"}, {"t": 312.93333333333334, "x": "ですから試乗では、いつもの車庫に入れさせてもらってください。"}, {"t": 317.43333333333334, "x": "幅と長さのどちらで困っているかを先に考えると、答えがはっきりします。"}, {"t": 324.8333333333333, "x": "小さな車でいちばん差が出るのは音です。"}, {"t": 328.56666666666666, "x": "エンジンの音、タイヤの音、雨が屋根を打つ音。"}, {"t": 333.1666666666667, "x": "高級車に長く乗ってきたかたは、こうした音にとても敏感です。"}, {"t": 338.3, "x": "LBXはここにずいぶん手間をかけています。"}, {"t": 342.1333333333333, "x": "まず三気筒のエンジンには、揺れを打ち消す軸が組み込まれています。"}, {"t": 347.1666666666667, "x": "これでゆっくり回っているときの床の震えを抑えています。"}, {"t": 351.6, "x": "エンジンと車内の間の壁には、音を吸う層と止める層を重ねています。"}, {"t": 357.46666666666664, "x": "2層だったところに吸う層をもう1枚足して、3層にしたそうです。"}, {"t": 363.1, "x": "屋根の裏にも揺れを抑える材料を使い、雨の日の音を静かにしています。"}, {"t": 368.8666666666667, "x": "マフラーの中を広げて、排気の音も小さくしています。"}, {"t": 373.4, "x": "座席にもこだわりがあります。"}, {"t": 375.6, "x": "座面は体を深く受け止めるように吊った作りです。"}, {"t": 379.46666666666664, "x": "曲がるときに体が横へずれにくいように考えられています。"}, {"t": 383.9, "x": "背もたれは背筋が自然に伸びる形です。"}, {"t": 387.4, "x": "頭の揺れを減らして、目線が落ち着くようにしたといいます。"}, {"t": 391.96666666666664, "x": "ドアの開け方も少し変わっています。"}, {"t": 394.93333333333334, "x": "取っ手のスイッチを押すと、電気の力で扉の留め金が外れる仕組みです。"}, {"t": 400.5, "x": "引っかかりのないなめらかな手ざわりで扉が開きます。"}, {"t": 404.93333333333334, "x": "試乗では、ラジオを消して5分だけ黙って走ってみてください。"}, {"t": 409.8333333333333, "x": "今の車と比べてどう聞こえるか。"}, {"t": 412.6666666666667, "x": "それがいちばん正直な答えになります。"}, {"t": 417.1333333333333, "x": "次は安全の話です。"}, {"t": 419.46666666666664, "x": "ぶつかりそうなときに止まろうとするブレーキは、全部の形に付いています。"}, {"t": 425.06666666666666, "x": "車と歩く人と自転車、そしてオートバイまで見分けます。"}, {"t": 429.8666666666667, "x": "歩く人と自転車は昼だけでなく夜も見ています。"}, {"t": 434.1, "x": "交差点を曲がるときは、向かってくる車や渡る人にも働きます。"}, {"t": 439.1666666666667, "x": "止まった所やゆっくり進むときの、踏み間違いにも備えています。"}, {"t": 444.1333333333333, "x": "前に壁や人があるのに強くアクセルを踏むと、加速を抑えるのです。"}, {"t": 449.6333333333333, "x": "駐車場で前後の壁や柱に近づきすぎたときに、ブレーキで助ける機能もあります。"}, {"t": 455.73333333333335, "x": "もう1つ心強いのが、運転する人に何かあったときの仕組みです。"}, {"t": 461.0, "x": "急に具合が悪くなって操作ができなくなると、車線の中で車を止めます。"}, {"t": 466.6666666666667, "x": "そして助けを呼ぶ連絡までしてくれます。"}, {"t": 469.6, "x": "ご家族にとっても安心できる装備ではないでしょうか。"}, {"t": 473.26666666666665, "x": "降りるときの見張りもあります。"}, {"t": 475.6333333333333, "x": "後ろから自転車や車が来ているのにドアを開けようとすると、知らせます。"}, {"t": 481.1666666666667, "x": "そのうえで、扉がすぐに開かないよう止めてくれるのです。"}, {"t": 486.03333333333336, "x": "ただし、全部が初めから付いているわけではありません。"}, {"t": 490.1, "x": "ぶつかりそうなときにハンドル操作まで手助けする機能。"}, {"t": 494.06666666666666, "x": "運転する人の顔をカメラで見守って、注意をうながす機能。"}, {"t": 499.1666666666667, "x": "この2つは、ビスポーク ビルドという特別な形を除いて追加の装備です。"}, {"t": 505.3666666666667, "x": "ほかにも、形によって付くかどうかが変わる装備があります。"}, {"t": 509.6666666666667, "x": "見積もりのときは、装備表の丸を1つずつ指でたどって確かめてください。"}, {"t": 516.7666666666667, "x": "いちばん気になるのはお値段でしょう。"}, {"t": 519.4333333333333, "x": "ここは数字をそのまま申し上げます。"}, {"t": 522.1333333333333, "x": "いちばん手ごろなのはエレガントという形で、前輪で走るもので445万円です。"}, {"t": 529.0333333333333, "x": "アクティブが465万円です。"}, {"t": 532.1, "x": "クールとリラックスはどちらも482万円です。"}, {"t": 536.3333333333334, "x": "四輪駆動にすると、どの形も26万円上がります。"}, {"t": 541.2333333333333, "x": "内装を自分で選んで仕立てるビスポーク ビルドは567万円です。"}, {"t": 547.4333333333333, "x": "どれもメーカーの希望小売価格で、消費税込みの値段です。"}, {"t": 552.1333333333333, "x": "ちなみに初めて売り出されたときは、クールとリラックスが460万円でした。"}, {"t": 557.9333333333333, "x": "今はそこから22万円上がっています。"}, {"t": 561.1333333333333, "x": "ほかにターボを積んだ走り好き向けの形もありますが、今日は外します。"}, {"t": 566.2333333333333, "x": "燃費は国の審査の数字で、前輪で走るもので1リットルあたり27.7キロです。"}, {"t": 573.4, "x": "エレガントは少しだけ良くて28.0キロです。"}, {"t": 577.7333333333333, "x": "四輪駆動は26.2キロです。"}, {"t": 580.7666666666667, "x": "入れるのはレギュラーガソリンで、タンクは36リットルです。"}, {"t": 585.1333333333333, "x": "満タンにすると、計算のうえでは1000キロ近く走れることになります。"}, {"t": 590.3333333333334, "x": "高級車でもガソリン代は小さな車並みというわけです。"}, {"t": 594.8333333333334, "x": "店長のお勧めは、エレガントの前輪で走る形です。"}, {"t": 599.3666666666667, "x": "いちばん手ごろで、燃費の数字もいちばん良い形です。"}, {"t": 604.0666666666667, "x": "雪の多い土地にお住まいなら、四輪駆動を選んでください。"}, {"t": 610.1, "x": "445万円あれば、ほかの車も選べます。"}, {"t": 614.7, "x": "たとえばトヨタの小さなSUVのヤリス クロスです。"}, {"t": 618.9, "x": "ハイブリッドのZという上の形でも、前輪で走るもので299万2000円です。"}, {"t": 625.9333333333333, "x": "LBXのエレガントとの差は145万8000円になります。"}, {"t": 631.2, "x": "燃費の数字は、どちらも1リットルあたり28キロ前後でほぼ同じです。"}, {"t": 637.2666666666667, "x": "ではこの差は何に払うお金なのでしょうか。"}, {"t": 640.7, "x": "店長は3つあると考えています。"}, {"t": 643.4666666666667, "x": "1つめはさきほどお話しした静けさと座り心地です。"}, {"t": 648.0, "x": "2つめは内装の手ざわりや仕上げの細かさです。"}, {"t": 651.8666666666667, "x": "3つめはレクサスのお店で点検や相談を受けられることです。"}, {"t": 656.4333333333333, "x": "乗るたびにこの3つを気持ちよく感じられるなら、差の値打ちはあります。"}, {"t": 661.9666666666667, "x": "反対に、走って止まれば十分というかたにはヤリス クロスが賢い選び方です。"}, {"t": 668.7, "x": "どちらが正しいという話ではありません。"}, {"t": 671.7666666666667, "x": "ご自分が何にお金を払いたいかを、先に決めておくことが大切です。"}, {"t": 677.3, "x": "ご夫婦で迷ったら、この3つを紙に書いて2人で丸を付けてみてください。"}, {"t": 684.8333333333334, "x": "もちろん、この車が向かないかたもいます。"}, {"t": 688.1666666666666, "x": "まず細い道でのすれ違いがいちばんのお悩みのかたです。"}, {"t": 692.7, "x": "先ほどお話ししたとおり、幅は1825ミリあります。"}, {"t": 697.7333333333333, "x": "このかたには、幅の狭い5ナンバーの車をお勧めします。"}, {"t": 702.3, "x": "次に後ろの席に大人をよく乗せるかたです。"}, {"t": 705.9333333333333, "x": "小さな車ですから、後ろの席は必ずご自分で座って確かめてください。"}, {"t": 711.6666666666666, "x": "3つめは、ゴルフバッグなど大きな荷物をよく積むかたです。"}, {"t": 716.4, "x": "お店で実際に載せてみて、入るかどうかを見てから決めてください。"}, {"t": 721.1333333333333, "x": "最後に値段のわりに得をしたいかたです。"}, {"t": 724.5333333333333, "x": "同じ燃費や広さを安く手に入れたいなら、LBXは割高に見えるはずです。"}, {"t": 730.7, "x": "この車は損得よりも気持ちで選ぶ車です。"}, {"t": 734.2333333333333, "x": "そこに納得できるかたにだけ、店長はお勧めします。"}, {"t": 740.0333333333333, "x": "今日のお話を振り返ります。"}, {"t": 742.5, "x": "小さくしたい、でも安っぽいのはいや。"}, {"t": 745.7333333333333, "x": "その両方に応える一台として、レクサスのLBXをお勧めしました。"}, {"t": 751.3333333333334, "x": "長さは4190ミリと短く、幅は1825ミリの3ナンバーです。"}, {"t": 758.1333333333333, "x": "静けさと座り心地には、小さな車とは思えない手間がかかっています。"}, {"t": 763.7, "x": "ぶつかりそうなときのブレーキは、全部の形に付いています。"}, {"t": 768.3333333333334, "x": "値段はエレガントの445万円からで、燃費は1リットルあたり28キロ前後です。"}, {"t": 775.4, "x": "試乗に行ったら、3つだけ確かめてください。"}, {"t": 778.9666666666667, "x": "いつもの車庫にすんなり入るか。"}, {"t": 781.6333333333333, "x": "ラジオを消して走ったとき、静かだと感じるか。"}, {"t": 785.6, "x": "座ったとき、また遠くへ出かけたい気持ちがわいてくるか。"}, {"t": 790.1, "x": "3つともうなずけたら、それはもう我慢して小さくした車ではありません。"}, {"t": 795.5666666666667, "x": "値段と装備は、11月の改良のあとにレクサスが公式に出 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
