<script>
const D={"name": "アクアとノートどっち", "file": "108_アクアとノートどっち", "dur": 763.66665625, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.1, "x": "今日は少し不思議な数字のお話から始めます。"}, {"t": 6.833333333333333, "x": "トヨタのアクアと日産のノートです。"}, {"t": 9.966666666666667, "x": "どちらもガソリンで走りながら、電気の力も使う小さな車です。"}, {"t": 15.566666666666666, "x": "国の審査の燃費は、アクアのいちばん安い形で1リットルあたり34.3キロ。"}, {"t": 22.733333333333334, "x": "ノートは28.4キロです。"}, {"t": 25.4, "x": "燃費だけを見れば、アクアの勝ちがはっきりしています。"}, {"t": 29.533333333333335, "x": "ところがいちばん安い形の値段を並べると、順番が逆になります。"}, {"t": 34.9, "x": "アクアは249万7000円で、ノートは239万9100円です。"}, {"t": 41.2, "x": "燃費のいいアクアのほうが、10万円近く高いのです。"}, {"t": 45.36666666666667, "x": "お店でこの2台を並べると、たいていのかたがここで首をかしげます。"}, {"t": 50.4, "x": "先週も、70代のご夫婦がこの2台のカタログを手に来られました。"}, {"t": 56.0, "x": "「燃費がいいなら高くても元が取れるんでしょう？」。"}, {"t": 59.266666666666666, "x": "ご主人はアクアに傾いていて、奥さまはノートの値段が気になっていました。"}, {"t": 64.6, "x": "今日はこのご夫婦の問いに、数字でお答えします。"}, {"t": 68.6, "x": "そのうえで、70代のかたにはどちらか一台に決めてお勧めします。"}, {"t": 73.86666666666666, "x": "先に言っておくと、決め手は燃費でも値段でもありません。"}, {"t": 78.2, "x": "ハンドルをいっぱいに切ったときの、30センチの差です。"}, {"t": 84.16666666666667, "x": "まずは2台の同じところから確かめておきます。"}, {"t": 87.8, "x": "ひとつめは幅で、2台とも1695ミリでぴったり同じです。"}, {"t": 93.03333333333333, "x": "小型車の枠は1700ミリまでで、どちらも5ミリを残して収まっています。"}, {"t": 99.03333333333333, "x": "車庫の幅で困るかどうかは、2台のあいだで差が出ません。"}, {"t": 103.43333333333334, "x": "ふたつめは、外から充電しなくていいことです。"}, {"t": 107.33333333333333, "x": "どちらもガソリンスタンドで給油するだけで走れます。"}, {"t": 111.06666666666666, "x": "家にコンセントを用意する必要はありません。"}, {"t": 114.3, "x": "みっつめは、停めたときのブレーキの仕組みです。"}, {"t": 117.93333333333334, "x": "スイッチで掛けるパーキングブレーキが、2台ともどの形にも付いています。"}, {"t": 123.4, "x": "信号待ちでブレーキから足を離しても止まっていてくれる機能も同じです。"}, {"t": 128.53333333333333, "x": "アクアではブレーキホールドと呼び、ノートではオートブレーキホールドと呼んでいます。"}, {"t": 134.53333333333333, "x": "長い信号待ちで右足を休められるのは、年を重ねるほどありがたいものです。"}, {"t": 140.76666666666668, "x": "よっつめは、雪の多い土地のための四輪駆動が選べることです。"}, {"t": 146.03333333333333, "x": "アクアにはE-Fourという形があり、ノートにはFOURという形があります。"}, {"t": 151.63333333333333, "x": "アクアの四輪駆動は2WDより21万4500円高くなります。"}, {"t": 157.73333333333332, "x": "雪の少ない土地のかたは、2WDで十分です。"}, {"t": 162.1, "x": "ここまでは、どちらを選んでも同じです。"}, {"t": 165.46666666666667, "x": "この4つはどちらの車でも安心して任せられる部分です。"}, {"t": 170.16666666666666, "x": "違いが出るのは、走りの仕組みと燃費と小回りと車の中の広さです。"}, {"t": 177.46666666666667, "x": "まずは2台の走りの仕組みの違いです。"}, {"t": 180.66666666666666, "x": "ノートは、エンジンを電気をつくるためだけに使います。"}, {"t": 184.96666666666667, "x": "タイヤを回すのは、いつもモーターです。"}, {"t": 188.33333333333334, "x": "日産はこれを、100パーセントモーターで走る仕組みと説明しています。"}, {"t": 193.26666666666668, "x": "アクセルを踏んだ瞬間から、すっと押し出されるように動きだします。"}, {"t": 198.16666666666666, "x": "日産は静かさについても、1つ上の大きさの車に負けないと案内しています。"}, {"t": 204.0, "x": "アクアは、エンジンとモーターを場面ごとに使い分けて走ります。"}, {"t": 208.73333333333332, "x": "ゆっくり走るときはモーターだけで進み、力が要るときはエンジンも加わります。"}, {"t": 215.06666666666666, "x": "トヨタが長く磨いてきたハイブリッドの仕組みで、燃費のよさの源です。"}, {"t": 220.33333333333334, "x": "どちらが上というより、乗ったときの感じが違うのです。"}, {"t": 224.63333333333333, "x": "ノートは電気の車に近い感じで、アクアは燃費を一番に考えた感じです。"}, {"t": 230.7, "x": "この違いは、試乗で十分ほど乗ればすぐに分かります。"}, {"t": 235.1, "x": "好みが分かれるところなので、ここは勝ち負けを付けずにおきます。"}, {"t": 239.73333333333332, "x": "ここから先は、数字で比べられるところを順に見ていきます。"}, {"t": 245.9, "x": "では最初の問いに戻ります。"}, {"t": 248.2, "x": "燃費のいいアクアは、高い値段のぶんを取り返せるのでしょうか。"}, {"t": 253.13333333333333, "x": "年に5000キロ走るかたで、ざっと計算してみます。"}, {"t": 257.46666666666664, "x": "アクアなら、使うガソリンはおよそ146リットルです。"}, {"t": 262.1333333333333, "x": "ノートならおよそ176リットルです。"}, {"t": 265.26666666666665, "x": "1年で違うのは、30リットルほどになります。"}, {"t": 269.3, "x": "アクアのガソリンタンクは36リットルです。"}, {"t": 272.76666666666665, "x": "つまり差は、1年でタンク一杯に少し足りないくらいです。"}, {"t": 277.43333333333334, "x": "年に1万キロ走るかたなら、差は倍のおよそ61リットルになります。"}, {"t": 283.43333333333334, "x": "こう並べると、燃費の差がお金に効いてくるのは長く走るかたです。"}, {"t": 289.06666666666666, "x": "近所の買い物と病院が中心なら、差はそれほど大きくなりません。"}, {"t": 294.2, "x": "最初の値段の10万円近い差を取り返すには、長い年月がかかります。"}, {"t": 299.93333333333334, "x": "ガソリンの値段は時期によって変わるので、店長は年数を決めつけません。"}, {"t": 305.3666666666667, "x": "もうひとつ、国の審査の燃費は決まった試験のやりかたで測った数字です。"}, {"t": 310.6333333333333, "x": "冬の暖房や短い距離のくり返しでは、どちらの車も数字より悪くなります。"}, {"t": 317.03333333333336, "x": "ですから差の大きさも、だいたいの目安として聞いてください。"}, {"t": 321.53333333333336, "x": "走る距離が短いかたほど、燃費の勝ちは小さくなります。"}, {"t": 326.06666666666666, "x": "燃費はアクアの勝ちですが、効きかたは走る距離しだいです。"}, {"t": 332.3666666666667, "x": "ここからが今日いちばんお伝えしたいところです。"}, {"t": 335.6, "x": "ハンドルをいっぱいに切って回るとき、車が描く円の半径を比べます。"}, {"t": 341.23333333333335, "x": "アクアは5.2メートルです。"}, {"t": 343.6666666666667, "x": "大きめのタイヤを選ぶと、5.3メートルになります。"}, {"t": 347.76666666666665, "x": "ノートは4.9メートルで、四輪駆動の形も同じです。"}, {"t": 352.8333333333333, "x": "その差は30センチです。"}, {"t": 355.1333333333333, "x": "たった30センチですが、回る円の直径でいえば60センチの違いになります。"}, {"t": 361.6666666666667, "x": "30センチといえば、ものさし一本ぶんです。"}, {"t": 365.4, "x": "数字だけ聞くと、わずかに思えるかもしれません。"}, {"t": 369.1666666666667, "x": "けれどもこの差は、毎日の運転で何度も効いてきます。"}, {"t": 373.6333333333333, "x": "スーパーの駐車場で一度で枠に入るのか、切り返しが要るのか。"}, {"t": 378.76666666666665, "x": "細い路地の角を1回で曲がれるのか。"}, {"t": 382.1, "x": "家の前の道で向きを変えるときに何回ハンドルを回すのか。"}, {"t": 386.8, "x": "切り返しの回数が減ると、そのぶん前後を確かめる回数も減ります。"}, {"t": 392.1666666666667, "x": "年を重ねると、首を回して後ろを見るのがおっくうになりがちです。"}, {"t": 397.26666666666665, "x": "小回りの差は、その手間をまるごと減らしてくれます。"}, {"t": 401.43333333333334, "x": "駐車場の白い線の中で車をまっすぐに直す手間も減ります。"}, {"t": 406.23333333333335, "x": "ノートの小回りについては、坂の町の回でも少し触れました。"}, {"t": 411.1666666666667, "x": "今日はアクアと並べたことで、その強みがはっきりしました。"}, {"t": 415.46666666666664, "x": "小回りはノートの勝ちです。"}, {"t": 419.4, "x": "次は車の中の広さです。"}, {"t": 422.7, "x": "外から見た長さは、アクアが4080ミリでノートが4045ミリです。"}, {"t": 429.56666666666666, "x": "ノートのほうが3.5センチ短い車です。"}, {"t": 433.2, "x": "ところが、メーカーが測った車の中の長さは逆になります。"}, {"t": 437.8, "x": "アクアは1830ミリで、ノートは2030ミリあります。"}, {"t": 443.1666666666667, "x": "外は短いのに、中は20センチも長いのです。"}, {"t": 447.46666666666664, "x": "車の中の天井までの高さも、アクアの1190ミリに対してノートは1240ミリです。"}, {"t": 455.1333333333333, "x": "頭の上に5センチのゆとりがあります。"}, {"t": 458.26666666666665, "x": "帽子をかぶったまま乗り込むかたには、うれしい差です。"}, {"t": 462.5, "x": "外から見た屋根の高さもノートのほうが3.5センチ高くなっています。"}, {"t": 467.8333333333333, "x": "乗り込むときに、頭を下げる量がそのぶん少なくてすみます。"}, {"t": 472.5, "x": "後ろの席に家族や友だちを乗せる日にも、この広さは効いてきます。"}, {"t": 477.6, "x": "ひとつ付け加えると、車の重さはアクアのほうが軽い車です。"}, {"t": 482.8333333333333, "x": "いちばん安い形どうしで、アクアは1120キロでノートは1230キロです。"}, {"t": 489.6, "x": "それでも乗る人にとってのゆとりは、はっきりノートが上です。"}, {"t": 494.06666666666666, "x": "車の中の広さはノートの勝ちです。"}, {"t": 498.8, "x": "次は安全の装備です。"}, {"t": 501.06666666666666, "x": "ここは2台とも、とてもよくそろっています。"}, {"t": 504.6666666666667, "x": "アクアは、トヨタの案内で全車が国の勧めるサポカーSワイドとされています。"}, {"t": 510.53333333333336, "x": "交差点を曲がるときに渡ってくる歩行者や自転車にも気づく自動ブレーキです。"}, {"t": 516.4666666666667, "x": "停めるときに前後の壁にぶつかりそうなら止めようとする仕組みも全車に付きます。"}, {"t": 522.0, "x": "ノートも踏み間違いでぶつかるのを防ぐ手助けの装備がどの形にも付いています。"}, {"t": 528.0, "x": "そのうえで、アクアには1つうれしいものがあります。"}, {"t": 532.1, "x": "前と後ろを録画するドライブレコーダーが、どの形にも最初から付いているのです。"}, {"t": 538.2666666666667, "x": "もしもの事故のときの記録を、買ったその日から残せます。"}, {"t": 542.5666666666667, "x": "アクアの上の2つの形には、もう1つ付いているものがあります。"}, {"t": 547.6, "x": "車のドアを開けるときに、後ろから来る自転車を知らせる仕組みです。"}, {"t": 552.7, "x": "一方で、走っているときの急なアクセルを抑える装備は別あつかいです。"}, {"t": 558.2666666666667, "x": "アクアでは、販売店で付ける追加の装備になっています。"}, {"t": 562.5, "x": "買うときに頼まないと付いてこないので、注文書で必ず確かめてください。"}, {"t": 568.1666666666666, "x": "安全の装備はほぼ互角です。"}, {"t": 570.8, "x": "ドライブレコーダーのぶん、ここはアクアに花を持たせます。"}, {"t": 576.7666666666667, "x": "ここまでをまとめてみましょう。"}, {"t": 579.0333333333333, "x": "燃費と安全の装備はアクアです。"}, {"t": 581.9333333333333, "x": "小回りと車の中の広さと最初の値段は、ノートです。"}, {"t": 586.5333333333333, "x": "数だけでいえば、ノートが1つ多い勝ちです。"}, {"t": 590.4666666666667, "x": "けれども店長が決め手にしたのは勝った数ではありません。"}, {"t": 594.5666666666667, "x": "あとから直せるかどうかです。"}, {"t": 596.9, "x": "ドライブレコーダーは、あとからでも販売店で付けられます。"}, {"t": 601.2, "x": "燃費の差も、走る距離が短ければ小さくなります。"}, {"t": 605.5333333333333, "x": "ところがハンドルを切ったときの円の大きさは、あとから変えられません。"}, {"t": 610.4333333333333, "x": "車の中の天井の高さも、どんなにお金をかけても変わりません。"}, {"t": 615.2333333333333, "x": "70代のかたが毎日の運転で助かるのはこちらのほうです。"}, {"t": 620.1666666666666, "x": "ですから70代のかたには、店長はノートを勧めます。"}, {"t": 624.6, "x": "迷ったらノートです。"}, {"t": 626.5666666666667, "x": "ちなみに、冒頭のご夫婦も最後は奥さまの言うとおりノートに決められました。"}, {"t": 632.5666666666667, "x": "決め手はやはり const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
