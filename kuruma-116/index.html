<script>
const D={"name": "ワゴンRとN-WGNどっち", "file": "116_ワゴンRとN-WGNどっち", "dur": 814.4, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 2.966666666666667, "x": "14万6300円。"}, {"t": 5.633333333333334, "x": "これが今日の2台のいちばん安い形どうしの値段の差です。"}, {"t": 10.833333333333334, "x": "2台とは、スズキのワゴンRとホンダのN-WGNです。"}, {"t": 15.4, "x": "どちらも背が高すぎず低すぎもしない中くらいの高さの軽自動車です。"}, {"t": 20.866666666666667, "x": "後ろのドアは横に滑る形ではなく、ふつうに開くドアです。"}, {"t": 25.8, "x": "背の高い軽ほど値段が高くならず、屋根の低い軽より中はゆったりしています。"}, {"t": 31.8, "x": "近所の買い物から月に一度の遠出まで何でもこなす2台です。"}, {"t": 36.8, "x": "ワゴンRはZLという形が143万円です。"}, {"t": 41.233333333333334, "x": "N-WGNはLという形が157万6300円です。"}, {"t": 46.4, "x": "ワゴンRのこの値段は白や銀などの色の場合で、色によっては2万7500円高くなります。"}, {"t": 53.8, "x": "今日はこの14万円あまりの差で何が変わるのかを見ていきます。"}, {"t": 58.6, "x": "先に言っておくと、差のほとんどは体を守る装備と運転の姿勢に出ています。"}, {"t": 66.03333333333333, "x": "まず外の大きさからです。"}, {"t": 68.4, "x": "長さはどちらも3395ミリで、幅もどちらも1475ミリです。"}, {"t": 75.3, "x": "軽自動車の枠いっぱいの大きさで、ここは2台とも同じ数字です。"}, {"t": 80.6, "x": "屋根の高さはワゴンRが1650ミリで、N-WGNが1675ミリです。"}, {"t": 87.46666666666667, "x": "N-WGNが2.5センチ高く、中の天井もN-WGNが3.5センチ高くなっています。"}, {"t": 94.3, "x": "中の幅はワゴンRが1355ミリで、N-WGNが1350ミリです。"}, {"t": 100.96666666666667, "x": "ここはワゴンRが5ミリだけ広いのですが、座ってわかる差ではありません。"}, {"t": 106.13333333333334, "x": "前と後ろのタイヤの間の長さは、ワゴンRが2460ミリでN-WGNが2520ミリです。"}, {"t": 114.8, "x": "N-WGNのほうが6センチ長い車です。"}, {"t": 118.1, "x": "小回りの数字はワゴンRが4.4メートルで、N-WGNが4.5メートルです。"}, {"t": 124.66666666666667, "x": "ハンドルをいっぱいに切って回った時の円の大きさの数字です。"}, {"t": 129.46666666666667, "x": "せまい駐車場では、ワゴンRが10センチだけ小さく回れます。"}, {"t": 134.83333333333334, "x": "重さはワゴンRが770キロで、N-WGNが850キロです。"}, {"t": 140.4, "x": "80キロの差は、大人一人と少しくらいの重さです。"}, {"t": 144.9, "x": "地面から車の底までの高さは、ワゴンRが130ミリでN-WGNが140ミリです。"}, {"t": 152.0, "x": "段差の多い道ではこの1センチもわずかに効いてきます。"}, {"t": 158.03333333333333, "x": "ここで今日くらべる形を決めておきます。"}, {"t": 161.13333333333333, "x": "いまのワゴンRは、ZLとハイブリッドZXの2つの形だけです。"}, {"t": 166.86666666666667, "x": "ハイブリッドZXは小さなモーターがエンジンを手助けする形です。"}, {"t": 172.06666666666666, "x": "ZLは前のタイヤを回す形で、今日は自動で変速する形を見ます。"}, {"t": 178.0, "x": "ZLには手で変速する形もあり、値段は自動の形と同じです。"}, {"t": 184.0, "x": "N-WGNはLという形で、こちらも前のタイヤを回す形です。"}, {"t": 189.26666666666668, "x": "N-WGNにはほかにも形がありますが、いちばん安いのがこのLです。"}, {"t": 194.56666666666666, "x": "値段はZLが143万円で、Lが157万6300円です。"}, {"t": 201.2, "x": "どちらもメーカーの公式のメーカー希望小売価格です。"}, {"t": 205.46666666666667, "x": "毎年の軽自動車税は、自家用ならどちらも標準で1万800円です。"}, {"t": 211.56666666666666, "x": "税金では差がつかないので、今日は車の中身だけを見ていきます。"}, {"t": 216.5, "x": "使うガソリンはどちらもレギュラーです。"}, {"t": 219.4, "x": "ガソリンを入れるタンクもどちらも27リットルで同じ大きさです。"}, {"t": 226.63333333333333, "x": "次は燃費です。"}, {"t": 228.36666666666667, "x": "国の決まった測りかたで、ワゴンRのZLは1リットルあたり24.2キロ走ります。"}, {"t": 235.3, "x": "N-WGNのLは23.0キロなので、ワゴンRが1.2キロ良い数字です。"}, {"t": 241.73333333333332, "x": "信号や渋滞の多い町の中を考えた市街地モードという数字も見ておきます。"}, {"t": 248.4, "x": "こちらはワゴンRが20.2キロで、N-WGNが19.5キロです。"}, {"t": 253.93333333333334, "x": "差は0.7キロで、ここもワゴンRがわずかに良くなっています。"}, {"t": 259.2, "x": "年に3000キロを町の中だけで走るとして計算してみます。"}, {"t": 263.73333333333335, "x": "ワゴンRは約148.5リットルで、N-WGNは約153.8リットルです。"}, {"t": 270.8666666666667, "x": "差は5.3リットルほどで、1回の給油の量よりずっと少ない差です。"}, {"t": 276.43333333333334, "x": "信号の少ない郊外の道では、ワゴンRが26.2キロでN-WGNが25.0キロです。"}, {"t": 284.6333333333333, "x": "燃費は、どの数字でもワゴンRが少しずつ良い結果でした。"}, {"t": 289.96666666666664, "x": "ハイブリッドZXなら燃費は25.1キロで、町の中は23.0キロです。"}, {"t": 296.73333333333335, "x": "どの数字も試験の条件で測ったもので、冬の暖房などで悪くなります。"}, {"t": 303.46666666666664, "x": "ここからは安全の装備です。"}, {"t": 307.6333333333333, "x": "ぶつかりそうな時に自動で止まるブレーキは2台とも付いています。"}, {"t": 312.56666666666666, "x": "ワゴンRは、歩いている人や自転車も見分けるとスズキは説明しています。"}, {"t": 318.43333333333334, "x": "交差点で右や左に曲がる時の向かいの車や横断中の人にも対応します。"}, {"t": 324.76666666666665, "x": "横から近づく車と出合い頭にぶつかりそうな時にも働く仕組みです。"}, {"t": 330.6, "x": "N-WGNは、横断中の自転車や夜道の歩行者にも対応するとホンダは説明しています。"}, {"t": 337.0, "x": "踏み間違いで急に動き出すのをおさえる仕組みは、2台ともあります。"}, {"t": 341.9, "x": "前に進む時と後ろに下がる時の両方に付いています。"}, {"t": 346.3333333333333, "x": "駐車の時に前と後ろの物に近づくと、知らせるセンサーも2台ともあります。"}, {"t": 352.1, "x": "壁などにぶつかりそうな時にゆっくりの速さでもブレーキをかける仕組みもあります。"}, {"t": 357.8, "x": "N-WGNのこの仕組みは、去年の9月の改良で足されたものです。"}, {"t": 362.73333333333335, "x": "ホンダは、ガラスの壁も見分けると説明しています。"}, {"t": 366.6, "x": "車線からはみ出しそうな時にハンドルを手助けする仕組みも2台ともあります。"}, {"t": 371.76666666666665, "x": "道の標識を読み取ってメーターに出す仕組みも2台とも付いています。"}, {"t": 377.23333333333335, "x": "ぶつからないための装備は、2台ともほぼそろっていると考えてよいでしょう。"}, {"t": 382.5, "x": "ただしN-WGNには、アクセルを急に強く踏んだ時の加速をおさえる仕組みもあります。"}, {"t": 388.56666666666666, "x": "これは工場から出た時は切ってあり、販売店で別の費用をかけて入れる仕組みです。"}, {"t": 395.6, "x": "ここが今日いちばん大事な話です。"}, {"t": 398.53333333333336, "x": "ぶつかってしまった時に体を守るエアバッグの数が違います。"}, {"t": 403.06666666666666, "x": "N-WGNは、どの形にもエアバッグが6つ付いています。"}, {"t": 407.4, "x": "運転席と助手席の前に2つ、座席の横に2つ、窓の側に2つです。"}, {"t": 414.1666666666667, "x": "窓の側のものはカーテンエアバッグといって、横からの衝撃から頭を守ります。"}, {"t": 420.2, "x": "N-WGNのカーテンエアバッグは、前の席と後ろの席の両方に届く作りです。"}, {"t": 426.1333333333333, "x": "ワゴンRのZLは、運転席と助手席の前の2つだけです。"}, {"t": 431.3, "x": "ZLの装備一覧表では、座席の横と窓の側のエアバッグの欄が空いていました。"}, {"t": 437.6333333333333, "x": "ワゴンRで6つにするには、ハイブリッドZXを選ぶことになります。"}, {"t": 442.93333333333334, "x": "ハイブリッドZXの値段は、いちばん安い色で170万9400円です。"}, {"t": 449.56666666666666, "x": "これはN-WGNのLより13万3100円高い値段です。"}, {"t": 454.53333333333336, "x": "つまり同じ6つの守りなら、N-WGNのほうが安く手に入ります。"}, {"t": 459.46666666666664, "x": "近所の道でも、交差点や駐車場の出入り口では横から車が来ます。"}, {"t": 465.3, "x": "その時に、体の横と頭の横を守る袋があるかどうかは小さくない違いです。"}, {"t": 473.03333333333336, "x": "2つ目の違いは運転の姿勢です。"}, {"t": 476.26666666666665, "x": "N-WGNは、どの形でも運転席の高さを上げ下げできます。"}, {"t": 481.1666666666667, "x": "ハンドルも、上下の角度と前後の位置の両方を動かせます。"}, {"t": 485.96666666666664, "x": "背の低いかたも高いかたも前の見やすい姿勢を作りやすい車です。"}, {"t": 491.5, "x": "ワゴンRのZLには、運転席の高さを変える仕組みがありません。"}, {"t": 496.6333333333333, "x": "ハンドルの角度を変える仕組みもZLの装備一覧表では欄が空いていました。"}, {"t": 502.3666666666667, "x": "ハイブリッドZXなら、運転席の高さとハンドルの角度を変えられます。"}, {"t": 507.6666666666667, "x": "店長のお店でも、座る位置をもう少し高くしたいという声をよく聞きます。"}, {"t": 513.5333333333333, "x": "座る高さが合うと、車の鼻先や道の白い線が見やすくなります。"}, {"t": 519.0, "x": "腕を伸ばしきらずにハンドルを持てると、肩も疲れにくくなります。"}, {"t": 525.5333333333333, "x": "3つ目は毎日の使い勝手の装備です。"}, {"t": 528.8333333333334, "x": "N-WGNは、運転席と助手席の両方の座面を温める仕組みが付いています。"}, {"t": 534.8, "x": "ワゴンRのZLは、運転席だけが温まります。"}, {"t": 539.2333333333333, "x": "4つのタイヤを回す形にすると、ZLも助手席まで温まります。"}, {"t": 544.4666666666667, "x": "止めておく時のブレーキも、2台で形が違います。"}, {"t": 548.4, "x": "ワゴンRのZLは、足で踏んでかけるブレーキです。"}, {"t": 553.0, "x": "N-WGNは、スイッチでかける電気のブレーキです。"}, {"t": 556.9, "x": "N-WGNのメーターは去年の改良で7インチの液晶の画面になりました。"}, {"t": 562.5333333333333, "x": "さらに信号待ちでブレーキから足を離しても、止まったままでいられる仕組みもあります。"}, {"t": 568.4666666666667, "x": "ホンダはこれをオートブレーキホールドと呼んでいます。"}, {"t": 571.9, "x": "長い信号待ちで右足を休められるのは、ありがたい装備です。"}, {"t": 576.9333333333333, "x": "高速道路で前の車についていく仕組みもN-WGNには付いています。"}, {"t": 581.8, "x": "ワゴンRのZLには付いておらず、これもハイブリッドZXの装備です。"}, {"t": 588.8666666666667, "x": "ここまでN-WGNが続きましたが、ワゴンRにも強みがあります。"}, {"t": 593.5333333333333, "x": "1つ目はやはり買う時の値段です。"}, {"t": 596.3, "x": "14万6300円安いぶん、後ろを映すカメラや冬のタイヤに回すこともできます。"}, {"t": 603.5666666666667, "x": "ZLの後ろを映すカメラは、困った時の連絡ボタンと一緒に4万6200円で付けられます。"}, {"t": 611.0666666666667, "x": "これは車を注文する時にしか付けられないので、最初に決めておきましょう。"}, {"t": 616.5, "x": "2つ目は燃費で、町の中なら1リットルあたり0.7キロの差でした。"}, {"t": 622.5333333333333, "x": "3つ目は小回りと軽さです。"}, {"t": 625.0, "x": "小回りの数字が10センチ小さく、重さは80キロ軽い車です。"}, {"t": 631.1, "x": "4つ目は4つのタイヤを回す形にした時の値段と燃費です。"}, {"t": 635.7, "x": "ワゴンRのZLの四輪駆動は、いちばん安い色で155万3200円です。"}, {"t": 642.3333333333334, "x": "N-WGNのLの四輪駆動は172万1500円で、差は16万8300円に広がります。"}, {"t": 650.3, "x": "燃費はワゴンRの四輪駆動が22.6キロで、N-WGNの四輪駆動が20.7キロです。"}, {"t": 657.8333333333334, "x": "小回りも、N-WGNは四輪駆動にすると4.7メートルになります。"}, {"t": 663.2666666666667, "x": "ワゴンRは四輪駆動でも4.4メートルのままです。"}, {"t": 667.7, "x": "ただし地面から車の底までは、N-WGNの四輪駆動が145ミリでワゴンRが130ミリです。"}, {"t": 675.9333333333333, "x": "雪の多い所で値段を抑えたいかたには、ワゴンRの四輪駆動も心強い一台です。"}, {"t": 684.4333333333333, "x": "もう1つN-WGNならではの形を紹介します。"}, {"t": 687.9333333333333, "x": "助手席がくるりと外へ回る助手席回転シート車という形です。"}, {"t": 693.9, "x": "乗り降りの時に、座席ごと体をドアのほうへ向けられます。"}, {"t": 698.4666666666667, "x": "膝や腰が痛くて、助手席に乗るのがつらいご家族のいるかたに向く形です。"}, {"t": 704.6, "x": "値段は前のタイヤを回す形で167万8600円で、Lより10万2300円高くなります。"}, {"t": 713.2333333333333, "x": "ホンダは、この席は前後に動かせないと断っています。"}, {"t": 717.5666666666667, "x": "この形もエアバッグの数や運転を助ける装備はLと同じです。"}, {"t": 723.0, "x": "体の具合によっては使いにくいこともあるので、必ず販売店で座ってみてください。"}, {"t": 730.6, "x": "それでは70代の毎日の足としての店長の答えです。"}, {"t": 735.1, "x": "店長はN-WGNのLをお勧めします。"}, {"t": 738.0666666666667, "x": "いちばんの理由はどの形にも付いている6つのエアバッグです。"}, {"t": 743.0, "x": "2つ目は、運転席の高さとハンドルの位置を体に合わせられることです。"}, {"t": 748.7, "x": "3つ目は、信号待ちで足を休められる電気のブレーキです。"}, {"t": 753.8333333333334, "x": "ワゴンRでエアバッグを6つにすると、N-WGNのLより13万3100円高くなります。"}, {"t": 761.1666666666666, "x": "燃費の差は、町の中を年に3000キロ走って5.3リットルほどでした。"}, {"t": 767.2666666666667, "x": "だからこそ、差の14万円は横の守りと座りやすさの代金だと考えてください。"}, {"t": 773.9333333333333, "x": "一方で、ワゴンRのZLが向いているかたもいます。"}, {"t": 778.2666666666667, "x": "2台とも小回りが利いて近所の細い道でも扱いやすい車です。"}, {"t": 783.7333333333333, "x": "とにかく買う時の値段を抑えたいかたと、雪の多い所で四輪駆動を選ぶかたです。"}, {"t": 790.2, "x": "最後にお店では、2台の運転席に座って座る高さをくらべてみてください。"}, {"t": 795.9666666666667, "x": "今日の数字は、11月にスズキとホンダの公式の諸元表と装備一覧表で確かめました。"}, {"t": 803.3, "x": "値段や装備は改良で変わるので、契約の前に販売店で最新の表を見せてもらってください。"}, {"t": 810.1333333333333, "x": "それでは、また店先でお会いしましょう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
