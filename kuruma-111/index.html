<script>
const D={"name": "ルーミーとシエンタどっち", "file": "111_ルーミーとシエンタどっち", "dur": 899.8333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.1, "x": "今日は最初に、1つの数字からお話しします。"}, {"t": 6.733333333333333, "x": "1リットルあたり0.2キロ。"}, {"t": 9.233333333333333, "x": "これは、トヨタのルーミーとシエンタの燃費の差です。"}, {"t": 13.233333333333333, "x": "エンジンの大きさは1.5倍も違います。それなのに、燃費はほとんど同じなのです。"}, {"t": 19.933333333333334, "x": "ルーミーとシエンタは、どちらも背の高い車です。どちらもトヨタのお店で買えます。"}, {"t": 26.366666666666667, "x": "後ろのドアは、どちらも横に滑らせて開けるスライドドアです。"}, {"t": 31.033333333333335, "x": "どちらもトヨタのお店に並びます。ですから、お店でもよく迷われる2台です。"}, {"t": 36.93333333333333, "x": "けれども中身を1つずつ比べると、性格はかなり違います。"}, {"t": 41.733333333333334, "x": "店長のお店にも、この2台で迷っているかたがお見えになりました。"}, {"t": 46.53333333333333, "x": "70代の前半のご主人です。奥さまと2人で暮らしているそうです。"}, {"t": 52.03333333333333, "x": "「孫が来るのは年に2回ほどで、ふだんは2人しか乗りません」。"}, {"t": 56.7, "x": "「それなら小さいルーミーで足りるのではないかと思うんです」。"}, {"t": 60.56666666666667, "x": "たしかにルーミーには、安く買える形があります。シエンタより50万円近く安いのです。"}, {"t": 67.1, "x": "今日は、その値段の差に見合うだけの違いがあるのかを確かめます。"}, {"t": 72.0, "x": "答えは第9章でお伝えします。どうぞ最後までお付き合いください。"}, {"t": 78.53333333333333, "x": "まずは今日比べる形をはっきりさせておきます。"}, {"t": 82.06666666666666, "x": "ルーミーはGという形の、前のタイヤを回す2WDです。"}, {"t": 88.16666666666667, "x": "後ろの左右のドアは、電気で開け閉めできます。この形には、その仕組みが付いています。"}, {"t": 95.3, "x": "シエンタは、ガソリン車のGという形の5人乗りにします。"}, {"t": 100.1, "x": "シエンタには7人乗りもあります。でも、ご夫婦2人なら5人乗りで足ります。"}, {"t": 106.0, "x": "このGにも、同じ仕組みが付いています。左右のスライドドアを電気で開け閉めできます。"}, {"t": 112.53333333333333, "x": "どちらも、真ん中の形どうしです。いちばん上でもいちばん下でもありません。"}, {"t": 118.3, "x": "なおシエンタには、ハイブリッド車もあります。これは第6章で触れます。"}, {"t": 123.63333333333334, "x": "ここで1つお伝えしておくことがあります。"}, {"t": 126.5, "x": "ルーミーはトヨタの車です。ただ、作っているのはダイハツの工場です。"}, {"t": 131.63333333333333, "x": "シエンタは、トヨタが自分の工場で作っている車です。"}, {"t": 136.1, "x": "どちらもトヨタのお店で買えます。点検も、トヨタのお店で受けられます。"}, {"t": 141.83333333333334, "x": "シエンタは、この夏の8月に改良されました。装備が新しくなっています。"}, {"t": 147.9, "x": "2台とも、国が勧める安全な車の印の「サポカーSワイド」です。"}, {"t": 154.03333333333333, "x": "ぶつかりそうなときの自動ブレーキがあります。2台とも、どの形にも付いています。"}, {"t": 160.06666666666666, "x": "踏み間違えても、急に飛び出さない仕組みがあります。これも2台そろっています。"}, {"t": 166.06666666666666, "x": "ここまでは、どちらを選んでも大きな差はありません。"}, {"t": 171.73333333333332, "x": "最初は車の大きさです。"}, {"t": 174.13333333333333, "x": "ルーミーの長さは3700ミリです。"}, {"t": 177.73333333333332, "x": "シエンタの長さは4260ミリです。ルーミーより、56センチ長くなります。"}, {"t": 184.73333333333332, "x": "幅はルーミーが1670ミリで、シエンタは1695ミリです。"}, {"t": 190.6, "x": "幅の差は2.5センチです。どちらも、1.7メートルの内側に収まります。"}, {"t": 196.9, "x": "屋根の高さは、ルーミーが1735ミリです。シエンタは1695ミリです。"}, {"t": 203.86666666666667, "x": "背の高さは、ルーミーのほうが4センチ高いのです。"}, {"t": 208.1, "x": "次に、小回りの目安になる最小回転半径という数字です。"}, {"t": 213.5, "x": "ハンドルをいっぱいに切ると、車は円を描きます。その円の半径のことです。"}, {"t": 220.0, "x": "ルーミーのGは4.6メートルです。シエンタは5.0メートルです。"}, {"t": 225.76666666666668, "x": "この40センチの差は、狭い駐車場で効いてきます。"}, {"t": 230.43333333333334, "x": "スーパーの駐車場で一度で入るか、切り返しが要るかの差になります。"}, {"t": 235.63333333333333, "x": "家の車庫が狭いかたや細い路地を通るかたには大事な数字です。"}, {"t": 240.9, "x": "56センチ短いと、車庫の奥にゆとりが生まれます。自転車を置くこともできます。"}, {"t": 247.63333333333333, "x": "地面から車の底までの高さも比べます。ルーミーが130ミリで、シエンタは140ミリです。"}, {"t": 255.4, "x": "大きさと小回りは、はっきりルーミーの勝ちです。"}, {"t": 260.6333333333333, "x": "次は乗り降りのしやすさです。"}, {"t": 263.1333333333333, "x": "後ろのスライドドアから乗るときに、足を掛ける高さを比べます。"}, {"t": 268.03333333333336, "x": "ルーミーの乗り込み口は、地面から366ミリです。"}, {"t": 272.96666666666664, "x": "シエンタの乗り込み口は、地面から330ミリです。"}, {"t": 277.4, "x": "シエンタのほうが3.6センチ低く、段差もなく平らな床です。"}, {"t": 282.3666666666667, "x": "3.6センチは、ちょうど親指の長さくらいの差です。"}, {"t": 286.73333333333335, "x": "ひざや腰が痛いかたには、この少しの差が毎日効いてきます。"}, {"t": 291.8666666666667, "x": "ただし、シエンタの四輪駆動は350ミリです。その分、差は小さくなります。"}, {"t": 298.76666666666665, "x": "つかまるところも見ておきましょう。"}, {"t": 301.23333333333335, "x": "ルーミーには、乗り降りのときにつかまる大きな取っ手があります。"}, {"t": 305.7, "x": "大人用と子ども用の2本があり、高さを2段に分けてあります。"}, {"t": 310.43333333333334, "x": "ルーミーには、足元を照らす明かりも付いています。ドアの開け閉めに合わせて点きます。"}, {"t": 316.76666666666665, "x": "シエンタは、前の席と後ろの席に2本ずつ取っ手が付いています。"}, {"t": 322.0, "x": "運転席の高さは、上下に動かせます。シエンタでは、この仕組みがどの形にも付いています。"}, {"t": 329.43333333333334, "x": "シエンタのハンドルは、上下にも前後に 333333333, "x": "シエンタには、ハイブリッド車もあります。燃費は28.0キロになります。"}, {"t": 506.9, "x": "年に5000キロ走るとします。ルーミーより、ガソリンが90リットルほど減ります。"}, {"t": 513.2333333333333, "x": "ただし、値段は上がります。ハイブリッドのGの5人乗りは283万3600円です。"}, {"t": 520.7666666666667, "x": "燃費は引き分けで、走りの力強さはシエンタの勝ちです。"}, {"t": 526.9333333333333, "x": "次は値段です。"}, {"t": 528.6666666666666, "x": "ルーミーのGの2WDは198万9900円です。"}, {"t": 534.1333333333333, "x": "シエンタのガソリン車のGの5人乗りは248万7100円です。"}, {"t": 540.2333333333333, "x": "その差は49万7200円です。ルーミーのほうが、ずいぶん安いのです。"}, {"t": 547.1, "x": "ただし、ルーミーのGでは2つの装備が追加になります。"}, {"t": 551.6666666666666, "x": "1つはスイッチで掛けるパーキングブレーキです。"}, {"t": 555.1666666666666, "x": "信号で止まったときに、ブレーキから足を離せる機能です。これも一緒に付きます。"}, {"t": 561.1333333333333, "x": "もう1つは高速道路で前の車について走る仕組みです。"}, {"t": 565.6666666666666, "x": "ルーミーでは、この2つが組み合わせになっています。値段は5万5000円です。"}, {"t": 571.5333333333333, "x": "シエンタのGには、この2つが初めから付いています。"}, {"t": 575.8333333333334, "x": "ルーミーに組み合わせを足すと、204万4900円です。"}, {"t": 580.8666666666667, "x": "シエンタとの差は44万2200円になります。"}, {"t": 585.4666666666667, "x": "ルーミーは、色によって値段が変わります。3万3000円の追加がかかる色もあります。"}, {"t": 592.0, "x": "見積もりのときは、選んだ色の値段まで確かめてください。"}, {"t": 596.0, "x": "シエンタにはXという、もっと安い形もあります。"}, {"t": 600.0, "x": "Xの5人乗りは214万6100円です。"}, {"t": 604.3, "x": "ただしXでは、電気で開くスライドドアが左側だけになります。"}, {"t": 610.0333333333333, "x": "ご夫婦で両側から乗り降りするなら、Gを選んでおくと安心です。"}, {"t": 615.3333333333334, "x": "値段はルーミーの勝ちです。"}, {"t": 619.1, "x": "では、44万円の差で何が付いてくるのでしょうか。"}, {"t": 623.5666666666667, "x": "まず、シエンタのGに付いている画面です。車を真上から見たような画面が映ります。"}, {"t": 630.1333333333333, "x": "駐車のときに使います。車のまわりを、ぐるりと画面で確かめられます。"}, {"t": 635.9666666666667, "x": "ルーミーのGではこの画面は追加の装備です。"}, {"t": 639.4666666666667, "x": "カーナビを別に付ける組み合わせで3万3000円です。"}, {"t": 643.5666666666667, "x": "画面の付いた組み合わせなら11万9900円になります。"}, {"t": 648.5, "x": "次は、斜め後ろの車を知らせる仕組みです。シエンタのGには、これがあります。"}, {"t": 654.9666666666667, "x": "車線を変えるときに役立ちます。見えにくい所にいる車を、ランプで教えてくれます。"}, {"t": 661.5333333333333, "x": "この仕組みはルーミーの装備表には見当たりません。"}, {"t": 665.1333333333333, "x": "さらにシエンタは、国の衝突の試験を受けています。結果は最高の5つ星です。"}, {"t": 671 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
