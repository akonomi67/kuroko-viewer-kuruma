<script>
const D={"name": "運転を代わる奥さまの一台", "file": "097_運転を代わる奥さまの一台", "dur": 812.36665625, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "お店をやっていてこのところ増えたご相談があります。"}, {"t": 6.833333333333333, "x": "ご夫婦そろって来られて、ご主人が先にこうおっしゃるのです。"}, {"t": 11.633333333333333, "x": "「免許を返したから、これからは家内が運転するんだ」。"}, {"t": 16.066666666666666, "x": "となりの奥さまは、少し困ったような顔で笑っておられます。"}, {"t": 20.733333333333334, "x": "ご主人のほうはどこか少しさみしそうでもあります。"}, {"t": 24.5, "x": "聞いてみると、ハンドルを握るのは何年ぶりかというかたも多いのです。"}, {"t": 29.633333333333333, "x": "結婚してからずっと運転はご主人の役目だった。"}, {"t": 33.46666666666667, "x": "奥さまはいつも助手席で道を教える係だった。"}, {"t": 37.333333333333336, "x": "そういうご夫婦が、ある日を境に席を入れ替えることになります。"}, {"t": 42.36666666666667, "x": "店長はこれまで、こうした場面に何度も立ち会ってきました。"}, {"t": 46.766666666666666, "x": "そして、うまくいくご夫婦には共通点があると感じています。"}, {"t": 51.5, "x": "それは、ご主人の車をそのまま奥さまが引き継がないことです。"}, {"t": 56.36666666666667, "x": "ご主人が選んだ車は、ご主人の体と好みに合わせた車です。"}, {"t": 62.1, "x": "奥さまが乗りやすいとは限りません。"}, {"t": 64.83333333333333, "x": "今日は、運転を代わる奥さまのための一台を名指しします。"}, {"t": 69.73333333333333, "x": "ダイハツのムーヴです。"}, {"t": 71.56666666666666, "x": "なぜこの車なのか順番にお話しします。"}, {"t": 76.33333333333333, "x": "運転を代わるとたいてい3つのことが起きます。"}, {"t": 79.83333333333333, "x": "1つめは車が大きく感じることです。"}, {"t": 83.13333333333334, "x": "ご主人の車が普通車なら、助手席から見ていたより大きく感じます。"}, {"t": 88.63333333333334, "x": "運転席に座ると、左側の車の端がどこにあるのか分からないのです。"}, {"t": 94.1, "x": "狭い道ですれ違うたびに肩に力が入ってしまいます。"}, {"t": 98.9, "x": "車庫に入れるときも後ろの見当がつかず、何度も切り返すことになります。"}, {"t": 104.53333333333333, "x": "2つめは久しぶりの運転そのものが不安なことです。"}, {"t": 108.7, "x": "昔は乗れていたのに何年もたつと手順を忘れています。"}, {"t": 113.13333333333334, "x": "信号で止まるたびにブレーキを踏む足に力が入ります。"}, {"t": 117.83333333333333, "x": "長い赤信号では右足がだんだん疲れてきます。"}, {"t": 121.93333333333334, "x": "3つめは助手席にご主人が座ることです。"}, {"t": 125.43333333333334, "x": "長く運転してきたかたは、つい横から口を出したくなります。"}, {"t": 130.23333333333332, "x": "奥さまはそれでよけいに緊張してしまいます。"}, {"t": 133.5, "x": "この3つめは車では直せません。"}, {"t": 136.66666666666666, "x": "けれども1つめと2つめは、車を選ぶことでかなり楽にできます。"}, {"t": 141.7, "x": "大きさがつかみやすいこと。"}, {"t": 143.9, "x": "止まっているあいだに足を休められること。"}, {"t": 147.16666666666666, "x": "この2つを手がかりに今日の一台を選びました。"}, {"t": 152.73333333333332, "x": "ムーヴは、去年の6月にまるごと新しくなった軽自動車です。"}, {"t": 157.96666666666667, "x": "ダイハツの古くからある車で、今の型で7代目になります。"}, {"t": 163.0, "x": "ムーヴが生まれたのは1995年で、去年でちょうど30年でした。"}, {"t": 169.23333333333332, "x": "ムーヴとムーヴカスタムを合わせて、340万台を超えて売れてきた車です。"}, {"t": 175.83333333333334, "x": "前の回で、今年売れている軽の4位がムーヴだとお話ししました。"}, {"t": 180.96666666666667, "x": "新しい型になって、いちばん大きく変わったのは後ろのドアです。"}, {"t": 186.43333333333334, "x": "ムーヴとして初めて、横に開くスライドドアが付きました。"}, {"t": 190.93333333333334, "x": "しかも、いちばん安い形から全部の形にスライドドアです。"}, {"t": 196.1, "x": "軽自動車は、国の決まりで大きさの上限が決まっています。"}, {"t": 200.96666666666667, "x": "長さは3メートル40センチまで、幅は1メートル48センチまでです。"}, {"t": 206.6, "x": "ムーヴは長さが3395ミリで、幅は1475ミリです。"}, {"t": 213.2, "x": "つまり軽の枠いっぱいで、ほかの軽と外の大きさは変わりません。"}, {"t": 218.16666666666666, "x": "違うのは屋根の高さです。"}, {"t": 220.5, "x": "ムーヴの高さは1655ミリです。"}, {"t": 223.8, "x": "背の高い軽と呼ばれる車より、10センチから13センチほど低い作りです。"}, {"t": 230.2, "x": "それなのに後ろはスライドドアです。"}, {"t": 233.0, "x": "背の低い軽はたいてい後ろが普通に開くドアでした。"}, {"t": 237.8, "x": "背の高い軽は、スライドドアでも屋根が高くて大きく見えました。"}, {"t": 242.53333333333333, "x": "ムーヴはそのちょうど間に入った車です。"}, {"t": 245.63333333333333, "x": "ダイハツはこの車を「毎日頼れる堅実スライドドアワゴン」と呼んでいます。"}, {"t": 251.63333333333333, "x": "運転を代わる奥さまに、店長がこの車を勧める理由はここにあります。"}, {"t": 258.8333333333333, "x": "背の高さが10センチ以上違うと、運転席からの感じが変わります。"}, {"t": 264.6, "x": "背の高い軽は座ると目の位置が高く、見晴らしが良いものです。"}, {"t": 269.73333333333335, "x": "ただ車の箱が大きいぶん、慣れないうちは大きく感じがちです。"}, {"t": 275.1666666666667, "x": "ムーヴは普通の乗用車に近い感覚で運転できます。"}, {"t": 279.56666666666666, "x": "ここは店長の考えですが、久しぶりのかたにはこの感覚が大事です。"}, {"t": 284.93333333333334, "x": "昔乗っていた車に近いほど、手と目の勘が早く戻るからです。"}, {"t": 290.3666666666667, "x": "それでいて後ろにはスライドドアがあります。"}, {"t": 293.6333333333333, "x": "買い物の荷物を後ろの席に置くとき、狭い駐車場でも楽に開けられます。"}, {"t": 299.3666666666667, "x": "隣の車にドアをぶつける心配もいりません。"}, {"t": 302.96666666666664, "x": "ご主人を後ろの席に乗せる日にも、乗り降りがしやすくなります。"}, {"t": 307.9, "x": "前の席と後ろの席のあいだは1055ミリと、ゆとりをとってあります。"}, {"t": 313.96666666666664, "x": "後ろの席は左右べつべつに前後へずらせるので、荷物に合わせて動かせます。"}, {"t": 320.2, "x": "それから小回りです。"}, {"t": 322.03333333333336, "x": "ムーヴのターボではない形は、小回りの半径が4.4メートルです。"}, {"t": 327.6, "x": "ご主人の普通車より、狭い角が曲がりやすく感じるはずです。"}, {"t": 332.46666666666664, "x": "車の重さも860キロでふわっと軽く動きます。"}, {"t": 337.3666666666667, "x": "燃費は、国の審査の値で1リットルあたり22.6キロです。"}, {"t": 343.1666666666667, "x": "ガソリンスタンドに行く回数も、ご主人の車より減るかもしれません。"}, {"t": 349.6666666666667, "x": "ダイハツは、新しいムーヴの運転席の見え方に手を入れています。"}, {"t": 354.46666666666664, "x": "フロントガラスの両わきの柱の傾きを見直しました。"}, {"t": 358.3, "x": "座る位置も見直して、運転席からの目線を広く高くしたそうです。"}, {"t": 364.26666666666665, "x": "もう1つ真ん中のオーディオの位置を低くしています。"}, {"t": 367.93333333333334, "x": "そこが低いとそのぶん前の景色が広く見えます。"}, {"t": 372.1, "x": "こうした工夫は数字では比べにくいところです。"}, {"t": 375.6333333333333, "x": "ですから、ぜひ奥さまご自身が運転席に座って確かめてください。"}, {"t": 380.9, "x": "そのとき見てほしいのは左前のタイヤのあたりです。"}, {"t": 385.1, "x": "ボンネットの先と左のはしが、どのくらい分かるかを見ます。"}, {"t": 389.9, "x": "ここが分かりやすい車ほど、狭い道で肩の力が抜けます。"}, {"t": 394.93333333333334, "x": "座席の高さを変える仕組みと、ハンドルの角度を変える仕組みもあります。"}, {"t": 399.8333333333333, "x": "これはXとGとRSに付いていて、いちばん安いLには付きません。"}, {"t": 405.3, "x": "背の低い奥さまは、座席を上げると前がぐっと見やすくなります。"}, {"t": 410.3333333333333, "x": "車を真上から見たような映像を映すパノラマモニターもあります。"}, {"t": 415.43333333333334, "x": "これは注文のときに付ける装備ですが、車庫入れが心配なら考えてください。"}, {"t": 422.5, "x": "次は安全の装備です。"}, {"t": 424.76666666666665, "x": "ムーヴには、スマートアシストという仕組みが付いています。"}, {"t": 428.9, "x": "前の車や歩く人にぶつかりそうなときは、知らせてブレーキを掛けます。"}, {"t": 434.06666666666666, "x": "昼だけでなく夜の歩行者にも働く仕組みです。"}, {"t": 437.8333333333333, "x": "前に壁などがあるのに強く踏み込んだとき、飛び出しを抑える仕組みもあります。"}, {"t": 443.53333333333336, "x": "これは前に進むときだけでなく、後ろに下がるときも働きます。"}, {"t": 448.5, "x": "ここまでは、いちばん安いLを含めて全部の形に付いています。"}, {"t": 453.9, "x": "ではどの形を選べばよいか。"}, {"t": 456.6333333333333, "x": "店長のおすすめはGという形です。"}, {"t": 459.8, "x": "値段は176万5500円です。"}, {"t": 463.3, "x": "Gを勧める理由は足を休める装備が付くからです。"}, {"t": 467.6, "x": "電気で掛けるパーキングブレーキと、ブレーキホールドです。"}, {"t": 471.7, "x": "信号で止まったあと、ブレーキから足を離しても止まっていてくれます。"}, {"t": 476.9, "x": "2つめの困りごとだった右足の疲れが楽になります。"}, {"t": 481.53333333333336, "x": "この2つはGとターボのRSにしか付きません。"}, {"t": 485.2, "x": "その下のXは、150万1500円とぐっと安くなります。"}, {"t": 490.6333333333333, "x": "Xにも左側の電気で開くスライドドアや、座席の高さ調整は付きます。"}, {"t": 496.56666666666666, "x": "ただパーキングブレーキは足で踏む形になります。"}, {"t": 500.3, "x": "もう1つ、Gには買い物帰りにうれしい仕掛けがあります。"}, {"t": 504.73333333333335, "x": "降りるときにスイッチを押しておくと、戻ってきたときに自動で開くのです。"}, {"t": 510.0, "x": "左側のスライドドアが、車に近づくだけで開いてくれます。"}, {"t": 514.8666666666667, "x": "両手に買い物袋を下げていても、鍵を探さずに済みます。"}, {"t": 519.6, "x": "それから、販売店で付けるプラスサポートという装備があります。"}, {"t": 524.5, "x": "アクセルを急に強く踏んだとき、加速を抑えてくれるものです。"}, {"t": 529.2666666666667, "x": "専用の鍵でドアを開けると働く仕組みで、L以外の3つの形に付けられます。"}, {"t": 535.7, "x": "久しぶりに運転するかたには、ぜひ見積もりに入れてほしい装備です。"}, {"t": 542.2333333333333, "x": "ここで今の車から乗り換える順番をお話しします。"}, {"t": 545.9666666666667, "x": "まず最初に、奥さまご自身がムーヴを試乗してください。"}, {"t": 550.3, "x": "ご主人の運転で乗るのではなく、奥さまがハンドルを握ります。"}, {"t": 555.2666666666667, "x": "できれば、ふだん行くスーパーの駐車場まで走ってみてください。"}, {"t": 559.7, "x": "車庫入れと、駐車場の白い線の中に止めるところまでやってみます。"}, {"t": 564.9666666666667, "x": "次に、今の車をいくらで引き取ってもらえるかを聞きます。"}, {"t": 569.4333333333333, "x": "新しい車の値引きと今の車の値段は、別々に聞くのがこつです。"}, {"t": 575.5666666666667, "x": "見積もりには、プラスサポートの代金も忘れずに入れてもらいます。"}, {"t": 580.5333333333333, "x": "それから自動車保険を見直します。"}, {"t": 583.4666666666667, "x": "今の保険で、奥さまが運転しても補償されるかを確かめてください。"}, {"t": 588.6666666666666, "x": "運転する人をご主人だけに限る契約もあるからです。"}, {"t": 592.9333333333333, "x": "ここを忘れたまま奥さまが運転するのが、いちばん怖いことです。"}, {"t": 598.3333333333334, "x": "年齢の条件なども含めて、保険会社か代理店に聞いておくと安心です。"}, {"t": 604.2666666666667, "x": "最後に新しい車が届くまでのあいだのことです。"}, {"t": 608.1333333333333, "x": "慣れない大きな車で、無理に毎日走る必要はありません。"}, {"t": 613.0, "x": "届いた車でゆっくり慣れていけば十分です。"}, {"t": 618.0666666666667, "x": "ここまでムーヴを勧めてきましたが、合わない場合もあります。"}, {"t": 622.4666666666667, "x": "1つめは背の高い荷物をよく積むかたです。"}, {"t": 626.0666666666667, "x": "ムーヴの室内の高さは1270ミリで、背の高い軽より低くなります。"}, {"t": 632.1, "x": "立てたまま積みたい物が多いなら、背の高い軽が向いています。"}, {"t": 636.9666666666667, "x": "2つめはご主人が車いすをお使いのかたです。"}, {"t": 640.5666666666667, "x": "車いすを積むなら、福祉車両のあ 667, "x": "店長はお店の前からいつも応援しています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
