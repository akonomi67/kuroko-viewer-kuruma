<script>
const D={"name": "スペーシアとソリオどっち", "file": "117_スペーシアとソリオどっち", "dur": 821.9, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.1666666666666665, "x": "34万6500円。"}, {"t": 6.066666666666666, "x": "これが今日の2台の、よく売れている形どうしの値段の差です。"}, {"t": 11.333333333333334, "x": "2台とは、スズキのスペーシアとソリオです。"}, {"t": 15.0, "x": "スペーシアは軽自動車で、ソリオは小さな普通車です。"}, {"t": 19.433333333333334, "x": "ソリオは軽自動車の枠より少し大きい、5人乗りの車です。"}, {"t": 24.7, "x": "どちらも背が高く、後ろのドアが横に滑って開く形です。"}, {"t": 29.8, "x": "同じスズキの車なので、お店でも並べて見くらべるかたが多い2台です。"}, {"t": 35.5, "x": "軽にするか普通車にするかで迷っているかたから、よく相談を受けます。"}, {"t": 41.1, "x": "スペーシアはハイブリッドXという形が170万5000円です。"}, {"t": 46.8, "x": "ソリオはハイブリッドMXという形が205万1500円です。"}, {"t": 52.666666666666664, "x": "どちらもメーカー希望小売価格で、色によっては少し高くなります。"}, {"t": 57.96666666666667, "x": "今日はこの34万円あまりで何が増えて何が減るのかを見ていきます。"}, {"t": 63.56666666666667, "x": "先に言っておくと、差は席の数とエンジンの力と毎年の税金に出ています。"}, {"t": 70.96666666666667, "x": "まず外の大きさからです。"}, {"t": 73.36666666666666, "x": "長さはスペーシアが3395ミリで、ソリオが3810ミリです。"}, {"t": 79.86666666666666, "x": "ソリオのほうが41.5センチ長い車です。"}, {"t": 84.0, "x": "横幅を見ると、スペーシアは1475ミリ、ソリオは1645ミリです。"}, {"t": 91.1, "x": "こちらはソリオが17センチ広くなっています。"}, {"t": 94.73333333333333, "x": "軽自動車は長さも幅も国の決まりで枠が決まっています。"}, {"t": 99.86666666666666, "x": "スペーシアはその枠いっぱいで、ソリオは枠の外の普通車の大きさです。"}, {"t": 105.43333333333334, "x": "軽自動車の枠は長さが3.4メートル、幅が1.48メートルまでです。"}, {"t": 112.0, "x": "屋根の高さはスペーシアが1785ミリで、ソリオが1745ミリです。"}, {"t": 118.96666666666667, "x": "背の高さだけは軽のスペーシアのほうが4センチ高い車です。"}, {"t": 123.8, "x": "地面から車の底までは、スペーシアが150ミリでソリオが140ミリです。"}, {"t": 130.13333333333333, "x": "重さはスペーシアが880キロで、ソリオが1020キロです。"}, {"t": 135.23333333333332, "x": "140キロの差は、大人2人ぶんくらいの重さです。"}, {"t": 139.9, "x": "車庫の幅に余裕のないかたは、この17センチの差を先に測っておきましょう。"}, {"t": 147.26666666666668, "x": "次は中の広さです。"}, {"t": 149.5, "x": "中の長さはスペーシアが2170ミリで、ソリオが2500ミリです。"}, {"t": 155.3, "x": "ここはソリオが33センチ長くなっています。"}, {"t": 158.86666666666667, "x": "中の幅はスペーシアが1345ミリで、ソリオが1420ミリです。"}, {"t": 165.26666666666668, "x": "前の席に2人で座った時の肩まわりは、ソリオに少しゆとりがあります。"}, {"t": 170.56666666666666, "x": "中の高さはスペーシアが1415ミリで、ソリオが1365ミリです。"}, {"t": 176.76666666666668, "x": "天井まではスペーシアが5センチ高く、頭の上は軽のほうが広い作りです。"}, {"t": 182.76666666666668, "x": "いちばん大きな違いは乗れる人数です。"}, {"t": 186.4, "x": "スペーシアは4人乗りで、ソリオは5人乗りです。"}, {"t": 190.23333333333332, "x": "後ろの席に3人並んで座れるかどうかの違いです。"}, {"t": 194.3, "x": "お孫さんを含めて5人で出かけることがあるなら、ソリオしか選べません。"}, {"t": 199.8, "x": "ふだん乗るのがご夫婦2人なら、4人乗りでも困ることはまずないでしょう。"}, {"t": 205.23333333333332, "x": "後ろの席は2台とも左右別々に前後に動かせる作りです。"}, {"t": 209.8, "x": "前と後ろのタイヤの間の長さは、スペーシアが2460ミリでソリオが2480ミリです。"}, {"t": 218.33333333333334, "x": "ここはほとんど同じで、長さの差の多くは前と後ろのはみ出しの部分です。"}, {"t": 226.16666666666666, "x": "ここからは運転のしやすさです。"}, {"t": 228.83333333333334, "x": "小回りの数字は、スペーシアが4.4メートルで、ソリオが4.8メートルです。"}, {"t": 235.33333333333334, "x": "これはハンドルをいっぱいに切って回った時に、外側のタイヤが通る円の半径です。"}, {"t": 242.0, "x": "スペーシアのほうが、40センチ小さく回れます。"}, {"t": 246.1, "x": "円の大きさで言うと、直径で80センチの差になります。"}, {"t": 250.76666666666668, "x": "スーパーの駐車場や家の前の細い道で向きを変える時に差が出ます。"}, {"t": 256.1333333333333, "x": "切り返しの回数が1回減るだけでも、後ろを見る回数が減って楽になります。"}, {"t": 261.6666666666667, "x": "車の幅もスペーシアが17センチせまい車でした。"}, {"t": 266.2, "x": "すれ違いの多い細い道では、この幅の差も効いてきます。"}, {"t": 270.96666666666664, "x": "一方でソリオも普通車の中では小さな車で、5ナンバーの枠に入る大きさです。"}, {"t": 277.1333333333333, "x": "どちらの車も、前と後ろの物に近づくと知らせるセンサーが付いています。"}, {"t": 283.23333333333335, "x": "駐車の時にぶつけたくないかたには、2台とも心強い装備です。"}, {"t": 287.96666666666664, "x": "近所の細い道が多いかたは、小回りと幅でスペーシアが有利です。"}, {"t": 294.8666666666667, "x": "次はエンジンの力です。"}, {"t": 297.23333333333335, "x": "スペーシアのエンジンは0.66リットルで、ソリオは1.2リットルです。"}, {"t": 303.1666666666667, "x": "力の数字は、スペーシアが49馬力で、ソリオが82馬力です。"}, {"t": 309.26666666666665, "x": "どちらにも小さなモーターがエンジンを手助けする仕組みが付いています。"}, {"t": 313.96666666666664, "x": "スズキはこれをマイルドハイブリッドと呼んでいます。"}, {"t": 317.46666666666664, "x": "重さで割ると、1馬力で運ぶ重さはスペーシアが約18キロでソリオが約12.4キロです。"}, {"t": 325.9, "x": "この数字が小さいほど、同じ力で軽々と走れることになります。"}, {"t": 331.06666666666666, "x": "町の中で2人で乗るぶんには、スペーシアでも力が足りないとは感じにくいでしょう。"}, {"t": 337.3666666666667, "x": "差が出るのは、高速道路の合流と、長い上り坂です。"}, {"t": 342.5, "x": "それに大人が4人乗って荷物を積んだ時です。"}, {"t": 346.1333333333333, "x": "力に余裕があるぶん、ソリオはアクセルを深く踏まずに済む場面が増えます。"}, {"t": 351.6666666666667, "x": "店長のお店でも、坂の多い所のかたからは普通車のほうが楽だという声をよく聞きます。"}, {"t": 358.6, "x": "高速道路を月に何度も使うかたは、このエンジンの差を大事にしてください。"}, {"t": 365.73333333333335, "x": "次はお金の話です。"}, {"t": 368.1666666666667, "x": "国の決まった測りかたで、スペーシアは1リットルあたり23.9キロ走ります。"}, {"t": 374.3666666666667, "x": "ソリオは22.0キロなので、スペーシアが1.9キロ良い数字です。"}, {"t": 379.73333333333335, "x": "信号の多い町の中の数字は、スペーシアが22.4キロでソリオが19.3キロです。"}, {"t": 387.8666666666667, "x": "たとえば町の中だけを年に3000キロ走ると、ガソリンの量はどうなるでしょう。"}, {"t": 393.8333333333333, "x": "スペーシアは約133.9リットルで、ソリオは約155.4リットルです。"}, {"t": 400.76666666666665, "x": "差は21.5リットルほどで、ソリオの燃料タンクの3分の2くらいの量です。"}, {"t": 406.7, "x": "毎年の税金も違います。"}, {"t": 409.03333333333336, "x": "軽自動車のスペーシアは自家用なら標準で年に1万800円です。"}, {"t": 414.6333333333333, "x": "ソリオは1.2リットルの普通車なので、年に3万500円です。"}, {"t": 419.9, "x": "これは2019年10月より後に初めて登録した車の金額です。"}, {"t": 425.3333333333333, "x": "差は年に1万9700円で、10年乗れば19万7000円になります。"}, {"t": 431.93333333333334, "x": "買う時の差と合わせると、10年で50万円を超える差になります。"}, {"t": 437.1666666666667, "x": "燃費の数字はどちらも試験の条件で測ったもので、冬の暖房などで悪くなります。"}, {"t": 444.8666666666667, "x": "ここからは安全の装備です。"}, {"t": 447.2, "x": "ぶつかりそうな時に自動で止まるブレーキは、2台とも同じ名前の仕組みが付いています。"}, {"t": 453.3333333333333, "x": "スズキはこれをデュアルセンサーブレーキサポート2と呼んでいます。"}, {"t": 457.7, "x": "アクセルとブレーキの踏み間違いで、車が急に飛び出すのをおさえる仕組みも2台にあります。"}, {"t": 464.3333333333333, "x": "この仕組みは、前に進む時にも後ろに下がる時にも働きます。"}, {"t": 469.46666666666664, "x": "ゆっくりの速さで壁などにぶつかりそうな時にブレーキをかける仕組みもあります。"}, {"t": 475.1, "x": "道の標識を読み取ってメーターに出す仕組みも、2台とも付いています。"}, {"t": 480.23333333333335, "x": "体を守るエアバッグは、2台ともどの形にも6つ付いています。"}, {"t": 485.26666666666665, "x": "内わけは前の2つと座席の横の2つ、それに窓の側の2つです。"}, {"t": 491.3333333333333, "x": "窓の側の2つはカーテンエアバッグと呼ばれ、横からぶつけられた時に頭を守ります。"}, {"t": 497.56666666666666, "x": "ここは軽か普通車かで差がつかない所で、安心してよいところです。"}, {"t": 502.93333333333334, "x": "違うのは高速道路で使う装備です。"}, {"t": 505.8333333333333, "x": "ソリオのMXには、前の車についていく仕組みと車線の中を保つ手助けが付いています。"}, {"t": 512.4333333333333, "x": "スペーシアのXでは、この2つはセーフティプラスパッケージという追加の装備です。"}, {"t": 520.2666666666667, "x": "そのセーフティプラスパッケージの中身を見ておきます。"}, {"t": 524.1, "x": "前の車についていく仕組みと車線の中を保つ手助けが入っています。"}, {"t": 529.2666666666667, "x": "さらにスイッチでかける電気のブレーキと、信号待ちで止まったままでいられる仕組みです。"}, {"t": 535.3333333333334, "x": "スズキはこれをブレーキホールドと呼んでいます。"}, {"t": 538.3666666666667, "x": "値段は6万6000円で、車を注文する時にしか付けられません。"}, {"t": 543.7, "x": "付けるとスペーシアのハイブリッドXは177万1000円になります。"}, {"t": 549.6666666666666, "x": "ソリオのMXとの差は、28万500円に縮まります。"}, {"t": 554.6, "x": "毎年の税金の差の4年ぶんで、パッケージの6万6000円を上回ります。"}, {"t": 560.3333333333334, "x": "ソリオのMXは止めておく時のブレーキが足で踏む形です。"}, {"t": 565.4666666666667, "x": "前の車についていく仕組みにも、止まったあとそのまま止めておく働きは付いていません。"}, {"t": 571.7666666666667, "x": "信号待ちで右足を休められる仕組みは、パッケージを付けたスペーシアにだけあります。"}, {"t": 578.0333333333333, "x": "高速道路をあまり使わないかたでも、信号待ちが楽になる装備です。"}, {"t": 583.3, "x": "スペーシアを選ぶなら、このパッケージは付けておくことをお勧めします。"}, {"t": 589.6666666666666, "x": "次は毎日の使い勝手です。"}, {"t": 592.3333333333334, "x": "スペーシアのXは左右両方の後ろのドアがボタン1つで開け閉めできます。"}, {"t": 597.9, "x": "ソリオのMXは、電気で開くのは左側のドアだけです。"}, {"t": 602.9333333333333, "x": "左側は道の左に止めた時に歩道の側になるドアです。"}, {"t": 607.9666666666667, "x": "右側のドアは手で開けて、最後だけ自動で閉まりきる作りです。"}, {"t": 613.1, "x": "道の右側に車を止めることが多いかたは、ここも見ておいてください。"}, {"t": 618.5, "x": "運転席の高さを上げ下げする仕組みは、2台とも付いています。"}, {"t": 623.3666666666667, "x": "ハンドルの角度を変える仕組みも、2台ともあります。"}, {"t": 627.3333333333334, "x": "運転席と助手席の座面を温める仕組みも、2台とも付いています。"}, {"t": 632.6333333333333, "x": "スペーシアには天井から車の中の空気を回す小さな扇風機も付いています。"}, {"t": 638.5666666666667, "x": "エアコンの風を車の中に回す手助けをする装備です。"}, {"t": 642.9666666666667, "x": "ガソリンはどちらもレギュラーです。"}, {"t": 645.6333333333333, "x": "タンクはスペーシアが27リットルで、ソリオが32リットルです。"}, {"t": 651.1333333333333, "x": "遠出の多いかたには、給油の回数が少し減るソリオが楽でしょう。"}, {"t": 658.5666666666667, "x": "今日くらべた形とは別の形も見ておきます。"}, {"t": 662.1666666666666, "x": "スペーシアのいちばん安い形はハイブリッドGで、153万100円です。"}, {"t": 668.4333333333333, "x": "ソリオのいちばん安い形はハイブリッドMGで、192万6100円です。"}, {"t": 675.1333333333333, "x": "差は39万6000円で、よく売れている形どうしより少し広がります。"}, {"t": 681.8, "x": "ただしスペーシアのGは後ろのドアが電気で開きません。"}, {"t": 686.4333333333333, "x": "運転席の高さとハンドルの角度を変える仕組みも、Gには付いていません。"}, {"t": 692.3, "x": "ソリオのMGは左側のドアが電気で開き、運転席の高さも変えられます。"}, {"t": 698.8666666666667, "x": "ソリオのMGには、前の車についていく仕組みも付いています。"}, {"t": 703.8333333333334, "x": "いちばん安い形どうしでは、運転の姿勢を合わせられるソリオに分があります。"}, {"t": 710.1333333333333, "x": "雪の多い所で使う4つのタイヤを回す形も見ておきます。"}, {"t": 714.7, "x": "四輪駆動の値段は、スペーシアのXが182万4900円です。"}, {"t": 720.9, "x": "ソリオのMXの四輪駆動は217万6900円です。"}, {"t": 726.4333333333333, "x": "燃費はスペーシアの四輪駆動が22.4キロで、ソリオの四輪駆動が20.7キロです。"}, {"t": 733.8, "x": "四輪駆動でも値段と燃費の差の向きは変わりません。"}, {"t": 739.5666666666667, "x": "それでは、70代の毎日の足としての店長の答えです。"}, {"t": 744.5333333333333, "x": "店長はスペーシアのハイブリッドXに、セーフティプラスパッケージを付けた形をお勧めします。"}, {"t": 751.1666666666666, "x": "いちばんの理由は、ソリオより28万500円安く税金も年に1万9700円安いことです。"}, {"t": 759.3666666666667, "x": "2つ目は、小回りが40センチ小さく、幅も17センチせまいことです。"}, {"t": 765.6, "x": "3つ目は、左右両方の後ろのドアが電気で開くことです。"}, {"t": 770.7, "x": "4つ目は、信号待ちで足を休められる電気のブレーキです。"}, {"t": 775.6, "x": "エアバッグの数もぶつからないための仕組みも、ソリオと同じだけそろっています。"}, {"t": 781.1333333333333, "x": "一方で、ソリオが向いているかたもいます。"}, {"t": 784.1666666666666, "x": "5人で乗ることがあるかたと、高速道路や長い上り坂をよく走るかたです。"}, {"t": 789.9333333333333, "x": "軽自動車の幅のせまさが不安なかたにも、ソリオのゆとりは心強いはずです。"}, {"t": 795.8, "x": "最後にお店では2台の運転席に座って、車庫入れの時の見え方をくらべてみてください。"}, {"t": 802.3666666666667, "x": "今日の数字は、11月にスズキの公式の諸元表と装備一覧表と価格のページで確かめました。"}, {"t": 809.8666666666667, "x": "改良が入ると値段も装備も変わりますので、契約の前にお店で最新の表を確かめてください。"}, {"t": 816.9, "x": "今日はこのへんで、また店先でお会いしましょう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
