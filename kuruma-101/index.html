<script>
const D={"name": "ハスラーとタフトどっち", "file": "101_ハスラーとタフトどっち", "dur": 827.3333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "お店の壁に、2台の車を真上から写した写真を並べて貼ってあります。"}, {"t": 9.266666666666667, "x": "スズキのハスラーとダイハツのタフトです。"}, {"t": 12.2, "x": "お客さんはこの写真の前で、たいてい同じことをおっしゃいます。"}, {"t": 16.733333333333334, "x": "「上から見るとほとんど同じ形だね」。"}, {"t": 19.633333333333333, "x": "それから少しして、もう一言が続きます。"}, {"t": 23.4, "x": "「でもこっちの屋根だけ黒く光っているのはなぜ？」"}, {"t": 27.133333333333333, "x": "黒く光って見えるのは、タフトの屋根のガラスです。"}, {"t": 31.266666666666666, "x": "前の席の真上が、大きなガラスになっているのです。"}, {"t": 35.56666666666667, "x": "じつはこの写真に、今日の答えの半分が写っています。"}, {"t": 39.96666666666667, "x": "残りの半分は、写真では見えない後ろの席にあります。"}, {"t": 44.46666666666667, "x": "70代からの軽を5台選んだ回で、この2台は外しました。"}, {"t": 49.8, "x": "そのときに、2台は別の回で比べますとお約束しました。"}, {"t": 54.666666666666664, "x": "今日がその回です。"}, {"t": 56.46666666666667, "x": "お待たせしたぶん、店で試した使い勝手もまじえてお話しします。"}, {"t": 61.06666666666667, "x": "釣りに行く日もあれば、畑に通う日も温泉へ足をのばす日もある。"}, {"t": 66.63333333333334, "x": "背の高い箱のような軽より、少し遊び心のある軽がいい。"}, {"t": 71.7, "x": "そう考えるかたが最後に迷うのがこの2台です。"}, {"t": 76.03333333333333, "x": "今日は屋根と後ろの席を中心に、一騎打ちで比べます。"}, {"t": 82.23333333333333, "x": "まずは同じところから確かめておきます。"}, {"t": 85.2, "x": "長さは3395ミリで、2台ともぴったり同じです。"}, {"t": 90.6, "x": "幅も1475ミリでこれも同じです。"}, {"t": 95.06666666666666, "x": "前と後ろのタイヤの間の長さも、2460ミリでそろっています。"}, {"t": 101.13333333333334, "x": "軽自動車の決まった枠いっぱいに作られた、同じ大きさの車です。"}, {"t": 106.56666666666666, "x": "真上から見て同じ形に見えるのはそのためです。"}, {"t": 110.46666666666667, "x": "乗れる人数はどちらも4人です。"}, {"t": 113.16666666666667, "x": "エンジンはどちらも軽自動車の660ccで、ガソリンで走ります。"}, {"t": 119.46666666666667, "x": "ターボの付いた形と付かない形があるのも同じです。"}, {"t": 123.4, "x": "四輪駆動は2台とも全部の形で選べます。"}, {"t": 127.66666666666667, "x": "違ってくるのは背の高さからです。"}, {"t": 130.46666666666667, "x": "屋根の高さはハスラーが1680ミリです。"}, {"t": 134.23333333333332, "x": "タフトは1630ミリで、5センチ低く作ってあります。"}, {"t": 139.03333333333333, "x": "ところが車の中の天井の高さは、どちらも1270ミリです。"}, {"t": 144.63333333333333, "x": "外の背が5センチ違っても、頭の上の広さは同じなのです。"}, {"t": 149.7, "x": "ではハスラーの高い屋根は何に使われているのでしょう。"}, {"t": 153.86666666666667, "x": "その答えは第5章の後ろの席でお話しします。"}, {"t": 159.53333333333333, "x": "次は運転席に座ったときの景色です。"}, {"t": 163.03333333333333, "x": "ハスラーは前の席に座る位置を高めにしてあります。"}, {"t": 167.03333333333333, "x": "スズキはこれで、見晴らしのよい目の高さにしたと書いています。"}, {"t": 171.83333333333334, "x": "座ったまま遠くの景色まで見渡しやすい作りです。"}, {"t": 175.66666666666666, "x": "タフトの運転席でまず目に入るのは、頭の上の明るさです。"}, {"t": 180.76666666666668, "x": "ダイハツはこのガラスで、大きく広がる視界ができたと書いています。"}, {"t": 185.6, "x": "信号の手前で止まったときに、見上げれば空が見えます。"}, {"t": 189.96666666666667, "x": "小回りは、回るときの半径がハスラーのほうが20センチ小さい。"}, {"t": 195.56666666666666, "x": "細い農道で向きを変えるなら、ハスラーが少しだけ楽です。"}, {"t": 200.4, "x": "車をとめるときの備えは考え方が分かれます。"}, {"t": 204.4, "x": "前と後ろの物に近づくと知らせる仕組みは、2台とも全部に付きます。"}, {"t": 210.8, "x": "タフトはそのうえ、後ろを映すカメラが全部の形に付いています。"}, {"t": 215.73333333333332, "x": "ただし映す画面は、ナビなどを別に付けることになります。"}, {"t": 220.03333333333333, "x": "ハスラーはカメラが付いていない形が基本です。"}, {"t": 223.63333333333333, "x": "車のまわりを映すカメラは、ナビと一緒に注文で付けます。"}, {"t": 228.26666666666668, "x": "こちらは21万7800円の追加になります。"}, {"t": 232.86666666666667, "x": "車庫入れに不安があるなら、見積もりでここを必ず見てください。"}, {"t": 239.06666666666666, "x": "では写真で目立っていた屋根の話です。"}, {"t": 242.46666666666667, "x": "タフトのガラスの屋根はスカイフィールトップという名前です。"}, {"t": 246.7, "x": "これはオプションではなく、全部の形に付いています。"}, {"t": 250.73333333333332, "x": "いちばん安い形を選んでも、頭の上はガラスになります。"}, {"t": 255.33333333333334, "x": "ハスラーにはガラスの屋根はありません。"}, {"t": 258.1333333333333, "x": "屋根の色を塗り分ける注文があるだけです。"}, {"t": 261.3333333333333, "x": "ガラスの屋根と聞くと、夏の暑さが気になると思います。"}, {"t": 265.6, "x": "タフトのガラスは、日差しの熱と紫外線を抑える作りです。"}, {"t": 270.46666666666664, "x": "さらに引いて閉じる日よけも付いています。"}, {"t": 273.6333333333333, "x": "暑い日は日よけを閉めて、ふつうの屋根として使えます。"}, {"t": 278.06666666666666, "x": "この屋根がいちばん生きるのは出かけた先です。"}, {"t": 281.5, "x": "海辺の駐車場で、日よけを開けて座席を少し倒します。"}, {"t": 286.1333333333333, "x": "頭の上を雲がゆっくり流れていきます。"}, {"t": 289.6, "x": "温泉の帰りには、山の紅葉を下から見上げることもできます。"}, {"t": 294.6333333333333, "x": "この楽しさは、ハスラーではどうしても味わえません。"}, {"t": 298.43333333333334, "x": "2台で迷うかたの半分は、ここでタフトに決めてしまいます。"}, {"t": 303.0, "x": "それくらい、この屋根には人を引きつける力があります。"}, {"t": 307.1333333333333, "x": "ただし屋根のガラスは、あとから付け足すことはできません。"}, {"t": 311.3, "x": "心が動いたかどうかは、買う前に一度確かめておいてください。"}, {"t": 318.4, "x": "写真に写っていなかった残り半分の話です。"}, {"t": 322.6, "x": "ハスラーの後ろの席は前と後ろに動かせます。"}, {"t": 326.3333333333333, "x": "しかも左右の席をべつべつに動かせます。"}, {"t": 329.56666666666666, "x": "背もたれを倒す角度も左右べつべつに変えられます。"}, {"t": 333.46666666666664, "x": "この仕組みはハスラーの全部の形に付いています。"}, {"t": 337.2, "x": "タフトの後ろの席は前後に動きません。"}, {"t": 340.23333333333335, "x": "背もたれの角度も変えられず、できるのは前へ畳むことだけです。"}, {"t": 345.46666666666664, "x": "ダイハツの装備表にも畳む仕組みしか載っていません。"}, {"t": 349.06666666666666, "x": "この差が出かける日の使い勝手を大きく分けます。"}, {"t": 352.8, "x": "たとえばご夫婦で温泉へ一泊する日です。"}, {"t": 356.1666666666667, "x": "ハスラーなら、後ろの席を下げて足もとを広くできます。"}, {"t": 360.6333333333333, "x": "ご近所のかたを乗せても膝が窮屈になりません。"}, {"t": 364.73333333333335, "x": "畑の日なら、片側だけ前に出して荷室を広げます。"}, {"t": 369.1666666666667, "x": "空いた側には苗のケースや肥料の袋を置けます。"}, {"t": 373.53333333333336, "x": "もう片側の席には人が座ったままでいられます。"}, {"t": 377.2, "x": "ハスラーには、荷室の側から席を動かすひもも付いています。"}, {"t": 382.06666666666666, "x": "荷物を積みながら席の位置を変えられるわけです。"}, {"t": 385.56666666666666, "x": "腰をかがめて後ろのドアへ回らなくて済むのは、うれしいところです。"}, {"t": 390.6, "x": "車の中の長さも、ハスラーのほうが16.5センチ長く取ってあります。"}, {"t": 395.93333333333334, "x": "先ほどの高い屋根は、この後ろの席のゆとりに回っているのです。"}, {"t": 400.96666666666664, "x": "一方でタフトにも得意なことがあります。"}, {"t": 403.96666666666664, "x": "後ろの席を畳むと、背中の板と荷室の床が平らにつながります。"}, {"t": 409.2, "x": "どちらの面も樹脂なので、泥や水がついても拭けば済みます。"}, {"t": 413.8333333333333, "x": "荷室の床の板は一段下に下げることもできます。"}, {"t": 418.43333333333334, "x": "前輪駆動なら14センチほど低くなります。"}, {"t": 422.1333333333333, "x": "釣りの道具箱のような、背の高い物を立てて積めます。"}, {"t": 426.43333333333334, "x": "後ろの席は荷物置き場と割り切るなら、タフトの荷室は優秀です。"}, {"t": 433.0, "x": "四輪駆動の雪道での話は、ハスラーの回でたっぷりしました。"}, {"t": 438.1666666666667, "x": "今日は、四輪駆動を選んだときに付いてくる物だけを見ます。"}, {"t": 443.1, "x": "タフトは、前輪駆動と四輪駆動で付く物が少し違います。"}, {"t": 448.0, "x": "温まるドアの鏡は四輪駆動の車にだけ付きます。"}, {"t": 452.53333333333336, "x": "後ろの席の足もとに温風を送る口も四輪駆動だけです。"}, {"t": 457.56666666666666, "x": "ハスラーはこの2つが、前輪駆動でも全部の形に付いています。"}, {"t": 463.03333333333336, "x": "雪の少ない土地でも、冬の朝の鏡の曇りは困りものです。"}, {"t": 468.0, "x": "前輪駆動で冬の備えまで欲しいなら、ハスラーが楽です。"}, {"t": 472.9, "x": "前の席を温める座席のヒーターにも差があります。"}, {"t": 476.96666666666664, "x": "ハスラーは全部の形で運転席と助手席に付きます。"}, {"t": 481.43333333333334, "x": "タフトはGと呼ばれる上の形にしか付きません。"}, {"t": 485.2, "x": "四輪駆動を選ぶときの差額は、タフトのほうが7700円小さい。"}, {"t": 491.0, "x": "四輪駆動を最初から決めているなら、ここはタフトが少し得です。"}, {"t": 497.6666666666667, "x": "ここからは安全の装備と値段を一緒に見ます。"}, {"t": 501.1666666666667, "x": "ぶつかりそうなときに止まろうとするブレーキは、2台とも全部の形です。"}, {"t": 506.6, "x": "ペダルの踏み間違いに備える仕組みも、前と後ろとも付いています。"}, {"t": 511.8, "x": "差が出るのは長い道のりで運転を助ける仕組みです。"}, {"t": 515.9, "x": "前の車について走る仕組みを、ハスラーは全部の形に付けています。"}, {"t": 521.2, "x": "止まるところまでついていき、止まったまま待つこともできます。"}, {"t": 525.7666666666667, "x": "タフトでこれが付くのはGと呼ばれる上の形だけです。"}, {"t": 529.7333333333333, "x": "斜め後ろから近づく車を知らせる仕組みも、ハスラーは全部に付きます。"}, {"t": 535.4666666666667, "x": "タフトの装備表にはこの仕組みは載っていません。"}, {"t": 538.7666666666667, "x": "では値段です。"}, {"t": 540.4666666666667, "x": "どれもメーカーの希望小売価格で、前輪駆動の車です。"}, {"t": 545.9333333333333, "x": "タフトのいちばん安い形は143万5500円です。"}, {"t": 552.0666666666667, "x": "ハスラーのいちばん安い形は159万9400円です。"}, {"t": 557.9, "x": "この比べ方なら、タフトが16万円ほど安く見えます。"}, {"t": 562.6, "x": "ところが、前の車について走る仕組みのある形どうしだと逆になります。"}, {"t": 568.7333333333333, "x": "タフトのGは162万2500円です。"}, {"t": 572.8, "x": "ハスラーのいちばん安い形より、2万3100円高いのです。"}, {"t": 577.7333333333333, "x": "ハスラーには、この値段の中に小さなモーターの助けも入っています。"}, {"t": 582.7, "x": "燃費は国の審査の数字で、1リットルあたり24.3キロです。"}, {"t": 588.3333333333334, "x": "タフトのGは21.4キロです。"}, {"t": 591.5333333333333, "x": "年に6000キロ走るなら、ガソリンの差はおよそ33リットルです。"}, {"t": 597.2, "x": "ただしターボを選ぶなら話がまた変わります。"}, {"t": 601.0, "x": "ターボの付いたタフトのGは170万5000円です。"}, {"t": 605.6666666666666, "x": "ターボの付いたハスラーは183万7000円からです。"}, {"t": 611.1333333333333, "x": "ターボどうしなら、タフトが13万2000円安くなります。"}, {"t": 615.7333333333333, "x": "タフトのターボは、上の形に運転を助ける仕組みも付いてきます。"}, {"t": 621.1, "x": "ターボを選ぶかたにとっては、タフトの値段はかなり魅力です。"}, {"t": 627.0666666666667, "x": "数字が多くなったので、出かける先ごとにまとめ直 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
