<script>
const D={"name": "七十代からの軽5台", "file": "093_七十代からの軽5台", "dur": 837.1, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "今年の4月から9月までの半年で、よく売れた軽自動車を調べてみました。"}, {"t": 9.033333333333333, "x": "全国の軽自動車の団体が、車の名前ごとに数を出しています。"}, {"t": 14.433333333333334, "x": "上から5台を並べるとひとつ共通点が見えてきます。"}, {"t": 18.9, "x": "1位はN-BOXで半年でおよそ10万台です。"}, {"t": 22.766666666666666, "x": "2位がスペーシア、3位がタント。"}, {"t": 25.766666666666666, "x": "4位がムーヴで5位がルークスです。"}, {"t": 28.7, "x": "この5台は、5台とも後ろのドアが横に開くスライドドアなんです。"}, {"t": 33.833333333333336, "x": "6位のハスラーになって、やっと普通に開くドアの車が出てきます。"}, {"t": 39.1, "x": "いま軽を買うかたの多くが、スライドドアを選んでいるわけです。"}, {"t": 43.9, "x": "もう1つ店長が目を止めた数字があります。"}, {"t": 47.3, "x": "5位のルークスは、前の年の同じ半年より1.5倍も売れていました。"}, {"t": 52.8, "x": "去年の秋にまるごと新しい型に変わったからです。"}, {"t": 56.766666666666666, "x": "タントも今年の8月に、ぶつからないための仕組みが新しくなりました。"}, {"t": 62.03333333333333, "x": "N-BOXも今年の7月に手が入っています。"}, {"t": 65.4, "x": "軽自動車はこの1年でずいぶん顔ぶれが動きました。"}, {"t": 69.5, "x": "この店で前に軽をくらべたときから、中身がだいぶ変わりました。"}, {"t": 74.4, "x": "そこで今日は70代から乗る軽を選び直します。"}, {"t": 78.16666666666667, "x": "選んだのはルークス、タント、N-BOX、スペーシア。"}, {"t": 82.9, "x": "そしてもう一台、ワゴンRスマイルです。"}, {"t": 86.33333333333333, "x": "4位のムーヴはわざと5台に入れていません。"}, {"t": 89.5, "x": "その訳は後のほうでお話しします。"}, {"t": 94.2, "x": "車を一台ずつ見る前にどこを見るかを決めておきます。"}, {"t": 98.66666666666667, "x": "前に軽をくらべたときは、乗り降りや維持費を中心に見ました。"}, {"t": 103.56666666666666, "x": "今日は70代のかたに向けて別の3つにしぼります。"}, {"t": 108.13333333333334, "x": "1つめは、交差点で曲がるときも見張ってくれるかです。"}, {"t": 112.1, "x": "ぶつかりそうなときに止まろうとするブレーキは、今はどの車にもあります。"}, {"t": 117.36666666666666, "x": "ただ何を見張ってくれるかは車によって違います。"}, {"t": 121.43333333333334, "x": "右に曲がるとき、向こうからまっすぐ来る車。"}, {"t": 125.3, "x": "曲がった先で横断歩道を渡ってくる人や自転車。"}, {"t": 129.5, "x": "ここまで見てくれるかどうかが、この1年で大きく変わったところです。"}, {"t": 134.83333333333334, "x": "2つめは、信号待ちで足を休められるかです。"}, {"t": 138.73333333333332, "x": "止まったあとにブレーキから足を離しても、車が止まったままでいてくれる。"}, {"t": 144.4, "x": "そういう仕組みがあり、ブレーキホールドと呼ばれています。"}, {"t": 148.36666666666667, "x": "これは、電気で掛けるパーキングブレーキと組みで付きます。"}, {"t": 152.93333333333334, "x": "長い赤信号で右足がつらいかたにはありがたい装備です。"}, {"t": 157.46666666666667, "x": "3つめは、いちばん安い形を選んだときに何が抜けるかです。"}, {"t": 162.5, "x": "軽はどれも安い形と高い形で中身がかなり違います。"}, {"t": 167.63333333333333, "x": "値札の数字だけで決めると、欲しい装備が付いていないことがあります。"}, {"t": 172.5, "x": "そこで今日は、1つめと2つめがそろう形の値段を調べました。"}, {"t": 177.5, "x": "その中でいちばん安い形の値段を、5台そろえてお見せします。"}, {"t": 182.66666666666666, "x": "この3つの確かめどころを5台に順番に当てていきます。"}, {"t": 188.46666666666667, "x": "最初はいちばん新しいルークスです。"}, {"t": 191.46666666666667, "x": "日産が去年の9月に発表した、まったく新しい型です。"}, {"t": 196.33333333333334, "x": "中に入ってまず驚くのは前から後ろまでの長さです。"}, {"t": 201.13333333333333, "x": "室内の長さは2315ミリで、前の型より11.5センチ長くなりました。"}, {"t": 207.9, "x": "後ろのスライドドアの入り口の幅も、650ミリあります。"}, {"t": 212.8, "x": "日産は、どちらもこの種類の軽でいちばんだと言っています。"}, {"t": 217.83333333333334, "x": "では1つめの確かめどころの交差点です。"}, {"t": 221.33333333333334, "x": "ルークスのブレーキには、交差点で見張る力が新しく加わりました。"}, {"t": 226.6, "x": "歩行者に加えて、向こうから来る車や横切る車も見張ります。"}, {"t": 232.13333333333333, "x": "これはいちばん安いSから、どの形にも付いています。"}, {"t": 236.53333333333333, "x": "踏み間違えたときの飛び出しを抑える仕組みも、全部の形にあります。"}, {"t": 241.93333333333334, "x": "2つめの、信号待ちで足を休める装備はどうでしょう。"}, {"t": 246.36666666666667, "x": "ここがルークスで気をつけたいところです。"}, {"t": 249.03333333333333, "x": "電気のパーキングブレーキとブレーキホールドは、限られた形だけです。"}, {"t": 254.2, "x": "プロパイロットエディションという名前の付いた形にしか付きません。"}, {"t": 258.56666666666666, "x": "その中でいちばん安いのはハイウェイスターXの形です。"}, {"t": 262.8333333333333, "x": "値段は210万5400円になります。"}, {"t": 266.3333333333333, "x": "いちばん安いSは167万2000円ですから、40万円あまり上がります。"}, {"t": 272.93333333333334, "x": "もう1つ、車を真上から見たような画面を映す装備があります。"}, {"t": 278.43333333333334, "x": "これはSでは選べず、XとハイウェイスターXでは注文のときに頼むものです。"}, {"t": 284.76666666666665, "x": "新しくて広い車ですが、欲しい装備まで足すと値段がかさみます。"}, {"t": 291.7, "x": "2台目はダイハツのタントです。"}, {"t": 294.53333333333336, "x": "タントは2003年に生まれた車で、背の高い軽の草分けです。"}, {"t": 299.8666666666667, "x": "今年の8月31日に大事な改良がありました。"}, {"t": 303.9, "x": "ぶつからないための仕組みに、3つの見張りが加わったのです。"}, {"t": 308.4, "x": "右に曲がるとき、向こうからまっすぐ来る車。"}, {"t": 312.46666666666664, "x": "右や左に曲がるとき、向こうから渡ってくる歩行者。"}, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
