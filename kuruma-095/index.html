<script>
const D={"name": "プリウスからの乗り換え", "file": "095_プリウスからの乗り換え", "dur": 804.2, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "いきなりですが、いまお乗りのプリウスは何台目でしょうか。"}, {"t": 7.633333333333334, "x": "一台目のかたも3台目というかたもいらっしゃると思います。"}, {"t": 11.633333333333333, "x": "お店にはプリウスを乗り継いできたお客さまがたくさん来られます。"}, {"t": 16.066666666666666, "x": "そういうかたが車検の前に、ぽつりとおっしゃることがあります。"}, {"t": 20.466666666666665, "x": "「燃費は文句ないんだけど、最近は乗り込むのがひと苦労でね」。"}, {"t": 24.966666666666665, "x": "燃費にも走りにも不満はない。でも体がついてこなくなった。"}, {"t": 29.9, "x": "これはプリウスが悪いのではなく、年を重ねれば誰にでも起きることです。"}, {"t": 35.36666666666667, "x": "そこで今日は、プリウスから乗り換えるなら次の一台は何か。"}, {"t": 40.4, "x": "店長が一台に決めてお答えします。"}, {"t": 43.53333333333333, "x": "その前に、プリウスの良さと困りごとを順に整理します。"}, {"t": 48.3, "x": "それから今のプリウスの形を確かめて、答えに入ります。"}, {"t": 53.13333333333333, "x": "最後に、その車が合わないかたのお話もいたします。"}, {"t": 58.733333333333334, "x": "まずはプリウスの良かったところから振り返ります。"}, {"t": 62.2, "x": "初代のプリウスが出たのは1997年のことです。"}, {"t": 67.13333333333334, "x": "当時のトヨタの言葉は「21世紀に間に合いました」でした。"}, {"t": 72.2, "x": "エンジンとモーターを組み合わせて走る、ハイブリッドの車です。"}, {"t": 76.76666666666667, "x": "同じくらいの走りのガソリン車と比べて、燃費はおよそ2倍。"}, {"t": 81.73333333333333, "x": "トヨタはそう説明していました。"}, {"t": 84.0, "x": "それから2代目、3代目、4代目と代を重ねてきました。"}, {"t": 89.23333333333333, "x": "代が変わるたびに燃費の数字は伸びていきました。"}, {"t": 93.0, "x": "測りかたが代ごとに違うので、数字を並べるのはやめておきます。"}, {"t": 97.9, "x": "ただガソリンスタンドに行く回数が減ったのは確かです。"}, {"t": 102.3, "x": "もう1つの良さは走り出しの静かさです。"}, {"t": 106.06666666666666, "x": "ゆっくり発進するときはモーターだけで動く場面があります。"}, {"t": 110.7, "x": "朝早く家を出るときも、ご近所に気をつかわずにすみます。"}, {"t": 115.5, "x": "信号待ちでエンジンが止まるのにも、すっかり慣れたことでしょう。"}, {"t": 119.96666666666667, "x": "そして何より、トヨタのハイブリッドを長く使ってきた安心感です。"}, {"t": 124.86666666666666, "x": "初代から数えると、もう30年近くになります。"}, {"t": 129.2, "x": "壊れにくいと感じて、同じ車を選び続けたかたも多いはずです。"}, {"t": 134.26666666666668, "x": "ですから乗り換えの相手も、トヨタのハイブリッドから選びます。"}, {"t": 138.56666666666666, "x": "慣れた仕組みを手放さずにすむのが、いちばんの近道だからです。"}, {"t": 144.86666666666667, "x": "では困りはじめるのはどこでしょうか。"}, {"t": 147.7, "x": "いちばん多いのは、乗り降りのときの座る位置の低さです。"}, {"t": 152.36666666666667, "x": "プリウスは屋根を低くして、風を受けにくい形にしてあります。"}, {"t": 157.1, "x": "燃費を伸ばすための形なので、座る位置も低めです。"}, {"t": 161.26666666666668, "x": "座るときは腰をぐっと下に落とすことになります。"}, {"t": 164.96666666666667, "x": "降りるときは膝と腰の力で体を持ち上げることになります。"}, {"t": 169.86666666666667, "x": "若いころは何でもなかった動きが、毎日の重さになってきます。"}, {"t": 175.06666666666666, "x": "あるお客さまは、雨の日がいちばんつらいとおっしゃいました。"}, {"t": 179.46666666666667, "x": "傘をたたみながら腰を落とすので、どうしても体がふらつくのです。"}, {"t": 184.53333333333333, "x": "もう1つは頭の上です。"}, {"t": 186.93333333333334, "x": "屋根が低いぶん、乗るときに頭を下げる動きも加わります。"}, {"t": 191.4, "x": "腰を落としながら頭も下げるので、体が二重に折れるわけです。"}, {"t": 196.43333333333334, "x": "3つめは振り返ったときの後ろの見えかたです。"}, {"t": 200.0, "x": "プリウスは屋根の線が後ろへなだらかに下がる形をしています。"}, {"t": 204.26666666666668, "x": "後ろの窓が寝ているので、見える範囲を狭く感じるかたもいます。"}, {"t": 209.3, "x": "ただし、ここは人によって感じかたが分かれるところです。"}, {"t": 213.46666666666667, "x": "座る位置の高さについては、メーカーが数字を出していません。"}, {"t": 218.0, "x": "ですから今日は、店長の目分量の数字は使いません。"}, {"t": 222.26666666666668, "x": "代わりにメーカーが出している屋根の高さで比べていきます。"}, {"t": 227.7, "x": "次に今のプリウスがどうなったかを確かめます。"}, {"t": 230.96666666666667, "x": "トヨタの資料で、代ごとの屋根の高さを見てみました。"}, {"t": 234.93333333333334, "x": "初代から3代目までは、どれも1490ミリでした。"}, {"t": 240.06666666666666, "x": "2015年の4代目で1470ミリになりました。"}, {"t": 245.16666666666666, "x": "そして2023年の1月に出た今の5代目は、1420ミリです。"}, {"t": 251.5, "x": "3代目と比べると、屋根は7センチ低くなっています。"}, {"t": 255.83333333333334, "x": "4代目から乗り換えても5センチ低くなります。"}, {"t": 259.3666666666667, "x": "見た目はとても格好よくなりましたが、乗り降りは楽ではありません。"}, {"t": 264.2, "x": "車の中の天井までの高さも、今のプリウスは1130ミリです。"}, {"t": 269.7, "x": "つまりプリウスは、代を追うごとに低い車になってきました。"}, {"t": 274.1666666666667, "x": "「次も新しいプリウスに」と考えたとき、ここが引っかかります。"}, {"t": 279.06666666666666, "x": "いま乗っている形より、もう一段低くなるからです。"}, {"t": 283.4, "x": "もちろん低い車が好きで体も平気なら、そのままで構いません。"}, {"t": 288.2, "x": "背の低い車のよさは、前の回でくわしくお話ししたとおりです。"}, {"t": 293.1, "x": "今日は、乗り降りがつらくなってきたかたに向けたお話です。"}, {"t": 298.9, "x": "では答えを先に申し上げます。"}, {"t": 301.56666666666666, "x": "プリウスから乗り換えるなら、トヨタのカローラ クロスです。"}, {"t": 305.9, "x": "カローラという名前が付いた、背の少し高い車です。"}, {"t": 310.4, "x": "国内で売り出されたのは2021年の9月でした。"}, {"t": 315.3, "x": "その後も改良が続き、いまはハイブリッドの車だけになっています。"}, {"t": 320.56666666666666, "x": "今年の7月にも改良が入り、いまも新車で買えます。"}, {"t": 325.23333333333335, "x": "選べる形は大きく分けて3つです。"}, {"t": 328.3666666666667, "x": "いちばん手ごろなSと装備の多いZ。"}, {"t": 331.6333333333333, "x": "それから走りを重く見たGRスポーツという形です。"}, {"t": 335.96666666666664, "x": "今日のお話は、SとZを前に置いて進めます。"}, {"t": 340.4, "x": "前輪駆動どうしで比べると、Sは298万1000円でZは361万3500円です。"}, {"t": 349.73333333333335, "x": "差は63万円あまりで、Zには電動で動く運転席などが付きます。"}, {"t": 355.9, "x": "GRスポーツは大きなタイヤを履いた走り好き向けの形だからです。"}, {"t": 361.06666666666666, "x": "なぜこの車なのか、理由は3つあります。"}, {"t": 364.76666666666665, "x": "1つめは屋根がプリウスより高いことです。"}, {"t": 367.93333333333334, "x": "2つめは中身が同じトヨタのハイブリッドであることです。"}, {"t": 372.73333333333335, "x": "3つめは車の長さがプリウスとほとんど変わらないことです。"}, {"t": 377.1, "x": "1つずつ確かめていきましょう。"}, {"t": 381.0, "x": "まずは高さです。"}, {"t": 382.8333333333333, "x": "カローラ クロスの屋根の高さは1620ミリです。"}, {"t": 387.6, "x": "今のプリウスと比べると、ちょうど20センチ高くなります。"}, {"t": 392.06666666666666, "x": "3代目のプリウスから乗り換えても、13センチ高くなります。"}, {"t": 396.53333333333336, "x": "車の中の天井までは1260ミリです。"}, {"t": 401.2, "x": "今のプリウスの1130ミリより、13センチのゆとりがあります。"}, {"t": 406.3666666666667, "x": "座るときは、腰を深く落とさずに横へ滑りこむ感じに近づきます。"}, {"t": 412.0, "x": "頭を下げる動きも、そのぶん小さくてすみます。"}, {"t": 415.8, "x": "地面から車の床下までの高さも、プリウスより1.5センチ高くとってあります。"}, {"t": 422.03333333333336, "x": "降りるときも、足を地面に下ろしてから立つまでが短くなります。"}, {"t": 426.8666666666667, "x": "運転席の座面の高さを変える仕組みは、どの形にも付いています。"}, {"t": 432.2, "x": "Zは電動で、SとGRスポーツは手で動かして合わせる形です。"}, {"t": 437.7, "x": "体に合う高さを探しやすいのは、ボタンで動かせるZのほうです。"}, {"t": 442.8666666666667, "x": "次にハイブリッドの中身です。"}, {"t": 445.4, "x": "SとZのエンジンは1.8リットルです。"}, {"t": 449.1666666666667, "x": "じつは3代目プリウスと、同じ型のエンジンが使われています。"}, {"t": 453.73333333333335, "x": "今のプリウスの1.8リットルの形とも同じ型です。"}, {"t": 457.93333333333334, "x": "アクセルを踏んだときの感じに、大きな戸惑いは少ないはずです。"}, {"t": 462.93333333333334, "x": "ただし燃費はプリウスにかないません。"}, {"t": 465.6666666666667, "x": "国の審査の燃費で、カローラ クロスの前輪駆動は26.4キロです。"}, {"t": 472.1333333333333, "x": "今のプリウスの基本の形は、1リットルあたり32.6キロです。"}, {"t": 477.6333333333333, "x": "同じ距離を走ると、ガソリンは2割あまり多く使う計算です。"}, {"t": 482.8666666666667, "x": "ここは正直にお伝えしておきます。"}, {"t": 485.6333333333333, "x": "高さと引きかえに、燃費が少し下がると考えてください。"}, {"t": 489.76666666666665, "x": "雪の多い地域のかたには、四輪駆動の形も選べます。"}, {"t": 496.06666666666666, "x": "次に大きさです。"}, {"t": 497.8, "x": "カローラ クロスの長さは4455ミリです。"}, {"t": 502.8333333333333, "x": "3代目プリウスの4460ミリと、ほとんど同じです。"}, {"t": 508.3, "x": "今のプリウスは4600ミリなので、14.5センチ短くなります。"}, {"t": 514.2, "x": "車庫の奥行きで困ることは、まずないでしょう。"}, {"t": 518.1333333333333, "x": "小回りはハンドルをいっぱいに切ったときの半径で5.2メートル。"}, {"t": 522.9333333333333, "x": "今のプリウスの1.8リットルの形は5.3メートルです。"}, {"t": 527.7666666666667, "x": "わずかですが、カローラ クロスのほうが小さく回れます。"}, {"t": 532.4, "x": "ただし1つだけ気をつけてほしいのが幅です。"}, {"t": 536.0, "x": "カローラ クロスの幅は1825ミリあります。"}, {"t": 540.4333333333333, "x": "今のプリウスの1780ミリより、4.5センチ広くなります。"}, {"t": 545.7333333333333, "x": "3代目プリウスの1745ミリから比べると、8センチ広くなります。"}, {"t": 552.2333333333333, "x": "じつはプリウスは、2代目からすでに3ナンバーの幅でした。"}, {"t": 556.9666666666667, "x": "ですから幅の広い車にはある程度慣れておられると思います。"}, {"t": 562.0, "x": "それでも8センチの差は、狭い車庫では効いてきます。"}, {"t": 566.2333333333333, "x": "買う前に、車庫の柱と柱のあいだを一度測ってみてください。"}, {"t": 571.0333333333333, "x": "測った幅から車の幅を引いて、残りを左右に分けてみます。"}, {"t": 576.5666666666667, "x": "運転席の側にドアを開けて降りる幅が残るかどうかが目安です。"}, {"t": 581.6666666666666, "x": "いまのプリウスでぎりぎりなら、カローラ クロスは苦しくなります。"}, {"t": 588.4666666666667, "x": "車庫が狭くて、幅がどうしても気になるかたもいらっしゃいます。"}, {"t": 593.1666666666666, "x": "そういうかたに、もう一台だけ名前を挙げておきます。"}, {"t": 597.6, "x": "同じトヨタのヤリス クロスです。"}, {"t": 600.5666666666667, "x": "幅は1765ミリで、3代目プリウスとの差は2センチです。"}, {"t": 606.4666666666667, "x": "屋根の高さは1580ミリ前後で、こちらも高くなります。"}, {"t": 611.5, "x": "燃費は前輪駆動の基本の形で30.8キロと、プリウスに近い数字です。"}, {"t": 618.1666666666666, "x": "ハイブリッドの前輪駆動なら値段は251万円ほどからです。"}, {"t": 623.7666666666667, "x": "ただし車の中は、カローラ クロスより一回り小さくなります。"}, {"t": 628.9333333333333, "x": "回るときの半径も5.3メートルで、カローラ クロスより10センチ大きくなります。"}, {"t": 635.5, "x": "後ろの席や荷物の広さを重く見るなら、やはりカローラ クロスです。"}, {"t": 641.5, "x": "幅が先に決まってしまうかただけ、ヤリス クロスを見てくだ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
