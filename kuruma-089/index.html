<script>
const D={"name": "ルーミーとソリオどっち", "file": "089_ルーミーとソリオどっち", "dur": 749.46665625, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "二台を横に並べると、ほとんど同じに見えます。"}, {"t": 7.033333333333333, "x": "背が高くて、うしろのドアは横に開くスライドドア。"}, {"t": 11.366666666666667, "x": "大きさも値段も、びっくりするほど近いんです。"}, {"t": 15.033333333333333, "x": "ところがボンネットを開けると、一か所だけはっきり違います。"}, {"t": 19.466666666666665, "x": "今日はトヨタのルーミーとスズキのソリオのお話です。"}, {"t": 23.266666666666666, "x": "軽自動車より少しゆとりがほしい。"}, {"t": 26.166666666666668, "x": "かといって大きなミニバンまでは要らない。"}, {"t": 29.066666666666666, "x": "そう考えると、たいていこの二台に行き着きます。"}, {"t": 32.86666666666667, "x": "お店でも「結局どっちがいいの」とよく聞かれます。"}, {"t": 37.06666666666667, "x": "カタログを二冊並べて、ため息をつくかたも少なくありません。"}, {"t": 41.733333333333334, "x": "そこで今日は、その一つの違いを先にお見せします。"}, {"t": 46.03333333333333, "x": "そのあとで乗り降りと坂道、安全装備を順に見ます。"}, {"t": 50.63333333333333, "x": "燃費と値段も数字で比べます。"}, {"t": 53.43333333333333, "x": "最後に七十代のかたにはどちらか、一台に決めてお答えします。"}, {"t": 60.2, "x": "まずは似ているところから確かめましょう。"}, {"t": 63.3, "x": "ルーミーの大きさは長さ3700ミリ、幅1670ミリです。"}, {"t": 69.43333333333334, "x": "高さは1735ミリあります。"}, {"t": 72.33333333333333, "x": "ソリオもほぼ同じ大きさで、背の高さもほとんど変わりません。"}, {"t": 77.0, "x": "細かく言えば、長さはソリオが少し長めです。"}, {"t": 81.1, "x": "反対に幅はルーミーのほうが少しだけ広くなっています。"}, {"t": 85.3, "x": "駐車場の白い線の中には、どちらも楽に収まります。"}, {"t": 89.96666666666667, "x": "どちらも今、新車で買える現役の車です。"}, {"t": 93.96666666666667, "x": "ルーミーは2026年8月の終わりに改良を受けたばかりです。"}, {"t": 98.96666666666667, "x": "乗れるのはどちらも五人です。"}, {"t": 101.5, "x": "うしろのドアは、どちらも左右ともスライドドアです。"}, {"t": 105.7, "x": "狭い駐車場でも隣の車にドアをぶつける心配がありません。"}, {"t": 110.66666666666667, "x": "雪の多い土地向けに四輪駆動を選べるのも同じです。"}, {"t": 114.96666666666667, "x": "値段も近く、どちらも200万円の前後に並んでいます。"}, {"t": 119.8, "x": "ここまでだけ聞くと、どちらでも同じに思えますよね。"}, {"t": 123.83333333333333, "x": "実際、写真だけでは見分けにくいほどです。"}, {"t": 127.46666666666667, "x": "お店の駐車場に二台並べておくと、お客さまがよく見まちがえます。"}, {"t": 132.73333333333332, "x": "ですが、ここからが今日の本題です。"}, {"t": 137.36666666666667, "x": "二台のいちばん大きな違いはエンジンです。"}, {"t": 141.0, "x": "ソリオはすべての車がハイブリッドです。"}, {"t": 144.13333333333333, "x": "1200ccの三気筒エンジンに、モーターの役目もする発電機が付いています。"}, {"t": 150.23333333333332, "x": "速度が落ちるときに、その発電機で電気をためます。"}, {"t": 154.66666666666666, "x": "走り出しや加速のときは、ためた電気でエンジンを手伝います。"}, {"t": 159.46666666666667, "x": "そのぶんガソリンが少なくて済むという仕組みです。"}, {"t": 163.1, "x": "一方のルーミーには、ハイブリッドがありません。"}, {"t": 166.56666666666666, "x": "エンジンは1000ccの三気筒で、ガソリンだけで走ります。"}, {"t": 170.9, "x": "力の弱さを補うために、ターボ付きのグレードも用意されています。"}, {"t": 175.86666666666667, "x": "ターボなしは69馬力です。"}, {"t": 179.06666666666666, "x": "ターボ付きは98馬力まで上がります。"}, {"t": 182.0, "x": "つまり排気量はソリオが200cc大きく、モーターの手伝いもある。"}, {"t": 187.5, "x": "この一つの違いが、燃費にも走りかたにもつながっていきます。"}, {"t": 192.4, "x": "エンジンの大きさは、坂道の多い暮らしでとくに効いてきます。"}, {"t": 197.36666666666667, "x": "ただしソリオはモーターだけで長く走る形ではありません。"}, {"t": 201.4, "x": "あくまでエンジンが主役で、モーターは手伝い役です。"}, {"t": 205.63333333333333, "x": "静かなまま街を走る車を想像すると、少し違います。"}, {"t": 210.53333333333333, "x": "ここはお店で誤解されやすいところなので、覚えておいてください。"}, {"t": 215.03333333333333, "x": "この先の章は、すべてこのエンジンの違いを頭に置いて聞いてください。"}, {"t": 221.86666666666667, "x": "次は乗り降りです。"}, {"t": 223.7, "x": "背の高い車なので、どちらも頭をかがめずに乗りこめます。"}, {"t": 228.56666666666666, "x": "違いが出るのは、スライドドアがどこまで電動かです。"}, {"t": 232.7, "x": "ソリオは上の二つのグレードなら左右とも電動で開きます。"}, {"t": 237.5, "x": "下の二つのグレードは、電動なのが左側だけです。"}, {"t": 241.73333333333332, "x": "ルーミーもいちばん安いXは助手席側だけが電動です。"}, {"t": 246.4, "x": "それより上のグレードになると、左右とも電動になります。"}, {"t": 251.06666666666666, "x": "運転席のうしろに荷物を置くかたは、ここが大事です。"}, {"t": 255.33333333333334, "x": "右側を手で開け閉めするのは思ったより力が要りますからね。"}, {"t": 260.1333333333333, "x": "ソリオには、閉まりきる前に鍵をかける予約ができます。"}, {"t": 264.46666666666664, "x": "ドアが閉まるのを待たずにその場を離れられるわけです。"}, {"t": 268.76666666666665, "x": "動いている途中のドアを、その場で止める機能もあります。"}, {"t": 273.06666666666666, "x": "お孫さんが近くにいるときも、あわてずに済みます。"}, {"t": 276.76666666666665, "x": "ルーミーには、近づくと自動で開く予約ができるグレードがあります。"}, {"t": 281.8666666666667, "x": "両手に買い物袋を持っていても、ドアの前で立ち止まらずに済みます。"}, {"t": 286.96666666666664, "x": "夜に乗ることが多いなら、ルーミーの足もとを照らす明かりも助かります。"}, {"t": 292.26666666666665, "x": "暗い駐車場で、段差につまずく心配が減ります。"}, {"t": 296.5, "x": "どちらにしても、電動のドアが片側だけのグレードは避けてください。"}, {"t": 301.4, "x": "これだけで毎日の乗り降りはずいぶん楽になります。"}, {"t": 306.73333333333335, "x": "続いて運転していて違いを感じる場面です。"}, {"t": 310.8666666666667, "x": "一つは坂道をのぼるときです。"}, {"t": 313.6, "x": "ルーミーのターボなしは、ガソリンだけの1000ccで走ります。"}, {"t": 318.3, "x": "五人乗って坂をのぼると、アクセルを深く踏む場面が増えます。"}, {"t": 323.1666666666667, "x": "エンジンの音も大きくなり、少しあわただしく感じるかもしれません。"}, {"t": 328.0, "x": "ソリオは排気量が大きいうえに、加速のときにモーターが手伝います。"}, {"t": 333.1333333333333, "x": "坂道や高速道路の合流で、踏みこむ量が少なくて済みます。"}, {"t": 338.2, "x": "坂の多い土地にお住まいなら、ここは見逃せません。"}, {"t": 342.2, "x": "ルーミーで坂が多いなら、ターボ付きのG-TかカスタムG-Tを選んでください。"}, {"t": 347.93333333333334, "x": "ルーミーには、坂道の発進で車が下がりにくくする装置が全車に付いています。"}, {"t": 354.1333333333333, "x": "もう一つは信号待ちです。"}, {"t": 356.56666666666666, "x": "足を離しても止まったままでいてくれる、ブレーキホールドがあります。"}, {"t": 361.5, "x": "ルーミーはカスタムと付いた二つのグレードなら最初から付いています。"}, {"t": 366.3, "x": "GとG-Tでも注文するときに付け足せます。"}, {"t": 369.96666666666664, "x": "ソリオで付いているのは上の二つのグレードだけです。"}, {"t": 373.7, "x": "ソリオはホールドが三分ほど続くと、自動でパーキングブレーキがかかります。"}, {"t": 379.0, "x": "長い信号で右足がつらくなるかたには、ありがたい装備です。"}, {"t": 384.03333333333336, "x": "ここはルーミーのほうが選べる幅が広いと言えます。"}, {"t": 387.4, "x": "ただし、付け足せるのは新車を注文するときだけです。"}, {"t": 392.0, "x": "買ったあとから付けることはできないので、見積もりの時に決めてください。"}, {"t": 398.23333333333335, "x": "では安全の装備を見ていきましょう。"}, {"t": 401.26666666666665, "x": "ルーミーはスマートアシストという仕組みを全車に積んでいます。"}, {"t": 405.6333333333333, "x": "前を見張るのは、主にステレオカメラという二つの目のカメラです。"}, {"t": 410.76666666666665, "x": "前の車や歩く人、自転車に反応してブレーキを助けます。"}, {"t": 415.73333333333335, "x": "国のサポカーの区分では、サポカーSワイドに入っています。"}, {"t": 420.23333333333335, "x": "ソリオにはデュアルセンサーブレーキサポートツーが付いています。"}, {"t": 424.3666666666667, "x": "前の車についていく、アダプティブクルーズコントロールもあります。"}, {"t": 429.26666666666665, "x": "前の車との距離はカメラと電波のレーダーの二つで測ります。"}, {"t": 434.26666666666665, "x": "止まるところまでついていけるのは、ソリオでは上の二つのグレードです。"}, {"t": 439.46666666666664, "x": "ルーミーではカスタムの二つが最初から止まるところまで対応しています。"}, {"t": 444.1333333333333, "x": "ソリオはこの装置を使っている間、車線の中を保つ手伝いもします。"}, {"t": 449.6333333333333, "x": "ルーミーは車線からはみ出しそうになると知らせる形です。"}, {"t": 454.03333333333336, "x": "一般道を中心に走るなら、どちらでも安心できる中身です。"}, {"t": 458.8666666666667, "x": "高速道路をよく使うなら、ソリオの上のグレードが一歩リードです。"}, {"t": 464.0, "x": "なお安全装備は、どちらもグレードで中身が少しずつ変わります。"}, {"t": 468.8, "x": "見積もりの前に装備の一覧表で確かめておきましょう。"}, {"t": 473.0, "x": "どちらの装置も、運転を代わってくれるものではありません。"}, {"t": 477.1333333333333, "x": "最後にブレーキを踏むのは、いつでも運転する人です。"}, {"t": 483.3, "x": "ここで第三章のエンジンの違いが数字になって表れます。"}, {"t": 487.73333333333335, "x": "ルーミーの燃費は、ターボなしの二輪駆動で1リットル18.4キロです。"}, {"t": 493.6333333333333, "x": "ターボ付きと四輪駆動では16.8キロになります。"}, {"t": 497.6666666666667, "x": "ソリオは1リットル20.7キロから22.0キロです。"}, {"t": 502.26666666666665, "x": "10リットルのガソリンで走れる距離にすると、違いがよく分かります。"}, {"t": 507.53333333333336, "x": "ルーミーなら184キロです。"}, {"t": 510.2, "x": "ソリオなら207キロから220キロまで走れます。"}, {"t": 514.4, "x": "給油の回数が減るのは、スタンドが遠い土地ではうれしいところです。"}, {"t": 519.5333333333333, "x": "ソリオは四輪駆動を選んでもハイブリッドのままです。"}, {"t": 523.5, "x": "雪国で燃費も気になるかたには、ここも見どころです。"}, {"t": 527.7333333333333, "x": "値段はルーミーのいちばん安いXが183万円です。"}, {"t": 532.4, "x": "ソリオのいちばん安いHYBRID MGは192万6100円です。"}, {"t": 538.7, "x": "入り口の値段はルーミーのほうが10万円ほど安くなります。"}, {"t": 543.0666666666667, "x": "ブレーキホールドが付くグレードどうしでは話が変わります。"}, {"t": 547.5333333333333, "x": "ルーミーはGに3万3000円の装備を足すか、カスタムGの217万円です。"}, {"t": 554.4, "x": "ソリオはHYBRID MZで224万8400円です。"}, {"t": 559.9, "x": "ホールドまで含めると、ルーミーのほうが安く手に入ります。"}, {"t": 564.3666666666667, "x": "燃費はソリオ、値段はルーミー。"}, {"t": 567.3, "x": "ここがはっきり分かれるところです。"}, {"t": 571.1333333333333, "x": "ここまでを五つの物差しで整理します。"}, {"t": 574.3333333333334, "x": "一つめは燃費です。ハイブリッドのソリオの勝ちです。"}, {"t": 578.3666666666667, "x": "二つめは坂道や合流での余裕です。これもソリオです。"}, {"t": 583.1333333333333, "x": "三つめは入り口の値段です。こちらはルーミーです。"}, {"t": 587.1333333333333, "x": "四つめはブレーキホールドの付けやすさです。これもルーミーです。"}, {"t": 592.0333333333333, "x": "五つめは高速道路での運転の手伝いです。ソリオの上のグレードです。"}, {"t": 597.5, "x": "スライドドアは上のグレードならどちらも左右とも電動で引き分けです。"}, {"t": 602.8, "x": "数えるとソリオが三つでルーミーが二つです。"}, {"t": 606.6333333333333, "x": "とはいえ三つと二つは、ほんの少しの差です。"}, {"t": 610.3666666666667, "x": "ただ、この勝ち負けは使いかた次第で入れ替わります。"}, {"t": 61 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
