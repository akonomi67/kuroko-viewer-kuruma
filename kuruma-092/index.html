<script>
const D={"name": "小さなSUVならこの一台", "file": "092_小さなSUVならこの一台", "dur": 834.7333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "「後悔するって言われても、一度はSUVに乗ってみたいんだよ」。"}, {"t": 7.9, "x": "こういうご相談が、このところとても増えています。"}, {"t": 11.866666666666667, "x": "以前の回で、SUVを買って後悔する理由を4つお話ししました。"}, {"t": 17.333333333333332, "x": "それでも憧れの気持ちは、そう簡単には消えないものです。"}, {"t": 22.233333333333334, "x": "若いころから、いつかは背の高い車に乗ってみたかった。"}, {"t": 26.6, "x": "そういうかたに「やめましょう」とだけ言うのは、さみしい話です。"}, {"t": 31.6, "x": "そこで今日は、あの回とは反対のお話をします。"}, {"t": 35.6, "x": "後悔のもとを小さくできるSUVを、一台だけ名指しします。"}, {"t": 41.2, "x": "条件はふたつです。"}, {"t": 42.96666666666667, "x": "見晴らしの良さがちゃんと残っていること。"}, {"t": 45.833333333333336, "x": "そして、今の車庫と近所の細い道で困らない大きさであること。"}, {"t": 50.86666666666667, "x": "このふたつを両方満たす車は、じつはとても少ないんです。"}, {"t": 55.96666666666667, "x": "最後には、この車をお勧めしないかたのお話もします。"}, {"t": 60.4, "x": "ご自分がどちらに入るか、考えながら聞いてみてください。"}, {"t": 66.3, "x": "まずはSUVのどこに惹かれるのかを整理しておきます。"}, {"t": 70.26666666666667, "x": "お店でお話を聞いていると、理由はだいたい3つに分かれます。"}, {"t": 74.96666666666667, "x": "ひとつめは見晴らしです。"}, {"t": 77.06666666666666, "x": "座る位置が高いので、前の車の向こうまで見通せます。"}, {"t": 81.46666666666667, "x": "渋滞の先や交差点の信号が早めに目に入ります。"}, {"t": 86.06666666666666, "x": "ふたつめは雪や悪い道での安心感です。"}, {"t": 89.66666666666667, "x": "車の底と地面のあいだが広いので、雪のわだちでお腹をこすりにくいんです。"}, {"t": 95.9, "x": "みっつめは荷物です。"}, {"t": 97.83333333333333, "x": "後ろの扉が大きく開くので、背の高い荷物も積みやすくなります。"}, {"t": 102.96666666666667, "x": "あなたが惹かれているのは、この3つのうちどれでしょうか。"}, {"t": 107.1, "x": "見晴らしだけなら選べる車はぐっと広がります。"}, {"t": 111.2, "x": "雪道がいちばんなら四駆をどうするかが大事になります。"}, {"t": 115.36666666666666, "x": "荷物がいちばんなら、背の高い普通の車で足りることもあります。"}, {"t": 120.13333333333334, "x": "今日は3つ全部をほどよく満たす一台のお話です。"}, {"t": 124.26666666666667, "x": "どれか1つを極めたいかたは、第9章まで聞いてから決めてください。"}, {"t": 131.23333333333332, "x": "それでは今日の一台です。"}, {"t": 133.46666666666667, "x": "トヨタのライズです。"}, {"t": 135.03333333333333, "x": "売り出されたのは2019年の11月5日でした。"}, {"t": 139.4, "x": "長さは3995ミリで、4メートルにわずか5ミリ届きません。"}, {"t": 145.63333333333333, "x": "値段はトヨタの公式の表で180万700円からです。"}, {"t": 150.9, "x": "いちばん上のハイブリッドでも244万2000円です。"}, {"t": 155.43333333333334, "x": "この車はトヨタのお店で売っていますが、作っているのはダイハツです。"}, {"t": 160.36666666666667, "x": "ダイハツにはロッキーという兄弟の車があります。"}, {"t": 164.2, "x": "中身はほぼ同じで、顔つきや装備の組み合わせが違う車です。"}, {"t": 169.56666666666666, "x": "ただダイハツの公式ページでは、ロッキーの今の型は生産を終えています。"}, {"t": 175.46666666666667, "x": "2026年の8月下旬で終わったと書かれています。"}, {"t": 180.1, "x": "これから新車で選ぶなら、ライズが話の中心になります。"}, {"t": 184.73333333333332, "x": "2023年の5月には、ライズのハイブリッドで認証の不正が分かりました。"}, {"t": 191.0, "x": "ダイハツが、横からぶつかる試験で正しくない手続きをしていたものです。"}, {"t": 196.3, "x": "出荷と販売がいったん止まりましたが、その後に国の試験で確かめられました。"}, {"t": 202.0, "x": "ハイブリッドは2024年の4月19日に、出荷を止める指示が解かれています。"}, {"t": 208.1, "x": "ガソリン車は、それより先の3月4日に出荷が再開されました。"}, {"t": 213.16666666666666, "x": "改良が入ると装備や値段が変わることもあります。"}, {"t": 217.1, "x": "今日の数字は、いまトヨタの公式サイトに載っている型のものです。"}, {"t": 223.3, "x": "次は今日いちばん大事な幅のお話です。"}, {"t": 226.9, "x": "ライズの幅は1695ミリです。"}, {"t": 230.2, "x": "車には、5ナンバーと3ナンバーという分けかたがあります。"}, {"t": 234.73333333333332, "x": "5ナンバーの小型車は、法律で大きさの上限が決まっています。"}, {"t": 239.16666666666666, "x": "長さは4.7メートルまで、幅は1.7メートルまで。"}, {"t": 243.8, "x": "高さは2メートルまでで、エンジンの大きさにも上限があります。"}, {"t": 248.4, "x": "ライズは長さも幅も高さも、この枠の中に収まっています。"}, {"t": 253.26666666666668, "x": "幅が何に効くのかを3つの場面で考えてみます。"}, {"t": 257.43333333333334, "x": "ひとつめは古い家の車庫です。"}, {"t": 260.46666666666664, "x": "幅が数センチ広いだけで、扉を開けて降りるすきまがなくなることがあります。"}, {"t": 265.8666666666667, "x": "ふたつめは生け垣や塀にはさまれた細い道です。"}, {"t": 270.1666666666667, "x": "向こうから車が来たとき、左に寄せるゆとりが残るかは幅で決まります。"}, {"t": 275.8, "x": "みっつめはスーパーの駐車場の白線の中です。"}, {"t": 279.43333333333334, "x": "隣の車とのあいだに、ドアを開けるすきまが残るかどうかです。"}, {"t": 284.46666666666664, "x": "小回りの数字も見ておきます。"}, {"t": 286.93333333333334, "x": "いちばん小さく回れる円の半径は、XとGで4.9メートルです。"}, {"t": 292.73333333333335, "x": "いちばん上のZは、タイヤが大きいので5.0メートルになります。"}, {"t": 297.76666666666665, "x": "ひとつ注意していただきたいのは高さです。"}, {"t": 300.9, "x": "屋根までの高さは1620ミリあります。"}, {"t": 304.7, "x": "立体駐車場の高さの制限は看板で必ず確かめてください。"}, {"t": 309.8, "x": "お宅の車庫の入り口の幅を、一度メジャーで測ってみてください。 足を離しても、止まっていられる機能も付きます。"}, {"t": 477.2, "x": "ガソリン車のGとXは手で引くレバー式です。"}, {"t": 481.1333333333333, "x": "ふたつめは荷室の床板の下にある物入れです。"}, {"t": 484.8666666666667, "x": "床板を上の段にしたとき、ハイブリッドは81リットル。"}, {"t": 489.6666666666667, "x": "ガソリンの前輪駆動は145リットルあります。"}, {"t": 493.8, "x": "みっつめは、もしものときの電源です。"}, {"t": 497.1333333333333, "x": "ハイブリッドには、家電が使える100ボルトのコンセントを付けられます。"}, {"t": 501.9, "x": "4万4000円の注文で、1500ワットまで使えるものです。"}, {"t": 507.1333333333333, "x": "停電のときに携帯電話を充電できるのは、心強いところです。"}, {"t": 511.96666666666664, "x": "店長の答えは、近所の買い物が中心ならガソリンで十分。"}, {"t": 517.0333333333333, "x": "静かさと電動のブレーキが欲しいかたは、ハイブリッドです。"}, {"t": 523.3333333333334, "x": "SUVと聞くと、四駆を思い浮かべるかたも多いと思います。"}, {"t": 528.0, "x": "ライズで四駆を選ぶと、エンジンは1リッターのターボだけになります。"}, {"t": 532.8333333333334, "x": "ハイブリッドには四駆の設定がありません。"}, {"t": 535.8333333333334, "x": "燃費は1リットル17.4キロで、前輪駆動のガソリン車より下がります。"}, {"t": 542.0666666666667, "x": "値段はGで比べると27万7200円上がります。"}, {"t": 547.2333333333333, "x": "床板の下の物入れも、上の段で104リットルと小さくなります。"}, {"t": 553.4333333333333, "x": "では、どんなかたなら四駆が要るのでしょうか。"}, {"t": 557.2333333333333, "x": "店長は3つの場面に毎年出会うかどうかで考えます。"}, {"t": 561.4, "x": "ひとつめは家の前や車庫の前が坂で、冬に凍ることです。"}, {"t": 566.1666666666666, "x": "ふたつめは、雪の朝でも出かけなければならない用事があることです。"}, {"t": 571.0333333333333, "x": "みっつめは、ぬかるむ畑の道や舗装されていない坂を走ることです。"}, {"t": 576.1, "x": "どれにも当てはまらないなら、前輪駆動で足りることが多いです。"}, {"t": 581.2333333333333, "x": "年に一度か2度の雪なら、その日は出かけないと決めるのも手です。"}, {"t": 586.5, "x": "それから四駆にしても冬のタイヤは欠かせません。"}, {"t": 590.0, "x": "四駆は進む力を助けますが、止まる力までは増やしてくれないからです。"}, {"t": 595.4333333333333, "x": "雪道の車選びはハスラーの回でくわしくお話ししています。"}, {"t": 601.7333333333333, "x": "ライズのグレードは、値段の安い順にX、G、Zの3つです。"}, {"t": 607.9666666666667, "x": "トヨタの公式ページには、サポカーSワイドの車だと書かれています。"}, {"t": 613.1666666666666, "x": "ぶつかりそうなときに、自動でブレーキをかけて助ける装備があります。"}, {"t": 618.2333333333333, "x": "相手が車なら、速さの差がおよそ30キロから120キロで働きます。"}, {"t": 624.2, "x": "歩いている人なら、およそ30キロから60キロのあいだです。"}, {"t": 629.4, "x": "ペダルの踏み間違いで急に動き出すのを抑える仕組みは、前にも後ろにも働きます。"}, {"t": 635.9333333333333, "x": "ここからがグレードの分かれ目です。"}, {"t": 638.6333333333333, "x const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
