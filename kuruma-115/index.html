<script>
const D={"name": "アルトとミライースどっち", "file": "115_アルトとミライースどっち", "dur": 778.66665625, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 2.9, "x": "お店をやっていると、よく言われる一言があります。"}, {"t": 6.633333333333334, "x": "「いちばん安い軽でいいから」という一言です。"}, {"t": 10.566666666666666, "x": "買い物と病院に行ければ、それで十分だというご注文です。"}, {"t": 15.6, "x": "そう言われた時に、店長がまず並べる2台があります。"}, {"t": 19.966666666666665, "x": "スズキのアルトと、ダイハツのミライースです。"}, {"t": 23.6, "x": "どちらも屋根の低い、昔ながらの形の軽自動車です。"}, {"t": 28.3, "x": "背の高い軽にくらべると、値段も重さもぐっと控えめな2台です。"}, {"t": 33.43333333333333, "x": "ミライースのいちばん安い形は109万6700円です。"}, {"t": 38.666666666666664, "x": "アルトのいちばん安い形は114万2900円です。"}, {"t": 43.7, "x": "ただしアルトのこの形は、注文を受けてから作る形です。"}, {"t": 48.5, "x": "後ろのドアの窓ガラスも、開かない作りになっています。"}, {"t": 52.8, "x": "そこで今日は、お店にふつうに並ぶ形どうしでくらべます。"}, {"t": 57.43333333333333, "x": "その2つの値段の差はおよそ10万円です。"}, {"t": 61.4, "x": "その10万円で何が変わるのかを、順番に見ていきます。"}, {"t": 67.26666666666667, "x": "まず外の大きさからです。"}, {"t": 69.6, "x": "長さはどちらも3395ミリです。"}, {"t": 73.4, "x": "幅もどちらも1475ミリで、ここまでは2台とも同じ数字です。"}, {"t": 80.03333333333333, "x": "国の決まりで、軽自動車は長さ3.4メートルと幅1.48メートルまでです。"}, {"t": 86.53333333333333, "x": "2台とも、その枠にほとんどいっぱいの大きさです。"}, {"t": 90.56666666666666, "x": "小回りの数字も、2台とも4.4メートルでそろっています。"}, {"t": 95.26666666666667, "x": "ハンドルをいっぱいに切って回った時の、円の大きさの数字です。"}, {"t": 100.03333333333333, "x": "せまい駐車場での回りやすさは、2台に差がありません。"}, {"t": 104.4, "x": "違いが出るのは高さと重さです。"}, {"t": 107.2, "x": "屋根の高さはアルトが1525ミリで、ミライースが1500ミリです。"}, {"t": 112.9, "x": "アルトが2.5センチ高く、中の天井もアルトが2センチ高くなっています。"}, {"t": 118.63333333333334, "x": "重さは今日くらべる形で、アルトが690キロでミライースが660キロです。"}, {"t": 125.36666666666666, "x": "ミライースのほうが、30キロ軽い車です。"}, {"t": 129.0, "x": "地面から車の底までの高さは、ミライースが155ミリです。"}, {"t": 134.46666666666667, "x": "アルトは130ミリなので、ここはミライースが2.5センチ高くなります。"}, {"t": 139.86666666666667, "x": "段差の多い道や少し雪の積もった朝には、このゆとりが効いてきます。"}, {"t": 146.03333333333333, "x": "中の長さも見ておきます。"}, {"t": 148.5, "x": "今日くらべる形では、アルトが1960ミリでミライースが1935ミリです。"}, {"t": 155.33333333333334, "x": "ここはアルトが2.5センチ長く、天井と合わせて中はアルトが少し広めです。"}, {"t": 163.06666666666666, "x": "ここで今日くらべる形を決めておきます。"}, {"t": 166.16666666666666, "x": "ミライースはLという形で、前のタイヤを回す形です。"}, {"t": 170.76666666666668, "x": "値段は109万6700円です。"}, {"t": 174.1, "x": "アルトもLという形で、こちらも前のタイヤを回す形です。"}, {"t": 178.86666666666667, "x": "値段は119万7900円です。"}, {"t": 182.53333333333333, "x": "差は10万1200円で、ミライースのほうが安くなります。"}, {"t": 187.16666666666666, "x": "どちらもメーカーの公式の、メーカー希望小売価格です。"}, {"t": 191.53333333333333, "x": "同じLという名前ですが、たまたまそろっただけで中身は別の車です。"}, {"t": 196.93333333333334, "x": "毎年の軽自動車税は、自家用ならどちらも標準で1万800円です。"}, {"t": 203.36666666666667, "x": "税金では差がつかないので、今日は車の中身だけを見ていきます。"}, {"t": 208.4, "x": "使うガソリンはどちらもレギュラーです。"}, {"t": 211.26666666666668, "x": "ガソリンを入れるタンクはアルトが27リットルで、ミライースが28リットルです。"}, {"t": 219.46666666666667, "x": "次は燃費です。"}, {"t": 221.13333333333333, "x": "国の決まった測りかたで、ミライースは1リットルあたり27.0キロ走ります。"}, {"t": 227.23333333333332, "x": "アルトのLは25.8キロなので、ここはミライースが1.2キロ上です。"}, {"t": 233.1, "x": "ところが、この数字にはもう1つの見かたがあります。"}, {"t": 237.0, "x": "信号や渋滞の多い町の中を考えた、市街地モードという数字です。"}, {"t": 242.8, "x": "こちらはミライースが22.9キロで、アルトのLが23.0キロです。"}, {"t": 248.73333333333332, "x": "差は0.1キロで、今度はアルトのほうが少しだけ上になりました。"}, {"t": 253.93333333333334, "x": "近所の買い物と病院が中心なら、ほとんど同じと考えてよい差です。"}, {"t": 259.53333333333336, "x": "年に3000キロを、町の中だけで走るとして計算してみます。"}, {"t": 264.6, "x": "ミライースは約131.0リットルで、アルトは約130.4リットルです。"}, {"t": 271.3333333333333, "x": "差は0.6リットルほどで、ガソリンの量はほとんど変わりません。"}, {"t": 276.3666666666667, "x": "反対に、信号の少ない郊外の道は郊外モードという数字で見ます。"}, {"t": 281.93333333333334, "x": "こちらはミライースが29.1キロで、アルトのLは27.1キロです。"}, {"t": 288.03333333333336, "x": "広い道を長く走るかたほど、ミライースの燃費の良さが出てきます。"}, {"t": 293.3666666666667, "x": "ちなみにアルトには、小さなモーターが手助けするハイブリッドの形もあります。"}, {"t": 298.73333333333335, "x": "いちばん安いハイブリッドのSなら燃費は28.2キロです。"}, {"t": 304.03333333333336, "x": "ただし値段は130万1300円で、ミライースのLより20万4600円高くなります。"}, {"t": 311.53333333333336, "x": "どの数字も試験の条件で測ったもので、冬の暖房などで悪くなります。"}, {"t": 318.6, "x": "ここからは安全の装備です。"}, {"t": 321.1333333333333, "x": "まず、ぶつかりそうな時に自動で止まるブレーキは2台とも付いています。"}, {"t": 326.4, "x": "車だけでなく、歩いている人や自転車にも反応する仕組みです。"}, {"t": 331.43333333333334, "x": "ミライースは、横断中の歩行者や自転車も見分けるとダイハツは説明しています。"}, {"t": 337.5, "x": "アルトは、車と歩行者と自転車に加えて、バイクにも反応するとスズキは説明しています。"}, {"t": 344.53333333333336, "x": "前を見る道具は2台で違います。"}, {"t": 347.3666666666667, "x": "ミライースは、2つの目を持つカメラで前の様子を見ています。"}, {"t": 352.3, "x": "アルトは、カメラと電波を組み合わせて前の様子を見ています。"}, {"t": 356.93333333333334, "x": "踏み間違いで急に動き出すのをおさえる仕組みも、2台ともあります。"}, {"t": 361.96666666666664, "x": "これも、前に進む時と後ろに下がる時の両方に付いています。"}, {"t": 366.8666666666667, "x": "車の前と後ろが物に近づくと、音で知らせるセンサーも2台ともあります。"}, {"t": 372.8333333333333, "x": "前の車が動き出したのを知らせる仕組みも、2台とも同じように付いています。"}, {"t": 378.53333333333336, "x": "そして2台とも、サポートカー限定免許で運転できる車に入っています。"}, {"t": 384.56666666666666, "x": "ミライースはダイハツの案内に、アルトは警察庁の一覧にそう書かれています。"}, {"t": 390.46666666666664, "x": "車線からはみ出しそうな時に知らせる仕組みも、2台ともあります。"}, {"t": 395.46666666666664, "x": "アルトは、車線の内側に戻すようにハンドルの手助けもします。"}, {"t": 400.6333333333333, "x": "ミライースには、道の端へはみ出しそうな時の知らせが付いています。"}, {"t": 405.6666666666667, "x": "ただし、アルトのものは時速50キロくらいから働く仕組みです。"}, {"t": 410.56666666666666, "x": "ミライースの道の端の知らせも、時速60キロくらいから働きます。"}, {"t": 415.8666666666667, "x": "近所の細い道では出番が少ないので、ここは大きな差にはなりません。"}, {"t": 422.96666666666664, "x": "ここが今日いちばん大事な話です。"}, {"t": 425.6666666666667, "x": "ぶつかってしまった時に体を守る、エアバッグの数が違います。"}, {"t": 430.43333333333334, "x": "アルトはどの形にもエアバッグが6つ付いています。"}, {"t": 434.26666666666665, "x": "運転席と助手席の前に2つ、座席の横に2つ、窓の側に2つです。"}, {"t": 440.8666666666667, "x": "窓の側のものはカーテンエアバッグといって、横からの衝撃から頭を守ります。"}, {"t": 447.0, "x": "横の袋はぶつかった側だけがふくらむと、スズキは説明しています。"}, {"t": 452.3333333333333, "x": "ミライースも前の2つと座席の横の2つは、どの形にも付いています。"}, {"t": 458.1, "x": "ただ、ミライースの装備一覧表には、カーテンエアバッグの欄がありませんでした。"}, {"t": 463.96666666666664, "x": "いちばん上の形を選んでも、ミライースは4つのままです。"}, {"t": 468.76666666666665, "x": "つまりミライースは4つで、アルトは6つという違いになります。"}, {"t": 473.6666666666667, "x": "近所の道でも、交差点や駐車場の出入り口では横から車が来ます。"}, {"t": 479.3666666666667, "x": "その時に、頭の横を守る袋があるかどうかは小さくない違いです。"}, {"t": 484.6333333333333, "x": "店長は10万円の差の多くがここにあると考えています。"}, {"t": 490.5, "x": "2つ目の違いは座席を温める仕組みです。"}, {"t": 494.3333333333333, "x": "アルトのLには、運転席の座面を温める仕組みが最初から付いています。"}, {"t": 500.3333333333333, "x": "アルトで4つのタイヤを回す形にすると、助手席も温まります。"}, {"t": 505.26666666666665, "x": "ミライースのLには、座席を温める仕組みが付いていません。"}, {"t": 509.8333333333333, "x": "ミライースで欲しい時は、いちばん上の形を選ぶことになります。"}, {"t": 514.4666666666667, "x": "こちらは運転席と助手席の両方が温まります。"}, {"t": 518.4666666666667, "x": "ただし値段は138万500円で、アルトのLより18万2600円高くなります。"}, {"t": 525.8666666666667, "x": "腰や膝が冷えやすいかたには、冬の朝がずいぶん楽になる装備です。"}, {"t": 531.3333333333334, "x": "車の暖房が効いてくるまでの間も、座面から先に温まってくれます。"}, {"t": 538.0333333333333, "x": "ここまでアルトの良いところが続きましたが、ミライースにも強みがあります。"}, {"t": 543.1666666666666, "x": "1つ目はやはり買う時の値段です。"}, {"t": 545.8666666666667, "x": "10万1200円安いぶん、その分を別の装備に回すこともできます。"}, {"t": 551.5666666666667, "x": "2つ目は地面から車の底までのゆとりです。"}, {"t": 555.4, "x": "二輪駆動で155ミリあり、アルトより2.5センチ高くなっています。"}, {"t": 560.9666666666667, "x": "4つのタイヤを回す形にすると、ミライースは160ミリになります。"}, {"t": 566.8, "x": "アルトは四輪駆動でも130ミリのままです。"}, {"t": 570.4, "x": "3つ目は四輪駆動にした時の値段と燃費です。"}, {"t": 574.3, "x": "ミライースのLの四輪駆動は122万3200円です。"}, {"t": 579.2, "x": "アルトのLの四輪駆動は132万8800円で、差は10万5600円です。"}, {"t": 586.7, "x": "燃費は、ミライースの四輪駆動が1リットルあたり24.4キロです。"}, {"t": 592.8, "x": "アルトのLの四輪駆動は23.8キロなので、ここもミライースが上です。"}, {"t": 598.6333333333333, "x": "ミライースの四輪駆動は、ガソリンのタンクも30リットルに増えます。"}, {"t": 603.6666666666666, "x": "雪の多い所に住んでいて、値段を抑えたいかたには心強い数字です。"}, {"t": 611.3, "x": "近所の足でも、店長は後ろを映すカメラを付けることを勧めています。"}, {"t": 616.6333333333333, "x": "ミライースのLは2万2000円で付けられます。"}, {"t": 620.4, "x": "カーナビを付けるための部品と一緒になったメーカーの注文品です。"}, {"t": 624.9666666666667, "x": "アルトのLは5万600円で付けられます。"}, {"t": 628.6666666666666, "x": "こちらは、困った時に連絡できる通信の機械やボタンと一緒になっています。"}, {"t": 634.2333333333333, "x": "カメラまで入れると、ミライースは111万8700円です。"}, {"t": 639.4666666666667, "x": "アルトは124万8500円で、差は12万9800円に広がります。"}, {"t": 646.0333333333333, "x": "どちらも車を注文する時にしか付けられないので、最初に決めておきましょう。"}, {"t": 651.9, "x": "カメラを付けなくても、後ろの壁に近づけば2台ともセンサーが音で知らせます。"}, {"t": 657.6333333333333, "x": "それでも、駐車場で後ろの様子が画面で見えると安心の度合いが違います。"}, {"t": 664.9, "x": "それでは、70代の近所の足としての店長の答えです。"}, {"t": 669.7666666666667, "x": "店長はアルトのLをお勧めします。"}, {"t": 672.6, "x": "いちばんの理由は窓の側のカーテンエアバッグです。"}, {"t": 676.9333333333333, "x": "近所の道でも、横から車が来る場面は毎日のようにあります。"}, {"t": 681.9333333333333, "x": "2つ目の理由は冬の朝に運転席が温まることです。"}, {"t": 686.5333333333333, "x": "3つ目は中の天井と長さがアルトのほうが少しずつ広いことです。"}, {"t": 691.7333333333333, "x": "町の中の燃費はほとんど同じなので、ガソリンの量でも損をしません。"}, {"t": 697.2, "x": "ぶつからないための装備は、ミライースでも十分にそろっています。"}, {"t": 701.8333333333334, "x": "だからこそ、差の10万円は横の守りと冬の温かさの代金だと考えてください。"}, {"t": 710.1333333333333, "x": "では、ミライースが向いているのはどんなかたでしょうか。"}, {"t": 714.2666666666667, "x": "1つ目はとにかく買う時の値段を抑えたいかたです。"}, {"t": 718.1666666666666, "x": "2つ目は段差の多い道や雪の積もる道をよく走るかたです。"}, {"t": 723.1333333333333, "x": "車の底が高く、四輪駆動なら値段も燃費もアルトより有利です。"}, {"t": 729.1333333333333, "x": "3つ目は信号の少ない郊外の道を長く走るかたです。"}, {"t": 733.5333333333333, "x": "郊外モードの燃費の差は1リットルあたり2.0キロありました。"}, {"t": 738.6, "x": "最後にお店では2つのことを確かめてください。"}, {"t": 742.4666666666667, "x": "1つは2台の運転席に座って、乗り降りと窓の見え方をくらべることです。"}, {"t": 748.6, "x": "もう1つはカメラまで入れた見積もりを2台並べてもらうことです。"}, {"t": 753.3333333333334, "x": "今日の数字は、11月にスズキとダイハツの公式の諸元表と装備一覧表で確かめました。"}, {"t": 760.5666666666667, "x": "値段や装備は改良で変わるので、契約の前に販売店で最新の表を見せてもらってください。"}, {"t": 767.4333333333333, "x": "いちばん安い一台を選ぶ時でも、守りの装備だけは見比べてから決めてください。"}, {"t": 773.6, "x": "店長は今日も店先に2台を並べてお待ちしています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
