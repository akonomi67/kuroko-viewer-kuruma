<script>
const D={"name": "ヤリスとフィットどっち", "file": "091_ヤリスとフィットどっち", "dur": 787.9333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "2020年の2月、わずか4日のあいだに2台の小さな車が売り出されました。"}, {"t": 9.333333333333334, "x": "2月10日にトヨタのヤリス。"}, {"t": 11.866666666666667, "x": "2月14日にホンダのフィットです。"}, {"t": 15.033333333333333, "x": "同じ年の同じ月に生まれた同級生の2台です。"}, {"t": 19.166666666666668, "x": "それから6年あまり、この2台はずっと比べられてきました。"}, {"t": 23.533333333333335, "x": "お店でも、ここまで絞って決められなくなるかたがとても多いです。"}, {"t": 28.466666666666665, "x": "「どっちも評判がいいと聞くから、よけいに迷うのよ」。"}, {"t": 32.53333333333333, "x": "この2台の前でそんな声を何度も聞いてきました。"}, {"t": 36.4, "x": "今日はこの同級生を一騎打ちで比べます。"}, {"t": 39.766666666666666, "x": "そして最後に、70代のかたにはどちらか一台に決めてお答えします。"}, {"t": 45.233333333333334, "x": "答えを先に言うと、比べる楽しみがなくなってしまいます。"}, {"t": 49.733333333333334, "x": "ですから今日は勝ち負けの表を作りながら進めます。"}, {"t": 53.6, "x": "比べるところは6つです。"}, {"t": 55.9, "x": "中の広さと前の見え方と安全の装備。"}, {"t": 59.53333333333333, "x": "それから燃費と値段と小回りです。"}, {"t": 62.36666666666667, "x": "ひとつ比べるたびに勝ったほうに丸を付けていきます。"}, {"t": 66.1, "x": "最後に丸を数えてそこから答えを出します。"}, {"t": 71.76666666666667, "x": "まずは2台の同じところから確かめておきます。"}, {"t": 75.13333333333334, "x": "ひとつめは幅です。"}, {"t": 76.96666666666667, "x": "ヤリスもフィットも幅は1695ミリでぴったり同じです。"}, {"t": 82.36666666666666, "x": "5ナンバーと呼ばれる小型車の枠は、幅1700ミリまでです。"}, {"t": 87.5, "x": "2台ともその枠にあと5ミリで収まっています。"}, {"t": 91.2, "x": "古い家の車庫でも細い道でのすれ違いでも、幅では差が出ません。"}, {"t": 96.76666666666667, "x": "ふたつめは長さです。"}, {"t": 98.83333333333333, "x": "ヤリスは3950ミリ、フィットのいちばん短い形は3995ミリ。"}, {"t": 106.1, "x": "差は4.5センチしかありません。"}, {"t": 108.9, "x": "軽自動車と比べても、ヤリスなら55センチほど長いだけです。"}, {"t": 114.06666666666666, "x": "ただしフィットは形によって長さが変わります。"}, {"t": 117.53333333333333, "x": "上の形のZでは4080ミリになります。"}, {"t": 121.6, "x": "それから、フィットにはクロスターという少し背の高い形もあります。"}, {"t": 126.96666666666667, "x": "こちらは幅が1725ミリになり、3ナンバーの車になります。"}, {"t": 132.23333333333332, "x": "車庫の幅がぎりぎりのかたは、クロスターだけは気をつけてください。"}, {"t": 136.96666666666667, "x": "みっつめは、ハイブリッドとガソリン車の両方から選べることです。"}, {"t": 141.76666666666668, "x": "どちらにするかは前の回で計算してお話ししました。"}, {"t": 146.1, "x": "年に走る距離で答えが変わるというお話でした。"}, {"t": 150.2, "x": "今日はそこには深入りせず、2台の違いだけに絞ります。"}, {"t": 154.56666666666666, "x": "よっつめは、座席とハンドルの調整です。"}, {"t": 158.0, "x": "座席の高さを変える仕組みと、ハンドルの前後と上下の調整。"}, {"t": 163.03333333333333, "x": "この3つは2台ともどの形にも付いています。"}, {"t": 166.66666666666666, "x": "ひとつだけ例外があり、ヤリスで回る座席を選ぶと高さの調整は付きません。"}, {"t": 172.63333333333333, "x": "腰に合わせた座りかたは前の回でくわしくお話ししました。"}, {"t": 177.43333333333334, "x": "つまりこの2台は外の大きさでは勝ち負けがつきません。"}, {"t": 181.5, "x": "差が出るのはここから先の中身です。"}, {"t": 186.1, "x": "では1つめの比べっこです。"}, {"t": 188.56666666666666, "x": "外から見た屋根の高さは、ヤリスが1495ミリです。"}, {"t": 193.46666666666667, "x": "フィットのいちばん低い形は1515ミリです。"}, {"t": 197.73333333333332, "x": "差はたった2センチで、並べてもほとんど分かりません。"}, {"t": 201.93333333333334, "x": "ところが、車の中の天井までの高さを比べると話が変わります。"}, {"t": 207.5, "x": "メーカーが測った室内の高さは、ヤリスが1190ミリ。"}, {"t": 212.43333333333334, "x": "フィットは1260ミリあります。"}, {"t": 215.1, "x": "外では2センチの差が、中では7センチの差になっているのです。"}, {"t": 220.26666666666668, "x": "7センチといえば湯のみ茶わん1つぶんくらいの高さです。"}, {"t": 224.73333333333332, "x": "座ったときの頭の上にそのぶんゆとりが生まれます。"}, {"t": 229.03333333333333, "x": "室内の長さも、ヤリスの1845ミリに対してフィットは1955ミリです。"}, {"t": 235.73333333333332, "x": "前から後ろまで11センチ長くとってあります。"}, {"t": 239.43333333333334, "x": "外の大きさがほぼ同じなのに、中はフィットのほうが広い。"}, {"t": 244.6, "x": "ここははっきりフィットの勝ちです。"}, {"t": 247.36666666666667, "x": "もう1つ、フィットには後ろの席に変わった仕掛けがあります。"}, {"t": 251.96666666666667, "x": "後ろの座席の座る面を上へはね上げられるのです。"}, {"t": 256.4, "x": "はね上げると、床から天井まで背の高いすき間ができます。"}, {"t": 261.1666666666667, "x": "背の高い鉢植えも寝かせずに立てたまま載せられます。"}, {"t": 265.26666666666665, "x": "この仕掛けはフィットならどの形にも付いています。"}, {"t": 268.93333333333334, "x": "1つめの丸は、フィットです。"}, {"t": 273.4, "x": "2つめは運転席からの前の見え方です。"}, {"t": 276.8333333333333, "x": "ここもフィットのほうに目立つ工夫があります。"}, {"t": 279.96666666666664, "x": "フロントガラスの両わきの柱を、とても細く作ってあるのです。"}, {"t": 284.8333333333333, "x": "斜め前の見え方は、前の回で5台をくらべたときにお話ししました。"}, {"t": 290.6, "x": "そのときもフィットは、柱の細さでひときわ目立っていました。"}, {"t": 295.5, "x": "今日は細かい数字は繰り返さず、結論だけにしておきます。"}, {"t": : 459.43333333333334, "x": "ただし年に走る距離が短いかたほど、お金の差は小さくなります。"}, {"t": 464.56666666666666, "x": "それでも数字の差ははっきりしているので、4つめの丸はヤリスです。"}, {"t": 469.76666666666665, "x": "5つめは値段です。"}, {"t": 471.8666666666667, "x": "メーカーの希望小売価格で、ヤリスは169万7300円から288万4200円まで。"}, {"t": 480.3333333333333, "x": "フィットは180万6200円から295万5700円までです。"}, {"t": 487.1, "x": "いちばん安い形どうしで、ヤリスがおよそ11万円安く買えます。"}, {"t": 492.6333333333333, "x": "いちばん高い形どうしでも、ヤリスが7万円ほど安くなります。"}, {"t": 498.03333333333336, "x": "ただヤリスの安い形は1000ccのガソリン車です。"}, {"t": 502.3333333333333, "x": "フィットの安い形は1500ccのガソリン車です。"}, {"t": 507.2, "x": "エンジンの大きさが違うので、まったく同じ条件の比べっこではありません。"}, {"t": 512.5, "x": "それでも値段で選びやすいのはヤリスです。"}, {"t": 515.6666666666666, "x": "5つめの丸は、ヤリスに付けます。"}, {"t": 520.4333333333333, "x": "6つめは小回りです。"}, {"t": 522.6, "x": "ハンドルをいっぱいに切って回るとき、車が描く円の半径を比べます。"}, {"t": 528.2, "x": "15インチのタイヤの形どうしで、ヤリスは4.8メートル。"}, {"t": 533.3666666666667, "x": "フィットは4.9メートルです。"}, {"t": 535.8, "x": "差は10センチで、大きな差ではありません。"}, {"t": 539.3, "x": "それでも小さいほうが狭い場所で楽なのは確かです。"}, {"t": 543.2, "x": "ひとつ気をつけたいのはタイヤの大きさです。"}, {"t": 546.2333333333333, "x": "見た目のよい大きなタイヤの形を選ぶと、回る円が大きくなります。"}, {"t": 551.8, "x": "ヤリスの上の形のZでは5.1メートルになります。"}, {"t": 556.0333333333333, "x": "小回りを大事にするなら、タイヤの小さい形を選ぶのがこつです。"}, {"t": 561.3333333333334, "x": "6つめの丸はわずかにヤリスです。"}, {"t": 565.8, "x": "ではここまでの丸を数えてみましょう。"}, {"t": 568.7, "x": "中の広さは、フィット。"}, {"t": 571.1666666666666, "x": "前の見え方も、フィット。"}, {"t": 573.5666666666667, "x": "安全の装備も、全部の形にそろっている点でフィット。"}, {"t": 578.0666666666667, "x": "燃費は、ヤリス。"}, {"t": 580.1, "x": "値段も、ヤリス。"}, {"t": 582.1, "x": "小回りは、わずかにヤリス。"}, {"t": 584.6333333333333, "x": "3つと3つで、きれいに引き分けになりました。"}, {"t": 588.3666666666667, "x": "同級生だけあって、ここまで互角になるとは店長も思っていませんでした。"}, {"t": 593.9666666666667, "x": "では、どうやって一台に決めるか。"}, {"t": 597.1, "x": "店長は、70代のかたにとって重い丸と軽い丸があると考えています。"}, {"t": 603.3333333333334, "x": "燃費と値段は毎月のお財布に関わる大事な丸です。"}, {"t": 608.3666666666667, "x": "けれども走る距離が少なければ燃費の差は小さくなります。"}, {"t": 613.1666666666666, "x": "小回りの10センチも、切り返し1回でおぎなえる範囲です。"}, {"t": 617.9666666666667, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
