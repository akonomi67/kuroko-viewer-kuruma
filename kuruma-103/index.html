<script>
const D={"name": "幅で選ぶ普通車5台", "file": "103_幅で選ぶ普通車5台", "dur": 830.0333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "今日は最初に2つの数字を聞いていただきます。"}, {"t": 6.366666666666666, "x": "1695と1765です。"}, {"t": 10.2, "x": "どちらもトヨタの車の幅で、単位はミリです。"}, {"t": 14.5, "x": "1695ミリがヤリスで、1765ミリがヤリス クロスです。"}, {"t": 21.833333333333332, "x": "名前の違いはクロスが付くかどうかだけです。"}, {"t": 25.4, "x": "それなのに幅は7センチも違います。"}, {"t": 28.433333333333334, "x": "お店でもヤリスを見に来たとおっしゃるかたがいます。"}, {"t": 31.833333333333332, "x": "お話をうかがうと、見たいのはヤリス クロスのほうだったりします。"}, {"t": 37.1, "x": "名前がよく似ていますから無理もありません。"}, {"t": 40.6, "x": "ただ家の車庫が狭いかたには、この7センチは大きな差です。"}, {"t": 45.46666666666667, "x": "車が7センチ広がれば、左右のすきまは合わせて7センチ減ります。"}, {"t": 50.8, "x": "降りるときにドアを開けられる幅が、その分だけ狭くなるわけです。"}, {"t": 55.93333333333333, "x": "今日はこの幅だけを物差しにして車を選びます。"}, {"t": 59.766666666666666, "x": "普通車に乗りたいけれど、家の車庫や前の道が心配です。"}, {"t": 64.83333333333333, "x": "そういう70代のかたに向けたお話です。"}, {"t": 68.2, "x": "選んだのはヤリスとフィットとノート、それにライズとルーミーです。"}, {"t": 73.36666666666666, "x": "5台とも幅が1700ミリを切る、5ナンバーの車です。"}, {"t": 78.46666666666667, "x": "1台ずつに幅のほかの決め手を1つずつ付けました。"}, {"t": 82.43333333333334, "x": "最後に迷ったときの一台も申し上げます。"}, {"t": 87.2, "x": "5ナンバーという言葉をここで一度おさらいします。"}, {"t": 90.8, "x": "国の決まりに小型自動車という区分があります。"}, {"t": 94.7, "x": "幅は1.7メートル以下で、長さと高さにも上限があります。"}, {"t": 100.06666666666666, "x": "エンジンの大きさも2リットルまでと決まっています。"}, {"t": 103.7, "x": "この枠に全部が収まる乗用車を、5ナンバーと呼んでいます。"}, {"t": 108.83333333333333, "x": "どれか1つでもはみ出すと、3ナンバーと呼ばれる普通車になります。"}, {"t": 114.36666666666666, "x": "ここで多くのかたが気にされるのが税金です。"}, {"t": 117.76666666666667, "x": "3ナンバーは税金が高いと昔からよく言われてきました。"}, {"t": 122.2, "x": "けれども今の自動車税は、エンジンの大きさで決まります。"}, {"t": 126.36666666666666, "x": "幅が広いから、税金が上がるということはありません。"}, {"t": 130.43333333333334, "x": "新しく買う車で、エンジンが1リットルを超えて1.5リットルまで。"}, {"t": 136.33333333333334, "x": "この大きさなら毎年の自動車税は3万500円です。"}, {"t": 141.13333333333333, "x": "5ナンバーでも3ナンバーでもここは同じです。"}, {"t": 144.86666666666667, "x": "ですから今日のお話は、お金よりも使い勝手のお話です。"}, {"t": 149.53333333333333, "x": "もう1つ気をつけたいのが名前の落とし穴です。"}, {"t": 153.53333333333333, "x": "冒頭のヤリスとヤリス クロスがその1つでした。"}, {"t": 157.73333333333332, "x": "ホンダのフィットにも同じことがあります。"}, {"t": 160.6, "x": "フィットのふつうの形は幅が1695ミリです。"}, {"t": 165.16666666666666, "x": "ところがクロスターという形だけは、1725ミリあります。"}, {"t": 170.2, "x": "同じフィットでも、クロスターは3ナンバーになるのです。"}, {"t": 174.33333333333334, "x": "車の名前だけでなく、形の名前まで見てから決めてください。"}, {"t": 180.73333333333332, "x": "では、どれくらいの幅なら困らないのでしょうか。"}, {"t": 184.46666666666667, "x": "これはお宅の車庫と家の前の道で答えが変わります。"}, {"t": 188.9, "x": "そこで車を見に行く前に巻き尺で2つ調べてください。"}, {"t": 193.2, "x": "1つめは車庫の柱と柱、または壁と壁のあいだです。"}, {"t": 198.03333333333333, "x": "いちばん狭いところで測るのがこつです。"}, {"t": 201.06666666666666, "x": "同じやりかたで、門や車庫の入り口の幅も見ておくと安心です。"}, {"t": 206.0, "x": "2つめはいま乗っている車の幅です。"}, {"t": 209.43333333333334, "x": "これは車検証に書いてある数字でかまいません。"}, {"t": 212.76666666666668, "x": "車検証の幅はセンチの単位で書かれています。"}, {"t": 216.46666666666667, "x": "車庫の幅から車の幅を引くと、左右のすきまの合計が出ます。"}, {"t": 221.4, "x": "いまの車で困っていないなら、その数字が1つの目安になります。"}, {"t": 226.63333333333333, "x": "あとは新しい車が、いまの車より狭いか広いかを見ればいいのです。"}, {"t": 232.23333333333332, "x": "ここで1つ覚えておいてほしいことがあります。"}, {"t": 235.66666666666666, "x": "カタログに書かれた幅にはドアミラーが入っていません。"}, {"t": 239.36666666666667, "x": "ミラーを開いたままだと、実際はもう少し幅をとります。"}, {"t": 244.03333333333333, "x": "狭い車庫では、ミラーをたたんでから入れる習慣を付けてください。"}, {"t": 248.63333333333333, "x": "次に家の前の道です。"}, {"t": 251.06666666666666, "x": "建物を建てるときの法律では、道の幅は4メートル以上が基本です。"}, {"t": 256.8, "x": "その4メートルの道で、幅1695ミリの車どうしがすれ違うとします。"}, {"t": 263.7, "x": "2台を足すと3メートル39センチで、残りは61センチです。"}, {"t": 269.56666666666666, "x": "これがヤリス クロスどうしなら、残りは47センチになります。"}, {"t": 275.76666666666665, "x": "この14センチの差が、細い道での気持ちのゆとりを左右します。"}, {"t": 280.8666666666667, "x": "古い町には、幅が4メートルに足りない道もまだ残っています。"}, {"t": 285.8333333333333, "x": "そういう道を毎日通るかたほど、幅の数字が大事になります。"}, {"t": 292.3, "x": "一台目はトヨタのルーミーです。"}, {"t": 294.7, "x": "5台の中でルーミーだけは幅が1670ミリです。"}, {"t": 299.06666666666666, "x": "ほかの4台の1695ミリより、2.5センチ細くなっています。"}, {"t": 304.76666666666665, "x": "けれども、ルーミーの決め手は細さそのものではありません。"}, {"t": 308.9, "x": "後ろのドアが左右ともスライドドアであることです。"}, {"t": 312.7, "x": "車庫の横がきつい家ではドアを大きく開けられません。"}, {"t": 316.96666666666664, "x": "普通のドアだと、後ろの席の人は体を横にして降りることになります。"}, {"t": 322.8666666666667, "x": "スライドドアならドアは車の横に沿って後ろへ動きます。"}, {"t": 327.3333333333333, "x": "ドアを開くための横の場所がほとんど要らないのです。"}, {"t": 331.06666666666666, "x": "後ろの席に買い物の袋を置くときも同じです。"}, {"t": 334.6666666666667, "x": "壁の近くに止めても、ドアを壁にぶつける心配がありません。"}, {"t": 339.1666666666667, "x": "中は背が高く、天井までの高さが1355ミリあります。"}, {"t": 344.6666666666667, "x": "室内の幅も1480ミリあり、外の細さのわりに横はゆったりです。"}, {"t": 351.0, "x": "電気で開け閉めするドアは、形によって片側か両側かが変わります。"}, {"t": 356.6, "x": "運転席の側も電気にしたいなら、形を選ぶときに確かめてください。"}, {"t": 362.1, "x": "なお、よく似たソリオとのくらべは前の回でいたしました。"}, {"t": 366.7, "x": "坂道の多い町にお住まいなら、その回もあわせてご覧ください。"}, {"t": 373.1666666666667, "x": "2台目はトヨタのヤリスです。"}, {"t": 375.6333333333333, "x": "ヤリスとフィットのくらべは、前の回でくわしくお話ししました。"}, {"t": 379.96666666666664, "x": "ですから今日は別の1点だけを取り上げます。"}, {"t": 383.3333333333333, "x": "細い道の脇に車を止めて、降りるときのことです。"}, {"t": 387.6333333333333, "x": "道が細いと、開けたドアのすぐ横を自転車が通ります。"}, {"t": 392.46666666666664, "x": "後ろから来る自転車はミラーではつい見落としがちです。"}, {"t": 396.9, "x": "ヤリスには、安心降車アシストという装備が用意されています。"}, {"t": 401.73333333333335, "x": "降りるときに、後ろから近づく車や自転車を見張ってくれます。"}, {"t": 406.46666666666664, "x": "ドアを開けるとぶつかりそうなときは、知らせてくれる仕組みです。"}, {"t": 410.93333333333334, "x": "道の脇で人を降ろすことの多いかたには、心強い装備です。"}, {"t": 415.8666666666667, "x": "ただしこれはどの形にも付いているわけではありません。"}, {"t": 419.6, "x": "ZとGなどの形で注文のときに選んで付けるものです。"}, {"t": 424.6333333333333, "x": "いちばん安いXの形では選べません。"}, {"t": 427.8666666666667, "x": "車を真上から見たような画面を映す装備も、注文で付けられます。"}, {"t": 433.06666666666666, "x": "こちらはXの形でも選べますので、車庫入れが心配なかたは見てください。"}, {"t": 438.4, "x": "見張りの装備まで足すなら、ヤリスはGから上で考えることになります。"}, {"t": 445.0, "x": "3台目はホンダのフィットです。"}, {"t": 447.6666666666667, "x": "フィットの決め手は、後ろの席の座面がはね上がることです。"}, {"t": 452.1, "x": "座面を持ち上げると、床から天井までの高い場所ができます。"}, {"t": 457.0, "x": "ホンダはこの使いかたをトール・モードと呼んでいます。"}, {"t": 460.7, "x": "鉢植えの木のような背の高い荷物を、立てたまま積めます。"}, {"t": 465.53333333333336, "x": "庭いじりや畑仕事がお好きなかたには、うれしい作りです。"}, {"t": 470.3, "x": "後ろの席の背もたれを倒せば広い荷台としても使えます。"}, {"t": 475.03333333333336, "x": "荷室の口の下の端は地面から610ミリの高さです。"}, {"t": 480.1333333333333, "x": "これはハイブリッドのZの形でホンダが測った数字です。"}, {"t": 484.73333333333335, "x": "重い荷物を持ち上げる高さとして、お店でくらべる目安になります。"}, {"t": 490.0, "x": "もう1つ、フィットはどの形にも足を休める装備が付いています。"}, {"t": 495.26666666666665, "x": "信号で止まったあと、ブレーキから足を離しても止まったままです。"}, {"t": 500.3666666666667, "x": "長い赤信号でも右足を休めることができます。"}, {"t": 504.26666666666665, "x": "ただし先ほどお話ししたとおり、クロスターだけは幅が違います。"}, {"t": 508.8333333333333, "x": "5ナンバーで選ぶなら、クロスター以外の形にしてください。"}, {"t": 514.8666666666667, "x": "4台目は日産のノートです。"}, {"t": 517.5666666666667, "x": "今のノートにはガソリンだけで走る形がありません。"}, {"t": 521.5, "x": "エンジンは電気を作る役で、車を動かすのはモーターです。"}, {"t": 526.2333333333333, "x": "日産はこの仕組みをe-POWERと呼んでいます。"}, {"t": 529.7333333333333, "x": "ノートの決め手は走っているときの静かさです。"}, {"t": 533.5333333333333, "x": "日産は、エンジンが動く回数をおさえて音を減らしたと発表しています。"}, {"t": 539.1333333333333, "x": "そして、1つ上の大きさの車ほどの静かさになったと言っています。"}, {"t": 544.3666666666667, "x": "車の中が静かだと、助手席の人の声が聞き取りやすくなります。"}, {"t": 549.4666666666667, "x": "ナビの案内の声も大きくしなくて済みます。"}, {"t": 552.7333333333333, "x": "耳が少し遠くなってきたと感じるかたには、ありがたい点です。"}, {"t": 557.5, "x": "ただ静かさは、カタログの数字ではくらべにくいものです。"}, {"t": 561.7666666666667, "x": "試乗のときは、ラジオを消して少し走ってみてください。"}, {"t": 565.9666666666667, "x": "坂道でのモーターの力強さは、坂の町の回でお話ししました。"}, {"t": 571.2, "x": "ノートもどの形にも足を休める装備が付いています。"}, {"t": 575.4333333333333, "x": "それから雪の多い土地のかたにうれしいことがあります。"}, {"t": 579.5333333333333, "x": "ノートは四輪駆動を選んでも、幅は1695ミリのままです。"}, {"t": 585.3666666666667, "x": "冬の備えをしても車庫の心配は増えません。"}, {"t": 590.7333333333333, "x": "5台目はトヨタのライズです。"}, {"t": 593.2, "x": "5台の中でただ一台のSUVと呼ばれる形の車です。"}, {"t": 598.2, "x": "ライズの決め手は、座る位置が高くて前を見渡しやすいことです。"}, {"t": 603.7, "x": "この点は、ライズだけを取り上げた回でくわしくお話ししました。"}, {"t": 608.5, "x": "今日お伝えしたいのはやはり幅のことです。"}, {"t": 612.0, "x": "SUVは幅の広い車だと、思われているかたが多いと思います。"}, {"t": 617.7666666666667, "x": "実際に冒頭のヤリス クロスは1765ミリありました。"}, {"t": 623.2666666666667, "x": "それでもライズの幅はヤリスと同じ1695ミリです。"}, {"t": 627.7666666666667, "x": "幅が同じですから、細い道のすれ違いで残る61センチも同じで const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
