<style>

<script>
const D={"name": "ジムニーに憧れるかたへ", "file": "088_ジムニーに憧れるかたへ", "dur": 768.06665625, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "「最後くらい好きな車に乗らせてくれ」。"}, {"t": 6.133333333333334, "x": "七十二歳のお客さまに、そう言われたことがあります。"}, {"t": 10.233333333333333, "x": "わたしはそのとき、何も言い返せませんでした。"}, {"t": 13.733333333333333, "x": "若いころからずっとジムニーに憧れていたそうです。"}, {"t": 17.3, "x": "仕事を終えてようやく自分のための車を選べる。"}, {"t": 20.966666666666665, "x": "ところが息子さんからは「年を考えて」と止められていました。"}, {"t": 25.7, "x": "今日のお話はそのお客さまとのやり取りがもとになっています。"}, {"t": 30.3, "x": "先にお伝えしておくと、ジムニーを悪く言う回ではありません。"}, {"t": 34.93333333333333, "x": "よくできた車ですし、わたしも好きな一台です。"}, {"t": 38.7, "x": "ただ七十代で選ぶなら、知っておいてほしい所があります。"}, {"t": 43.4, "x": "良いところとつらくなりやすい所を順に見ていきます。"}, {"t": 47.36666666666667, "x": "安全装備がどこまで付いたかも、公式の情報で確かめました。"}, {"t": 52.3, "x": "最後に、それでも乗っていいかたの条件をお出しします。"}, {"t": 56.46666666666667, "x": "家族に反対されたときの話し合いかたにも触れます。"}, {"t": 60.233333333333334, "x": "どうぞ最後までお付き合いください。"}, {"t": 64.4, "x": "ジムニーはスズキが作る四輪駆動の軽自動車です。"}, {"t": 68.73333333333333, "x": "いま新車で選べるのは、XG、XL、XCの三つの種類です。"}, {"t": 75.13333333333334, "x": "値段は税込みでおよそ百九十二万円から二百十六万円です。"}, {"t": 80.2, "x": "手で変えるマニュアルと、オートマの両方があります。"}, {"t": 84.06666666666666, "x": "しかもどちらを選んでも値段は同じです。"}, {"t": 87.4, "x": "この車のいちばんの持ち味は、骨組みの作りにあります。"}, {"t": 91.7, "x": "はしごのような形の頑丈な枠に、車体を載せています。"}, {"t": 96.2, "x": "多くの乗用車とはちがう、昔ながらの作りかたです。"}, {"t": 100.53333333333333, "x": "前と後ろの車輪は、それぞれ一本の軸でつながっています。"}, {"t": 105.26666666666667, "x": "でこぼこ道で車輪がしっかり地面をつかむための工夫です。"}, {"t": 109.66666666666667, "x": "四輪駆動はレバーで切りかえる形です。"}, {"t": 113.23333333333333, "x": "低い段に入れると、ふだんの約二倍の力で進めます。"}, {"t": 117.8, "x": "車の底から地面までは二百五ミリ、およそ二十センチあります。"}, {"t": 122.8, "x": "それでいて小回りもききます。"}, {"t": 125.2, "x": "ハンドルをいっぱいに切って回る円の半径は四・八メートルです。"}, {"t": 130.63333333333333, "x": "丸いライトと縦に五つ並んだ穴のある顔つきも人気の理由です。"}, {"t": 135.73333333333332, "x": "メーカー自身もこの顔をジムニーらしさの印と呼んでいます。"}, {"t": 140.16666666666666, "x": "山へも川へもどこへでも行けそうな気持ちにさせてくれる。"}, {"t": 144.56666666666666, "x": "憧れる気持ちはわたしにもよく分かります。"}, {"t": 147.86666666666667, "x": "ただ憧れだけで選ぶと、あとで困ることも出てきます。"}, {"t": 153.93333333333334, "x": "ここからは七十代のかたに気をつけてほしい所です。"}, {"t": 158.2, "x": "大きく分けると三つあります。"}, {"t": 160.46666666666667, "x": "一つめは乗り降りの高さです。"}, {"t": 162.86666666666667, "x": "さきほどの二十センチの高さは、悪い道では強みになります。"}, {"t": 167.66666666666666, "x": "でも乗り降りのときは、そのぶん足を高く上げることになります。"}, {"t": 172.56666666666666, "x": "腰をひねりながら、よじ登るような姿勢になりやすいんですね。"}, {"t": 177.16666666666666, "x": "膝や腰に痛みがあると、毎日のことなので響きます。"}, {"t": 181.83333333333334, "x": "助手席の側には乗り降りを助ける手すりが付いています。"}, {"t": 186.03333333333333, "x": "ドアの取っ手も大きく、握りやすい形です。"}, {"t": 189.96666666666667, "x": "それでも運転席に座る動きは、お店で試しておきたい所です。"}, {"t": 195.06666666666666, "x": "体を引き上げるときにどこをつかめば楽かも、見ておきましょう。"}, {"t": 199.6, "x": "二つめは乗り心地です。"}, {"t": 202.1, "x": "頑丈な枠と一本の軸は、でこぼこ道のための作りです。"}, {"t": 207.2, "x": "メーカーもオフロードでの乗り心地のよさを売りにしています。"}, {"t": 211.16666666666666, "x": "ふだんの舗装した道では、揺れの感じかたが乗用車とちがいます。"}, {"t": 216.33333333333334, "x": "そこを味わいと感じるか、疲れと感じるかは人それぞれです。"}, {"t": 221.6, "x": "腰の悪いかたは試乗で長めに走ってみてください。"}, {"t": 225.2, "x": "ふだん通る段差の多い道を選ぶと分かりやすいです。"}, {"t": 229.13333333333333, "x": "三つめは後ろの席と荷物の置き場です。"}, {"t": 232.53333333333333, "x": "ジムニーの横のドアは、前の二枚だけです。"}, {"t": 236.4, "x": "後ろの席には前のドアを大きく開けて乗りこみます。"}, {"t": 240.83333333333334, "x": "お孫さんを乗せたり、友だちと出かけたりするには少し手間です。"}, {"t": 245.53333333333333, "x": "荷物をたくさん積むときは、後ろの席を倒して使う作りです。"}, {"t": 250.7, "x": "倒すと床が平らになり、ゴルフバッグが横に二つ入ります。"}, {"t": 255.3, "x": "ふだん三人以上で乗るなら、ここは大事な分かれ目です。"}, {"t": 261.4, "x": "「古い形の車だから、安全装備も少ないのでは」。"}, {"t": 265.8, "x": "そう心配されるかたもいますが、今の新車はちがいます。"}, {"t": 270.26666666666665, "x": "ぶつかりそうなときに、自動で止まろうとするブレーキが付いています。"}, {"t": 275.0, "x": "名前はデュアルセンサーブレーキサポートIIです。"}, {"t": 278.6, "x": "交差点で右や左に曲がるときの、歩行者や自転車にも働きます。"}, {"t": 284.0, "x": "出合い頭にぶつかりそうなときも、警報とブレーキで助けます。"}, {"t": 288.6333333333333, "x": "信号待ちで前の車が動き出したら、音で知らせる機能もあります。"}, {"t": 293.93333333333334, "x": "道路の標識を読み取って、メーターに出す機能もあります。"}, {"t": 298.2, "x": "エアバッグは運転席と助手席の前に加えて、座席の横と窓の側にも付きます。"}, {"t": 304.6666666666667, "x": "ここまではマニュアルでもオートマでも変わりません。"}, {"t": 307.73333333333335, "x": "ただしオートマの車にだけ付く装備があります。"}, {"t": 311.23333333333335, "x": "アクセルとブレーキの踏み間違いに備える装置です。"}, {"t": 315.03333333333336, "x": "止まっているときやゆっくり進むときに、前や後ろに物があるとします。"}, {"t": 320.9, "x": "そこでアクセルを強く踏んでも、エンジンの力をおさえてくれます。"}, {"t": 325.5, "x": "時速十キロ以下でぶつかりそうになると、自動でブレーキもかけます。"}, {"t": 330.6, "x": "公式のページでは、この三つはオートマの車の装備とされています。"}, {"t": 335.56666666666666, "x": "七十代で選ぶなら、ここがいちばん大きな分かれ目です。"}, {"t": 340.23333333333335, "x": "それから中古のジムニーを考えているかたは注意してください。"}, {"t": 344.6666666666667, "x": "年式によって付いている装備はちがいます。"}, {"t": 347.96666666666664, "x": "今の公式ページに並ぶ装備が、古い年式にも付いているとは限りません。"}, {"t": 353.53333333333336, "x": "中古を見るときは、その車の装備を一つずつ確かめましょう。"}, {"t": 359.1, "x": "売り場の札に書いていなければ、遠慮なくお店の人に聞いてください。"}, {"t": 365.4, "x": "高速道路を走るつもりのかたもいるでしょう。"}, {"t": 368.6666666666667, "x": "高速で頼りになるのが、前の車について走る機能です。"}, {"t": 373.4, "x": "アクセルを踏み続けなくても、前の車との間をあけて走ってくれます。"}, {"t": 378.46666666666664, "x": "オートマの車は前の車が止まれば一緒に止まるところまで助けます。"}, {"t": 383.76666666666665, "x": "マニュアルの車は、時速三十キロ以上で使える形です。"}, {"t": 388.4, "x": "車線からはみ出しそうになると、ハンドルに力を加えて戻そうとします。"}, {"t": 393.7, "x": "時速五十キロ以上で長く走ると、ふらつきも見張ってくれます。"}, {"t": 398.3666666666667, "x": "夜はハイビームとロービームを、自動で切りかえる機能もあります。"}, {"t": 403.3, "x": "助けてくれる仕組みは、思ったよりそろっているんですね。"}, {"t": 407.3333333333333, "x": "前の車について走る機能は、オートマのほうが使える場面が広いわけです。"}, {"t": 413.1333333333333, "x": "一方で気をつけたいのが横風です。"}, {"t": 416.26666666666665, "x": "ジムニーは背が高く、車の幅は軽自動車の枠におさまっています。"}, {"t": 421.43333333333334, "x": "背が高くて幅の狭い車は、横からの風を受けやすい形です。"}, {"t": 426.7, "x": "橋の上やトンネルの出口では、ハンドルをしっかり握っておきましょう。"}, {"t": 431.7, "x": "風の強い日の高速は、乗らない日と決めておくのも一つの手です。"}, {"t": 437.06666666666666, "x": "長い距離を走ると、乗り心地の疲れもたまりやすくなります。"}, {"t": 441.76666666666665, "x": "休みを早めにとるくらいの気持ちで出かけてください。"}, {"t": 445.96666666666664, "x": "ジムニーは急いで遠くへ行くための車ではありません。"}, {"t": 449.8, "x": "ゆっくり走って景色を楽しむ車だと思っておくと、ちょうどいいです。"}, {"t": 456.46666666666664, "x": "ここまで聞いてがっかりされたかもしれません。"}, {"t": 459.4, "x": "でも店長はジムニーをやめてくださいと言いたいのではありません。"}, {"t": 463.56666666666666, "x": "次の条件に当てはまるなら、わたしは喜んでおすすめします。"}, {"t": 468.06666666666666, "x": "一つめは乗り降りを試してみて苦にならないことです。"}, {"t": 472.1333333333333, "x": "お店で三回続けて乗り降りし、膝や腰が痛まないかを見ます。"}, {"t": 477.23333333333335, "x": "二つめはふだん乗るのが一人か二人であることです。"}, {"t": 480.96666666666664, "x": "後ろの席を毎日のように使うなら、ほかの車のほうが楽です。"}, {"t": 485.9, "x": "三つめは雪道や山道、細い農道を走る用事があることです。"}, {"t": 491.56666666666666, "x": "そういう暮らしなら、ジムニーの強みが毎日生きてきます。"}, {"t": 495.9, "x": "四つめはオートマを選ぶことです。"}, {"t": 498.6666666666667, "x": "踏み間違いに備える装置が付くのは、オートマの車でしたね。"}, {"t": 503.23333333333335, "x": "五つめは風の強い日や長い高速を避ける余裕があることです。"}, {"t": 508.03333333333336, "x": "近くの道を楽しむ車と割り切れるなら、いい相棒になります。"}, {"t": 512.9666666666667, "x": "とくに一つめと四つめは、外さないでほしい条件です。"}, {"t": 517.3666666666667, "x": "反対にどれにも当てはまらないなら、今は見送るのが正直な答えです。"}, {"t": 524.2666666666667, "x": "選ぶときの順番もお話しします。"}, {"t": 527.0333333333333, "x": "まずミッションはオートマにしましょう。"}, {"t": 529.5666666666667, "x": "値段は同じですから、ここで迷う理由はあまりありません。"}, {"t": 533.8333333333334, "x": "次に種類です。"}, {"t": 535.5666666666667, "x": "前の座席の生地は、XCとXLが水をはじく布、XGはふつうの布です。"}, {"t": 542.6666666666666, "x": "XCとXLは背もたれの角度を左右別々に十二段階で変えられます。"}, {"t": 549.2666666666667, "x": "腰の位置を細かく合わせたいなら、XLかXCがいいでしょう。"}, {"t": 554.3333333333334, "x": "前の座席は十ミリきざみで前後に二百四十ミリ動かせます。"}, {"t": 559.3666666666667, "x": "まずペダルとの距離を合わせ、それから背もたれを決めてください。"}, {"t": 564.0333333333333, "x": "XCとXLには後ろを映すカメラ付きの画面を追加できます。"}, {"t": 568.9666666666667, "x": "税込みで十二万八千七百円の追加です。"}, {"t": 573.0, "x": "駐車が苦手なかたには、付けておきたい装備です。"}, {"t": 576.8666666666667, "x": "シートベルトの締め忘れの知らせは、XGだと運転席だけです。"}, {"t": 582.1333333333333, "x": "ほかの二つは全部の席で知らせてくれます。"}, {"t": 585.5, "x": "それからもう一台のジムニーの話もしておきます。"}, {"t": 589.2333333333333, "x": "二〇二五年四月に、五つのドアのジムニーノマドが出ました。"}, {"t": 594.0333333333333, "x": "後ろの席にもドアがあるので、乗り降りが楽になります。"}, {"t": 598.1666666666666, "x": "ただしエンジンは一・五リットルで、軽自動車ではありません。"}, {"t": 602.9666666666667, "x": "今の値段は税込みで二百九十二万六千円からです。"}, {"t": 607.3, "x": "オートマの車には、前の車について走る機能も付きます。"}, {"t": 612.0333333333333, "x": "後ろの席をよく使うなら、こちらと見比べるのもいいでしょう。"}, {"t": 616.7333333333333, "x": "納期は色や装備で変わるので、販売店で確かめてください。"}, {"t": 623.0666666666667, "x": "最後に家族に反対されたときのお話です。"}, {"t": 626.8, "x": "冒頭のお客さまも、息子さんと何度も言い合いになったそうです。"}, {"t": 631.3666666666667, "x": "こういうとき言葉だけで説得しようとしてもうまくいきません。"}, {"t": 635.5, "x": "おすすめは一緒にお店へ来てもらうことです。"}, {"t": 638.6666666666666, "x": "息子さんの目の前で、乗り降りを何回かやってみせます。"}, {"t": 642.9666666666667, "x": "試乗では家族に助手席へ乗ってもらうといいでしょう。"}, {"t": 646.7, "x": "運転のようすを見てもらえば、心配の中身がはっきりします。"}, {"t": 651.2666666666667, "x": "家族が心配しているのは、車そのものより体のことが多いものです。"}, {"t": 656.7, "x": "それから約束ごとを決めておくのも手です。"}, {"t": 660.0666666666667, "x": "たとえば風の強い日の高速には乗らない。"}, {"t": 663.3666666666667, "x": "夜の遠出はしない。"}, {"t": 665.4, "x": "年に一度は家族に助手席から運転を見てもらう。"}, {"t": 669.4666666666667, "x": "こうした決まりがあると、家族も安心しやすくなります。"}, {"t": 673.6, "x": "決まりを守れているうちは乗り続けてよい。"}, {"t": 676.7666666666667, "x": "そう話し合っておけば、あとで揉めにくくなります。"}, {"t": 680.3666666666667, "x": "免許にサポカー限定の条件が付いているかたもいるでしょう。"}, {"t": 685.5, "x": "その場合は乗れる車かどうかをメーカーの対象車の一覧で確かめます。"}, {"t": 691.0333333333333, "x": "後から付けた装置は、限定の条件には数えられません。"}, {"t": 695.5333333333333, "x": "冒頭のお客さまは、何度か試乗をしてオートマのXLを選ばれました。"}, {"t": 700.7333333333333, "x": "息子さんとの約束は、紙に書いて車の中に貼っているそうです。"}, {"t": 707.5, "x": "では今日のお話をまとめます。"}, {"t": 710.1333333333333, "x": "ジムニーは悪い道に強く作られた本格的な四輪駆動の軽です。"}, {"t": 715.5333333333333, "x": "七十代でつらくなりやすいのは、乗り降り、乗り心地、後ろの席です。"}, {"t": 721.6, "x": "安全装備は今の新車ならかなりそろっています。"}, {"t": 725.2333333333333, "x": "ただし踏み間違いへの備えは、オートマの車だけです。"}, {"t": 729.6666666666666, "x": "選ぶならオートマ、腰に合わせたいならXLかXCです。"}, {"t": 734.9666666666667, "x": "後ろの席をよく使うなら、五つのドアのノマドも見比べてください。"}, {"t": 740.2666666666667, "x": "家族には言葉より先に乗るところを見てもらいましょう。"}, {"t": 744.0666666666667, "x": "憧れの車に乗ることは、わがままではありません。"}, {"t": 747.9333333333333, "x": "長く楽しむために、条件をそろえてから乗ってほしいのです。"}, {"t": 752.6, "x": "「一度だけお止めする」と言ったのは、そのためでした。"}, {"t": 758.8333333333334, "x": "ジムニーの思い出やご意見があれば、コメントで聞かせてください。"}, {"t": 763.7666666666667, "x": "次の動画で、またお目にかかりましょう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
