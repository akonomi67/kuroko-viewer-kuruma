<script>
const D={"name": "ジムニーとハスラーどっち", "file": "118_ジムニーとハスラーどっち", "dur": 823.7333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 2.933333333333333, "x": "70代のかたの毎日の足なら、店長はハスラーを勧めます。"}, {"t": 8.133333333333333, "x": "今日はその理由をジムニーとくらべながら数字でお話しします。"}, {"t": 12.6, "x": "2台ともスズキが作っている軽自動車です。"}, {"t": 15.966666666666667, "x": "ジムニーは山道や雪道を走るために作られた、4つのタイヤを回す車です。"}, {"t": 21.766666666666666, "x": "ハスラーは町乗りの軽に、遊びに出かける道具の雰囲気を足した車です。"}, {"t": 27.333333333333332, "x": "ハスラーにも4つのタイヤを回す形があります。"}, {"t": 30.8, "x": "今日はそちらとくらべます。"}, {"t": 32.86666666666667, "x": "ジムニーはまん中の形のXLで、204万6000円です。"}, {"t": 38.0, "x": "ハスラーはハイブリッドGの四輪駆動で、173万3600円です。"}, {"t": 44.0, "x": "値段はメーカー希望小売価格で、車体の色を選ぶと上がる場合もあります。"}, {"t": 49.53333333333333, "x": "差は31万2400円です。"}, {"t": 53.03333333333333, "x": "ジムニーにはこのほかに、いちばん安いXGという形が191万8400円であります。"}, {"t": 60.56666666666667, "x": "XGとくらべても、ハスラーのほうが18万4800円安い計算です。"}, {"t": 66.36666666666666, "x": "この差で何が増えて何が減るのかを、順に見ていきましょう。"}, {"t": 72.7, "x": "はじめに、2台を外から見た大きさをくらべます。"}, {"t": 76.4, "x": "車の長さを測ると、どちらも3395ミリで並びます。"}, {"t": 81.96666666666667, "x": "横に並べた時の幅も、2台そろって1475ミリです。"}, {"t": 87.16666666666667, "x": "どちらも軽自動車の枠いっぱいの大きさです。"}, {"t": 90.8, "x": "違うのは屋根の高さで、ジムニーが1725ミリでハスラーが1680ミリです。"}, {"t": 98.23333333333333, "x": "ジムニーのほうが4.5センチ高い車です。"}, {"t": 102.03333333333333, "x": "前と後ろのタイヤの間の長さは、ジムニーが2250ミリでハスラーが2460ミリです。"}, {"t": 110.5, "x": "ここはハスラーのほうが21センチ長くなっています。"}, {"t": 114.33333333333333, "x": "同じ長さの車でタイヤの間が長いと、そのぶん人の座る場所が広く取れます。"}, {"t": 120.8, "x": "ジムニーは、バンパーや車の底が段差に当たりにくいように作り込まれています。"}, {"t": 126.46666666666667, "x": "山道や岩のある道を走ることを考えた形だと、スズキは説明しています。"}, {"t": 132.56666666666666, "x": "車庫に入るかどうかで言えば、2台ともほぼ同じと考えてよいでしょう。"}, {"t": 137.56666666666666, "x": "立体駐車場の高さの決まりがある所では、4.5センチの差も見ておいてください。"}, {"t": 145.16666666666666, "x": "ここがいちばん大きな違いです。"}, {"t": 147.83333333333334, "x": "ジムニーはドアが前の2枚だけの、3ドアの車です。"}, {"t": 152.4, "x": "ハスラーは前と後ろに2枚ずつドアがある、5ドアの車です。"}, {"t": 157.9, "x": "3ドアと言うのは、後ろの荷物を出し入れする扉も1枚に数えるからです。"}, {"t": 163.9, "x": "ジムニーで後ろの席に座る時は、助手席を前に倒してから乗り込みます。"}, {"t": 169.43333333333334, "x": "スズキはこれを助手席ウォークインと呼んでいます。"}, {"t": 172.93333333333334, "x": "中の長さはジムニーが1795ミリで、ハスラーが2215ミリです。"}, {"t": 179.73333333333332, "x": "ハスラーのほうが42センチ長く、後ろの席の足元にゆとりがあります。"}, {"t": 185.6, "x": "中の高さはジムニーが1200ミリで、ハスラーが1270ミリです。"}, {"t": 191.8, "x": "横の幅も、ハスラーのほうが3センチ広い作りです。"}, {"t": 196.2, "x": "座席の数は、2台とも4人ぶんです。"}, {"t": 199.6, "x": "ハスラーの後ろの席は、左右別々に前後に動かせて背もたれも倒せます。"}, {"t": 205.46666666666667, "x": "ジムニーの後ろの席は、XLなら左右別々に背もたれを倒せます。"}, {"t": 211.0, "x": "お孫さんを後ろに乗せることが多いかたは、このドアの数を大事にしてください。"}, {"t": 218.46666666666667, "x": "車に乗る時と降りる時のことも、くらべておきましょう。"}, {"t": 222.73333333333332, "x": "地面から車の底までは、ジムニーが205ミリです。"}, {"t": 227.06666666666666, "x": "ハスラーは四輪駆動で160ミリ、前のタイヤだけを回す形で180ミリです。"}, {"t": 234.23333333333332, "x": "四輪駆動どうしでくらべると、ジムニーが4.5センチ高くなっています。"}, {"t": 239.96666666666667, "x": "底が高いぶん、ジムニーはでこぼこ道や深い雪で底を打ちにくい車です。"}, {"t": 246.16666666666666, "x": "一方で乗り込む時の足の上げ方はお店で確かめておきたい所です。"}, {"t": 251.7, "x": "ジムニーには助手席に乗る人がつかまる取っ手が付いています。"}, {"t": 256.0, "x": "スズキはこれを助手席乗降グリップと呼んでいます。"}, {"t": 259.9, "x": "ハスラーは助手席と後ろの席の両側に、たためる取っ手が付いています。"}, {"t": 265.06666666666666, "x": "運転席の高さを上げ下げする仕組みは、ハスラーには全部の形に付いています。"}, {"t": 270.8, "x": "ジムニーの装備表には、この仕組みは載っていません。"}, {"t": 274.6666666666667, "x": "ハンドルの角度を変える仕組みは、ハスラーとジムニーのXLの両方にあります。"}, {"t": 280.26666666666665, "x": "ひざや腰に不安のあるかたは、2台の運転席に一度ずつ座ってみてください。"}, {"t": 288.0, "x": "続いては、ハンドルを握った時の扱いやすさです。"}, {"t": 292.03333333333336, "x": "小回りの数字は、ジムニーが4.8メートルでハスラーが4.6メートルです。"}, {"t": 298.3666666666667, "x": "ハンドルを切りきってぐるりと回った時の、外の側のタイヤの通り道の半径を指します。"}, {"t": 304.93333333333334, "x": "ハスラーのほうが20センチ小さく回れます。"}, {"t": 308.46666666666664, "x": "ぐるりと回る輪の差し渡しにすると、40センチ違います。"}, {"t": 313.5, "x": "狭い道で向きを変える時や、スーパーの駐車場で差が出ます。"}, {"t": 318.3333333333333, "x": "次は重さです。"}, {"t": 320.0, "x": "ジムニーの4速オートマは1070キロで、ハスラーのこの形は880キロです。"}, {"t": 326.6666666666667, "x": "190キロの差は、大人3人ぶんに近い重さです。"}, {"t": 331.4, "x": "ジムニーは、はしごの形のじょうぶな骨組みの上に車の体を載せた作りです。"}, {"t": 337.6, "x": "じょうぶさと引きかえに重くなるのは、この作りのためです。"}, {"t": 341.96666666666664, "x": "重い車はブレーキをかけてから止まるまでに、それだけ力が要ります。"}, {"t": 348.56666666666666, "x": "今度はエンジンの力をくらべます。"}, {"t": 351.4, "x": "ジムニーのエンジンにはターボが付いていて、力の数字は64馬力です。"}, {"t": 357.2, "x": "ハスラーのハイブリッドGは、ターボの無いエンジンで49馬力です。"}, {"t": 362.4, "x": "重さで割ると、1馬力で運ぶ重さはジムニーが約16.7キロです。"}, {"t": 368.73333333333335, "x": "ハスラーのハイブリッドGは約18キロです。"}, {"t": 372.9, "x": "1馬力が受け持つ重さが軽いほど、車は楽に進みます。"}, {"t": 377.8666666666667, "x": "重さの差を考えると、2台の走りの差は数字ほど大きくはありません。"}, {"t": 383.3333333333333, "x": "ハスラーにはターボ付きの形もあり、こちらは64馬力でジムニーと同じです。"}, {"t": 389.4, "x": "ターボ付きのハイブリッドXの四輪駆動は197万1200円です。"}, {"t": 395.26666666666665, "x": "重さは890キロで、1馬力で運ぶ重さは約13.9キロになります。"}, {"t": 402.1, "x": "ジムニーのXLとの差は7万4800円まで縮まります。"}, {"t": 407.5, "x": "高速道路をよく使うかたは、ハスラーのターボ付きを考えてもよいでしょう。"}, {"t": 414.1666666666667, "x": "ここで、毎日かかるガソリン代に関わる数字を見ます。"}, {"t": 418.5, "x": "国の決まった測りかたで、ジムニーの4速オートマは1リットルで14.3キロ走ります。"}, {"t": 425.9, "x": "ハスラーのハイブリッドGの四輪駆動は22.4キロです。"}, {"t": 430.4, "x": "差は8.1キロで、ここはハスラーが大きく勝っています。"}, {"t": 435.06666666666666, "x": "信号の多い町の中の数字は、ジムニーが12.2キロでハスラーが21.2キロです。"}, {"t": 442.6, "x": "仮に1年で3000キロを町の中だけで走るとして、要るガソリンを比べてみます。"}, {"t": 448.8666666666667, "x": "ジムニーは約245.9リットルで、ハスラーは約141.5リットルです。"}, {"t": 455.3, "x": "差は1年で約104リットルになります。"}, {"t": 458.6333333333333, "x": "燃料タンクはジムニーが40リットルで、ハスラーが27リットルです。"}, {"t": 464.53333333333336, "x": "ジムニーのほうが13リットル多く入ります。"}, {"t": 467.9, "x": "それでも満タンで走れる距離は、試験の数字でハスラーのほうが長くなります。"}, {"t": 473.6, "x": "ジムニーは約572キロで、ハスラーは約605キロです。"}, {"t": 479.0, "x": "毎年の軽自動車の税金は、2台とも自家用なら標準で年に1万800円です。"}, {"t": 486.03333333333336, "x": "ジムニーには5速の手で変える形もあり、こちらは1リットルで16.6キロ走ります。"}, {"t": 492.96666666666664, "x": "値段は4速オートマと同じですが、燃費ではハスラーに届きません。"}, {"t": 498.1666666666667, "x": "なお燃費は決まった試験で測った数字なので、寒い時期の暖房などで下がります。"}, {"t": 505.9, "x": "次は四輪駆動の仕組みです。"}, {"t": 508.6666666666667, "x": "ジムニーはふだんは2つのタイヤで走り、レバーで四輪駆動に切り替えます。"}, {"t": 514.2666666666667, "x": "切り替えは2H、4H、4Lの3つです。"}, {"t": 519.3, "x": "4Lはぬかるみや急な坂で使う形で、ふだんのおよそ2倍の力でタイヤを回します。"}, {"t": 526.5, "x": "2Hと4Hの切り替えは、まっすぐ走っている時に時速100キロより下で行います。"}, {"t": 533.5, "x": "4Lに入れる時は、車を止めてから切り替えます。"}, {"t": 537.7333333333333, "x": "ハスラーは、いつも4つのタイヤを回す形の四輪駆動です。"}, {"t": 542.5, "x": "雪が降っても、自分でレバーを動かす必要はありません。"}, {"t": 546.8, "x": "ハスラーの四輪駆動には、雪道向けのスノーモードというスイッチもあります。"}, {"t": 552.3333333333334, "x": "下り坂でゆっくりの速さを保つ仕組みは、2台ともに付いています。"}, {"t": 557.5666666666667, "x": "ジムニーの切り替えは慣れてしまえば難しいものではありません。"}, {"t": 562.0333333333333, "x": "ただ雪が降った朝にだけ思い出すような使いかただと、迷うこともあるでしょう。"}, {"t": 567.7666666666667, "x": "雪道でハスラーがどう走るかは、ハスラーの回でたっぷりお話ししました。"}, {"t": 573.3333333333334, "x": "雪の少ない所なら、ハスラーは前のタイヤだけを回す形も選べます。"}, {"t": 578.9333333333333, "x": "ハイブリッドGなら159万9400円で、四輪駆動より13万4200円安くなります。"}, {"t": 586.9333333333333, "x": "ジムニーのほうはどの形も四輪駆動だけの車です。"}, {"t": 592.7333333333333, "x": "さて、ぶつからないための装備に話を移します。"}, {"t": 596.5, "x": "前の車や人にぶつかりそうになると車が自分でブレーキを踏む仕組みは、2台に共通です。"}, {"t": 603.8666666666667, "x": "スズキの呼び名では、デュアルセンサーブレーキサポート2です。"}, {"t": 608.3333333333334, "x": "ぶつかった時にふくらんで体を守る袋も、どちらにも6つずつあります。"}, {"t": 613.8, "x": "場所はハンドルと助手席の前、前の座席の横、そして左右の窓の上です。"}, {"t": 620.3666666666667, "x": "違いが出るのは、踏み間違いで車が急に飛び出すのをおさえる仕組みです。"}, {"t": 625.6666666666666, "x": "ジムニーでは、この仕組みが付くのは4速オートマの車だけです。"}, {"t": 630.6, "x": "5速の手で変える形には付いていません。"}, {"t": 633.8333333333334, "x": "ハスラーは全部の形に、前に進む時と後ろに下がる時の両方で付いています。"}, {"t": 640.2666666666667, "x": "斜め後ろから来る車を知らせる仕組みも、ハスラーにはあります。"}, {"t": 645.2, "x": "スズキはこれをブラインドスポットモニターと呼んでいます。"}, {"t": 648.9, "x": "車庫からバックで出る時に、横から来る車を知らせる仕組みもハスラーにあります。"}, {"t": 654.4666666666667, "x": "この2つは、ジムニーの装備表には載っていません。"}, {"t": 658.4, "x": "車の前と後ろの物に近づくと知らせるセンサーは、2台ともに付いています。"}, {"t": 664.1666666666666, "x": "駐車の時に壁や柱にぶつけたくないかたには、どちらも心強い装備です。"}, {"t": 671.3666666666667, "x": "続けて、高速道路で助かる装備を見ます。"}, {"t": 675.2666666666667, "x": "前の車についていく仕組みは、2台とも付いています。"}, {"t": 679.6, "x": "ジムニーの4速オートマは、止まるところまで前の車についていきます。"}, {"t": 685.0333333333333, "x": "ハスラーは止まったあとも、そのまま止めておく働きまで付いています。"}, {"t": 690.1333333333333, "x": "車線の中を保つようにハンドルを手助けする仕組みも、ハスラーにはあります。"}, {"t": 695.8666666666667, "x": "止めておく時のブレーキも違います。"}, {"t": 698.7333333333333, "x": "ジムニーは、手でレバーを引く形の止めておくブレーキです。"}, {"t": 703.1, "x": "ハスラーは、スイッチでかける電気のブレーキです。"}, {"t": 707.0333333333333, "x": "信号待ちで止まったままでいられる仕組みも、ハスラーには付いています。"}, {"t": 711.8333333333334, "x": "この働きの名前はブレーキホールドです。"}, {"t": 715.0666666666667, "x": "信号待ちのたびにブレーキを踏み続けなくてよいので、右足が楽になります。"}, {"t": 720.6, "x": "運転席と助手席の座面を温める仕組みは、ハスラーとジムニーのXLの両方にあります。"}, {"t": 729.2333333333333, "x": "では、70代のかたが毎日乗る車として、店長の答えをお伝えします。"}, {"t": 737.6, "x": "店長は、ハスラーのハイブリッドGの四輪駆動をお勧めします。"}, {"t": 742.5333333333333, "x": "いちばんの理由は、後ろにもドアがあってお孫さんや荷物を楽に乗せられることです。"}, {"t": 749.1, "x": "2つ目は、ジムニーのXLより31万2400円安くて燃費も8.1キロ良いことです。"}, {"t": 757.1666666666666, "x": "3つ目は、踏み間違いの飛び出しをおさえる仕組みが全部の形に付いていることです。"}, {"t": 763.6333333333333, "x": "4つ目に、止まると自動でブレーキを保つ仕組みがあり、信号待ちで右足が休めます。"}, {"t": 770.1333333333333, "x": "一方でジムニーが向いているかたもいます。"}, {"t": 773.1666666666666, "x": "舗装していない山の道や、深い雪の道に毎日のように入るかたです。"}, {"t": 779.0, "x": "そうしたかたにはジムニーのじょうぶな作りと4Lの力が心強いはずです。"}, {"t": 785.9, "x": "ジムニーを選ぶなら、踏み間違いの仕組みが付く4速オートマにしてください。"}, {"t": 791.2666666666667, "x": "雪の少ない所のかたは、ハスラーの前のタイヤだけを回す形でもかまいません。"}, {"t": 797.1666666666666, "x": "ジムニーにあこがれて迷っているかたは、ジムニーの回も見てみてください。"}, {"t": 802.5666666666667, "x": "ここまでの数字は、11月にスズキの諸元表と装備表と値段のページで確かめました。"}, {"t": 809.4333333333333, "x": "車は改良のたびに値段も装備も変わります。"}, {"t": 813.2, "x": "契約をする前に、お店でいちばん新しい表を見せてもらいましょう。"}, {"t": 818.0333333333333, "x": "今日のお話はここまでです。またお店の前でお待ちしています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
