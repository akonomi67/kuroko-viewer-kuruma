<script>
const D={"name": "シエンタとフリードどっち", "file": "094_シエンタとフリードどっち", "dur": 784.16665625, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "今日はいきなり答えから申し上げます。"}, {"t": 6.0, "x": "70代のご夫婦で三列目の席を使わないなら、シエンタです。"}, {"t": 11.4, "x": "ただしひとつだけ当てはまるかたは逆です。"}, {"t": 14.666666666666666, "x": "そのかたにはフリードを選んでいただきたいのです。"}, {"t": 18.1, "x": "そのひとつが何なのかは第9章で種明かしをします。"}, {"t": 22.6, "x": "シエンタとフリードは小さなミニバンの二大定番です。"}, {"t": 26.766666666666666, "x": "どちらも後ろの扉が横に開いて、街なかでも扱える大きさです。"}, {"t": 31.966666666666665, "x": "「孫が来たときに、みんなで乗れる車がほしい」。"}, {"t": 35.93333333333333, "x": "「でも、大きな車はもう運転したくない」。"}, {"t": 39.36666666666667, "x": "そう考えると、たいていこの2台に行き着きます。"}, {"t": 43.1, "x": "そしてここからがなかなか決まらないのです。"}, {"t": 46.266666666666666, "x": "前にシエンタを一台だけ名指しした回がありました。"}, {"t": 50.13333333333333, "x": "あの回では、フリードとの比べっこは少しだけにしました。"}, {"t": 54.36666666666667, "x": "今日はこの2台だけを正面から比べます。"}, {"t": 57.833333333333336, "x": "比べるところは5つ、席の数と広さと装備とハイブリッドと値段です。"}, {"t": 63.833333333333336, "x": "そのなかでカギになるのは、三列目の席をどうするかです。"}, {"t": 68.46666666666667, "x": "70代のご夫婦が三列目まで人を乗せる日は、年に何回あるでしょう。"}, {"t": 74.7, "x": "お店で聞くと、「ほとんどない」と答えるかたがいちばん多いです。"}, {"t": 79.16666666666667, "x": "つまり、使わない席を毎日のせて走ることになります。"}, {"t": 83.86666666666666, "x": "ここから考えると、2台の答えははっきり分かれてきます。"}, {"t": 90.36666666666666, "x": "まず2台がいつ生まれたかを確かめておきます。"}, {"t": 93.76666666666667, "x": "今のシエンタが出たのは2022年の8月です。"}, {"t": 98.23333333333333, "x": "今年の8月にも改良を受けています。"}, {"t": 101.43333333333334, "x": "今のフリードは2024年の6月に出た3代目です。"}, {"t": 105.9, "x": "新しさでいえば、フリードのほうが2年近く後輩になります。"}, {"t": 110.66666666666667, "x": "どちらも街でよく見かける2台です。"}, {"t": 113.86666666666666, "x": "同じところもたくさんあります。"}, {"t": 116.16666666666667, "x": "後ろの扉はどちらも左右とも横に開く扉です。"}, {"t": 120.4, "x": "エンジンはどちらも1.5リットルです。"}, {"t": 123.53333333333333, "x": "ハイブリッドとガソリンの両方から選べるのも同じです。"}, {"t": 127.43333333333334, "x": "大きさの数字は、シエンタを名指しした回で並べました。"}, {"t": 131.66666666666666, "x": "長さはほぼ同じで、小回りはシエンタが少し上でした。"}, {"t": 136.26666666666668, "x": "ですから今日はその数字は繰り返しません。"}, {"t": 139.46666666666667, "x": "今日見ていくのは、席の数の選びかたと中身の違いです。"}, {"t": 144.76666666666668, "x": "じつはそこに、2台のいちばん大きな分かれ目があります。"}, {"t": 150.6, "x": "シエンタの席の数は5人乗りと7人乗りの2つです。"}, {"t": 155.26666666666668, "x": "フリードは5人乗りと6人乗りと7人乗りの3つです。"}, {"t": 159.26666666666668, "x": "数だけ見ると、フリードのほうが選べる幅は広く見えます。"}, {"t": 163.66666666666666, "x": "ところがどの形で選べるのかを見ると話が変わります。"}, {"t": 168.03333333333333, "x": "シエンタなら、XでもGでもZでも5人乗りが選べます。"}, {"t": 172.93333333333334, "x": "いちばん安い形でも、いちばん上の形でも選べるのです。"}, {"t": 177.53333333333333, "x": "フリードには、エアーとクロスターという2つの顔があります。"}, {"t": 181.96666666666667, "x": "エアーはすっきりした街乗り向けの顔です。"}, {"t": 185.23333333333332, "x": "クロスターは外遊び向けのたくましい顔です。"}, {"t": 188.83333333333334, "x": "そしてフリードの5人乗りはクロスターにしかありません。"}, {"t": 192.76666666666668, "x": "エアーを選ぶと、6人乗りか7人乗りになります。"}, {"t": 196.9, "x": "つまり三列目の付いた車になるわけです。"}, {"t": 200.13333333333333, "x": "使わないなら畳んでおけばいい、と思われるかもしれません。"}, {"t": 204.66666666666666, "x": "フリードの三列目は、荷室の左右へはね上げて畳む仕組みです。"}, {"t": 209.6, "x": "シエンタの7人乗りは、二列目の下へもぐらせて畳みます。"}, {"t": 214.26666666666668, "x": "どちらもよくできていますが、席そのものは車に残ります。"}, {"t": 219.0, "x": "年に数回のための席を、毎日運んで走ることになります。"}, {"t": 224.2, "x": "はじめから付いていないほうが車の中は身軽です。"}, {"t": 228.33333333333334, "x": "ですから70代のご夫婦には、店長は5人乗りを勧めています。"}, {"t": 233.93333333333334, "x": "そうなるとシエンタはどの形からでも選べます。"}, {"t": 237.36666666666667, "x": "フリードのほうは、クロスター一本にしぼられてしまいます。"}, {"t": 242.93333333333334, "x": "ここで1つ、気をつけていただきたい数字があります。"}, {"t": 246.86666666666667, "x": "クロスターの幅は1720ミリです。"}, {"t": 250.23333333333332, "x": "エアーの幅は1695ミリで、シエンタと同じです。"}, {"t": 255.2, "x": "つまり5人乗りのフリードだけ、2.5センチ幅が広いのです。"}, {"t": 260.0, "x": "2.5センチなら大差ない、と思われるでしょう。"}, {"t": 263.93333333333334, "x": "ただこの差で車の区分が変わります。"}, {"t": 267.0, "x": "5ナンバーと呼ばれる小型車の枠は、幅1700ミリまでです。"}, {"t": 272.26666666666665, "x": "クロスターはその枠を超えるので、3ナンバーの車になります。"}, {"t": 277.03333333333336, "x": "運転のしやすさが、2.5センチで急に変わるわけではありません。"}, {"t": 282.0, "x": "気をつけたいのは車を置く場所のほうです。"}, {"t": 285.2, "x": "借りている駐車場の契約書に、車の幅の決まりがないか。"}, {"t": 289.76666666666665, "x": "これは買う前に一度見ておいてください。"}, {"t" const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
