<script>
const D={"name": "ライズとヤリスクロスどっち", "file": "114_ライズとヤリスクロスどっち", "dur": 772.4333125, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.1333333333333333, "x": "今日はトヨタの小さなSUVを2台並べます。"}, {"t": 7.133333333333334, "x": "ライズとヤリスクロスです。"}, {"t": 9.2, "x": "どちらも背が少し高くて、地面から車の底までにゆとりのある車です。"}, {"t": 15.0, "x": "この2台には、ちょっと不思議な数字の関係があります。"}, {"t": 19.166666666666668, "x": "外から測った長さは、ライズのほうが18.5センチ短いのです。"}, {"t": 24.633333333333333, "x": "ところが、中の長さはライズのほうが11センチ長くなっています。"}, {"t": 29.866666666666667, "x": "短い車のほうが中は広いというわけです。"}, {"t": 33.833333333333336, "x": "なぜそうなるのか。そしてそれが70代のかたにどう効くのか。"}, {"t": 38.7, "x": "今日は一人のお客さまの暮らしに当てはめて、順番に見ていきます。"}, {"t": 45.13333333333333, "x": "先日、70代の半ばの奥さまがお店に見えました。"}, {"t": 49.6, "x": "ご主人が免許を返されて、今は奥さまが一人で運転されています。"}, {"t": 55.2, "x": "今の車は、10年を超えた小さなセダンだそうです。"}, {"t": 59.666666666666664, "x": "使いみちは、週に2回の買い物と月に一度の病院です。"}, {"t": 64.7, "x": "年に2回ほど、となりの県の娘さんの家まで高速道路で行かれます。"}, {"t": 70.26666666666667, "x": "奥さまの心配は3つありました。"}, {"t": 72.96666666666667, "x": "1つ目は、スーパーの駐車場がせまくて止めるのが怖いこと。"}, {"t": 77.63333333333334, "x": "2つ目は、冬の朝の車が冷たくて腰がつらいこと。"}, {"t": 82.3, "x": "3つ目は、高速道路の長い時間の運転で疲れてしまうことです。"}, {"t": 87.7, "x": "お店の人に勧められたのは、ライズとヤリスクロスの2台だそうです。"}, {"t": 92.66666666666667, "x": "どちらも見た目は好きなので、決め手が欲しいとのことでした。"}, {"t": 98.66666666666667, "x": "まず今日くらべる形を決めておきます。"}, {"t": 101.86666666666666, "x": "ライズはハイブリッドのGという形で、前のタイヤを回す形です。"}, {"t": 106.83333333333333, "x": "値段は239万9100円です。"}, {"t": 110.7, "x": "ヤリスクロスはハイブリッドのXという形で、これも前のタイヤを回す形です。"}, {"t": 116.73333333333333, "x": "値段は251万200円です。"}, {"t": 120.16666666666667, "x": "どちらも、それぞれの車のハイブリッドでいちばん安い形です。"}, {"t": 125.1, "x": "差は11万1100円で、ライズのほうが安くなります。"}, {"t": 129.66666666666666, "x": "値段はどちらもトヨタの公式のメーカー希望小売価格です。"}, {"t": 134.73333333333332, "x": "ちなみにライズの諸元表には、作っている会社としてダイハツの名前があります。"}, {"t": 140.36666666666667, "x": "トヨタのお店で売っていますが、作っているのはダイハツの工場です。"}, {"t": 145.2, "x": "ライズにはガソリンだけで走るXという形もあり、こちらは189万7500円です。"}, {"t": 152.53333333333333, "x": "ただし燃費は1リットルあたり21.8キロなので、今日はハイブリッドどうしで比べます。"}, {"t": 159.33333333333334, "x": "使うガソリンはどちらもレギュラーです。"}, {"t": 163.76666666666668, "x": "ここからは外の大きさです。"}, {"t": 165.96666666666667, "x": "長さはライズが3995ミリで、ヤリスクロスが4180ミリです。"}, {"t": 172.06666666666666, "x": "ライズは4メートルを切っていて、ここが18.5センチの差になります。"}, {"t": 177.5, "x": "幅はライズが1695ミリで、ヤリスクロスが1765ミリです。"}, {"t": 183.9, "x": "差は7センチあります。"}, {"t": 186.06666666666666, "x": "国の決まりでは、幅が1700ミリまでの車が五ナンバーの小型車です。"}, {"t": 191.8, "x": "ライズはその内側に収まり、ヤリスクロスは三ナンバーになります。"}, {"t": 196.6, "x": "せまい駐車場で隣の車との間を考えると、この7センチは小さくありません。"}, {"t": 203.16666666666666, "x": "ドアを開けられる幅が、左右に3.5センチずつ増える計算です。"}, {"t": 208.66666666666666, "x": "屋根の高さはライズが1620ミリで、ヤリスクロスは1590ミリです。"}, {"t": 214.8, "x": "こちらはライズが3センチ高くなっています。"}, {"t": 218.13333333333333, "x": "車の重さはライズのGが1060キロで、ヤリスクロスのXが1160キロです。"}, {"t": 224.8, "x": "ライズのほうが100キロ軽いことになります。"}, {"t": 227.83333333333334, "x": "地面から車の底までの高さは、ライズが185ミリでヤリスクロスが170ミリです。"}, {"t": 235.3, "x": "雪の積もった道や段差の多い道では、この1.5センチのゆとりが役に立ちます。"}, {"t": 243.33333333333334, "x": "次は奥さまの1つ目の心配に関わる小回りです。"}, {"t": 247.56666666666666, "x": "小回りは最小回転半径という数字で比べます。"}, {"t": 251.63333333333333, "x": "ハンドルをいっぱいに切って回った時の、円の大きさのことです。"}, {"t": 256.26666666666665, "x": "ライズのGは4.9メートルで、ヤリスクロスはどの形も5.3メートルです。"}, {"t": 262.4, "x": "差は40センチあります。"}, {"t": 264.6, "x": "ただし、ライズでもいちばん上のZは5.0メートルになります。"}, {"t": 269.4, "x": "Zは17インチの大きなタイヤを履いた形です。"}, {"t": 273.4, "x": "ライズのGとXは16インチなので、4.9メートルで回れます。"}, {"t": 278.76666666666665, "x": "車の長さが短くて小さく回れるので、駐車場で向きを変えるのが楽になります。"}, {"t": 284.93333333333334, "x": "前から入れても後ろから入れても、切り返しの回数が減るはずです。"}, {"t": 291.4, "x": "続いて車の中の広さです。"}, {"t": 294.03333333333336, "x": "最初にお話ししたとおり、中の長さはライズが1955ミリです。"}, {"t": 299.6666666666667, "x": "ヤリスクロスは1845ミリで、ライズが11センチ長くなっています。"}, {"t": 305.3333333333333, "x": "天井までの高さは、ライズが1250ミリでヤリスクロスが1205ミリです。"}, {"t": 311.9, "x": "こちらもライズが4.5センチ高くなっています。"}, {"t": 315.4, "x": "中の幅だけは、ライズが1420ミリでヤリスクロスが1430ミリです。"}, {"t": 322.3, "x": "ここは1センチだけヤリスクロスが広いのですが、ほぼ同じです。"}, {"t": 326.8666666666667, "x": "ライズは外の長さを短くしながら、中の場所を大きく取ってあるのです。"}, {"t": 332.7, "x": "前と後ろのタイヤの間の長さは、ライズが2525ミリです。"}, {"t": 338.3, "x": "ヤリスクロスは2560ミリなので、ここは3.5センチの差しかありません。"}, {"t": 344.3333333333333, "x": "外の長さの差の多くは、前と後ろのはみ出した部分の差だと分かります。"}, {"t": 350.03333333333336, "x": "中の天井が高いと、乗り降りの時に頭を下げる量が少なくて済みます。"}, {"t": 355.76666666666665, "x": "腰に不安のあるかたは、お店で2台とも乗り降りを試してみてください。"}, {"t": 360.7, "x": "なお中の寸法はどちらもメーカーが自分で測った数字です。"}, {"t": 366.8666666666667, "x": "次は燃費です。"}, {"t": 368.7, "x": "国の決まった測りかたで、ヤリスクロスのXは1リットルあたり30.8キロ走ります。"}, {"t": 375.76666666666665, "x": "ライズのGは28.7キロなので、2.1キロの差でヤリスクロスが上です。"}, {"t": 382.2, "x": "1000キロ走るのに要るガソリンで比べてみます。"}, {"t": 386.06666666666666, "x": "ヤリスクロスは約32.5リットルで、ライズは約34.8リットルです。"}, {"t": 392.3, "x": "奥さまのように1年に5000キロ走るかたなら、差は約11.9リットルです。"}, {"t": 398.43333333333334, "x": "軽い車のライズが、燃費では負けている形です。"}, {"t": 402.96666666666664, "x": "ハイブリッドの中身も2台で違います。"}, {"t": 405.8666666666667, "x": "ライズはダイハツの1.2リットルのハイブリッドです。"}, {"t": 409.5, "x": "ヤリスクロスはトヨタの1.5リットルのハイブリッドです。"}, {"t": 413.56666666666666, "x": "タイヤを回すモーターの力は、ライズが106馬力でヤリスクロスは80馬力です。"}, {"t": 419.76666666666665, "x": "ヤリスクロスはそこにエンジンの91馬力が加わって走る仕組みです。"}, {"t": 424.96666666666664, "x": "力の数字の比べかたが2台で違うので、走りの差は試しに乗って確かめるのがいちばんです。"}, {"t": 431.8666666666667, "x": "どちらの数字も試験の条件で測ったもので、冬の暖房などで悪くなります。"}, {"t": 437.6333333333333, "x": "1年で約12リットルなので、11万円の差を燃費だけで取り戻すのは長い話になります。"}, {"t": 446.7, "x": "ここが今日いちばん大事な話です。"}, {"t": 449.73333333333335, "x": "2台の装備はどちらが上というより、中身が入れ替わっています。"}, {"t": 454.3333333333333, "x": "まずぶつかりそうな時に止まるブレーキは、2台とも付いています。"}, {"t": 459.23333333333335, "x": "前や後ろの壁にぶつかりそうな時に、ブレーキで止める仕組みも2台ともあります。"}, {"t": 465.3, "x": "ライズには、車の角が物に近づくと音で知らせるセンサーも付いています。"}, {"t": 470.96666666666664, "x": "前に2個、後ろに4個あって、どの形にも最初から付いています。"}, {"t": 476.46666666666664, "x": "車線からはみ出しそうな時に知らせる仕組みも、2台とも付いています。"}, {"t": 481.6, "x": "差の1つ目は前の車について走る仕組みです。"}, {"t": 485.1333333333333, "x": "アクセルを踏まなくても、前の車との間を保って走ってくれる仕組みです。"}, {"t": 490.76666666666665, "x": "ヤリスクロスのXにはこれが最初から付いています。"}, {"t": 494.96666666666664, "x": "ライズのGには付いていません。"}, {"t": 497.5, "x": "ライズでこれが欲しい時は、いちばん上のZを選ぶことになります。"}, {"t": 502.6666666666667, "x": "差の2つ目は運転席と助手席のシートヒーターです。"}, {"t": 507.1666666666667, "x": "ライズのGにはこれが最初から付いています。"}, {"t": 510.7, "x": "ヤリスクロスのXは、装備一覧表のこの欄が空いていました。"}, {"t": 515.5, "x": "差の3つ目は斜め後ろの車を知らせるミラーの仕組みです。"}, {"t": 520.8, "x": "ライズのGは6万6000円を足せば付けられます。"}, {"t": 524.8333333333334, "x": "ヤリスクロスのXには、この仕組みを付ける設定がありません。"}, {"t": 529.1666666666666, "x": "ライズのGにこれを足しても246万5100円で、まだ4万5100円安く収まります。"}, {"t": 537.0333333333333, "x": "もう1つ、2台とも同じところがあります。"}, {"t": 540.4, "x": "指で押すだけの電動のパーキングブレーキと、止まった時にブレーキを保つ仕組みです。"}, {"t": 546.5333333333333, "x": "信号待ちでブレーキを踏み続けなくてよいので、足の疲れが減ります。"}, {"t": 551.6666666666666, "x": "ライズではZと、Gのハイブリッドに付く装備です。GとXのガソリン車には付きません。"}, {"t": 560.3, "x": "もう2つ、選ぶ前に知っておいてほしい違いがあります。"}, {"t": 564.4333333333333, "x": "1つは雪の多い所に住むかたの話です。"}, {"t": 568.1666666666666, "x": "ヤリスクロスのハイブリッドには、4つのタイヤを回す形があります。"}, {"t": 572.8666666666667, "x": "Xなら値段は275万7700円です。"}, {"t": 577.7666666666667, "x": "ライズのハイブリッドは前のタイヤを回す形しかありません。"}, {"t": 582.3, "x": "ライズで4つのタイヤを回したい時は、1リットルのターボのガソリン車になります。"}, {"t": 587.9, "x": "雪道で坂の多い所なら、ヤリスクロスのハイブリッドの四輪駆動は強い味方です。"}, {"t": 594.6333333333333, "x": "もう1つは高速道路を長く走るかたの話です。"}, {"t": 598.9666666666667, "x": "前の車について走る仕組みは、長い時間の運転の疲れを減らしてくれます。"}, {"t": 604.8333333333334, "x": "ヤリスクロスのXには車線の真ん中を走るようハンドルを助ける仕組みも付いています。"}, {"t": 611.6333333333333, "x": "高速道路を走る時間が長いほど、ヤリスクロスの良さが出てきます。"}, {"t": 618.0666666666667, "x": "それでは奥さまへの店長の答えです。"}, {"t": 621.2, "x": "店長はライズのハイブリッドのGをお勧めしました。"}, {"t": 624.8666666666667, "x": "いちばんの理由は、せまいスーパーの駐車場です。"}, {"t": 628.6666666666666, "x": "幅が7センチ細く、40センチ小さく回れるぶん、止める時の怖さが減ります。"}, {"t": 635.4333333333333, "x": "2つ目の理由は冬の朝の腰の冷えです。"}, {"t": 638.9666666666667, "x": "シートヒーターが最初から付いているのは、ライズのGのほうでした。"}, {"t": 643.7666666666667, "x": "3つ目の高速道路の心配は、年に2回だけだとうかがいました。"}, {"t": 648.9333333333333, "x": "そこで斜め後ろの車を知らせる仕組みの6万6000円を足していただきました。"}, {"t": 654.5333333333333, "x": "合流や車線を変える時に、見落としを減らすためです。"}, {"t": 658.7666666666667, "x": "高速道路では、こまめに休みを取っていただくようお願いもしました。"}, {"t": 663.6333333333333, "x": "それでもヤリスクロスのXより、4万5100円安く収まりました。"}, {"t": 668.8, "x": "奥さまは運転席に座って「これならスーパーの駐車場も怖くないわね」とおっしゃいました。"}, {"t": 675.7, "x": "娘さんの家に行く日は、休みを多めに取りながら行くと約束してくださいました。"}, {"t": 682.9333333333333, "x": "ではヤリスクロスを選んだほうがいいのはどんなかたでしょうか。"}, {"t": 686.9333333333333, "x": "1つ目は高速道路をよく使うかたです。"}, {"t": 690.1, "x": "前の車について走る仕組みと、車線を保つ手助けが最初から付いています。"}, {"t": 695.8, "x": "2つ目は、雪の多い所に住んでいて、ハイブリッドの四輪駆動が欲しいかたです。"}, {"t": 701.9, "x": "これはライズには無い選び方です。"}, {"t": 704.6, "x": "ライズの四輪駆動はガソリン車なので、燃費は1リットルあたり17.5キロになります。"}, {"t": 711.6, "x": "3つ目は、毎日の走る距離が長くて燃費を大事にしたいかたです。"}, {"t": 717.1333333333333, "x": "1リットルあたり2.1キロの差は、走る距離が長いほど効いてきます。"}, {"t": 722.6666666666666, "x": "反対に近くの買い物と病院が中心なら、ライズの小ささが毎日役に立ちます。"}, {"t": 728.9333333333333, "x": "2台の答えは車の良し悪しではなく、走る道で決まるのです。"}, {"t": 734.0333333333333, "x": "最後にお店では2つのことを試してみてください。"}, {"t": 737.8333333333334, "x": "1つは、いつも行く駐車場と同じくらいの所で、2台とも止めてみることです。"}, {"t": 743.8333333333334, "x": "もう1つは、付けたい装備を全部入れた見積もりを2台並べることです。"}, {"t": 749.3666666666667, "x": "今日の数字は、11月にトヨタの公式の諸元表と装備一覧表と値段の表で確かめました。"}, {"t": 757.0666666666667, "x": "値段や装備は改良で変わりますので、最後は販売店の見積もりで確かめてください。"}, {"t": 762.9666666666667, "x": "次に店先で2台を見かけたら、どうぞ運転席にも座ってみてください。"}, {"t": 768.5666666666667, "x": "となりの車屋さんの店長でした。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
