<script>
const D={"name": "最後の一台は十年もつ車", "file": "083_最後の一台は十年もつ車", "dur": 837.3, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 3.066666666666667, "x": "先月、懐かしいお客さまが点検にいらっしゃいました。"}, {"t": 7.133333333333334, "x": "二十年ほど前に、うちで車を買っていかれたかたです。"}, {"t": 11.6, "x": "そのときのお言葉を今でもよく覚えています。"}, {"t": 15.566666666666666, "x": "「これが最後の車だから、長く乗れるのを頼むよ」。"}, {"t": 19.666666666666668, "x": "その車に乗って、先月もお店に来てくださいました。"}, {"t": 23.9, "x": "ボンネットを開けて思わず手を合わせたくなりました。"}, {"t": 27.633333333333333, "x": "大事に乗っていただいた車は、見ればすぐに分かるものです。"}, {"t": 32.166666666666664, "x": "今日はその日のことを思い出しながらお話しします。"}, {"t": 35.8, "x": "お名前と車の名前は、ここでは伏せておきます。"}, {"t": 39.56666666666667, "x": "次の車がたぶん最後になる。そう考えているかたに向けた回です。"}, {"t": 44.9, "x": "途中で壊れて買い直すのはできれば避けたい。"}, {"t": 48.5, "x": "手放すときに引き取り手があるのかも気になる。"}, {"t": 51.666666666666664, "x": "そんなご相談に、店長が一台だけ名前を挙げてお答えします。"}, {"t": 56.6, "x": "選びかたは少し変わっています。"}, {"t": 59.13333333333333, "x": "十年先の暮らしから、逆に数えて決めました。"}, {"t": 62.9, "x": "電池のことも部品のことも隠さずにお話しします。"}, {"t": 67.46666666666667, "x": "メーカーが約束していない話は、約束していないと申し上げます。"}, {"t": 72.46666666666667, "x": "そこが今日いちばん大事なところです。"}, {"t": 75.3, "x": "どうぞ最後までお付き合いください。"}, {"t": 79.4, "x": "十年乗るつもりで選ぶなら、見るところは四つに絞れます。"}, {"t": 84.0, "x": "一つめは壊れにくいことです。"}, {"t": 86.43333333333334, "x": "ただ、これは誰にも言い切れません。"}, {"t": 89.46666666666667, "x": "同じ車でも、乗りかたと手入れで大きく変わるからです。"}, {"t": 94.1, "x": "そこで今日は「壊れても慌てずにすむか」と言い換えます。"}, {"t": 98.56666666666666, "x": "保証がどこまであるか。困ったときに誰に聞けるか。"}, {"t": 102.76666666666667, "x": "この二つで見ていきます。"}, {"t": 104.9, "x": "二つめは直しやすいことです。"}, {"t": 107.56666666666666, "x": "近くに見てもらえるお店があるか。十年では、これが効いてきます。"}, {"t": 112.76666666666667, "x": "部品が届くまで何週間も待つようでは、毎日の足がなくなってしまいます。"}, {"t": 118.66666666666667, "x": "三つめは、十年後も安全でいられることです。"}, {"t": 122.63333333333334, "x": "買った日の装備が、十年後も頼りになるとは限りません。"}, {"t": 127.0, "x": "四つめは手放しやすいことです。"}, {"t": 129.53333333333333, "x": "免許を返す日が来たとき、車がお荷物になっては困ります。"}, {"t": 134.2, "x": "反対に今日は外したものもあります。"}, {"t": 137.13333333333333, "x": "大きさや見た目、走りの楽しさです。"}, {"t": 140.36666666666667, "x": "それが大事でないわけではありません。"}, {"t": 143.13333333333333, "x": "ただ最後の一台という目で見ると、順番が下がるのです。"}, {"t": 148.16666666666666, "x": "この四つを満たしそうな車をいま買える新車から探しました。"}, {"t": 154.16666666666666, "x": "店長の答えは、トヨタのアクアです。"}, {"t": 157.6, "x": "全部のグレードがハイブリッドの五人乗りの小さな車です。"}, {"t": 161.93333333333334, "x": "長さは4080ミリ、幅は1695ミリです。"}, {"t": 166.83333333333334, "x": "いわゆる五ナンバーの大きさに収まっています。"}, {"t": 170.03333333333333, "x": "細い道ですれちがうときも、気を使う場面が少なくてすみます。"}, {"t": 175.0, "x": "古い家の車庫や、狭い貸し駐車場でも置き場に困りにくい大きさです。"}, {"t": 180.46666666666667, "x": "小回りの目安になる最小回転半径は、5.2メートルです。"}, {"t": 186.03333333333333, "x": "燃費の数字は、Xというグレードで1リットルあたり34.3キロです。"}, {"t": 192.5, "x": "値段はXの二輪駆動で、249万7000円からになります。"}, {"t": 197.9, "x": "どれもトヨタが出している二〇二六年七月現在の数字です。"}, {"t": 203.03333333333333, "x": "ではなぜこの車なのか。"}, {"t": 205.46666666666667, "x": "十年ぶんの心配ごとに、メーカーの書いた答えがあるからです。"}, {"t": 210.16666666666666, "x": "電池の保証があります。"}, {"t": 212.43333333333334, "x": "安全装備を新しくする方法があります。"}, {"t": 215.63333333333333, "x": "困ったときの相談先もあります。"}, {"t": 218.2, "x": "この三つがトヨタの資料ではっきり書かれています。"}, {"t": 221.93333333333334, "x": "順番に見ていきましょう。"}, {"t": 225.46666666666667, "x": "アクアの話をすると、決まって聞かれるのが電池のことです。"}, {"t": 229.96666666666667, "x": "アクアが走るために積んでいるのはニッケル水素電池です。"}, {"t": 234.16666666666666, "x": "ではこの電池は何年もつのか。"}, {"t": 237.0, "x": "トヨタの答えは正直なものです。"}, {"t": 239.7, "x": "寿命はあるが、使いかたや走りかたで変わるので一概には言えない。"}, {"t": 245.2, "x": "メーカー自身がこう答えています。"}, {"t": 247.9, "x": "車屋としては、この答えのほうがかえって信用できると思っています。"}, {"t": 252.93333333333334, "x": "ですから店長も十年もちますとは申し上げません。"}, {"t": 256.6666666666667, "x": "そのかわり保証の線ははっきりしています。"}, {"t": 259.93333333333334, "x": "トヨタでは、駆動用の電池は特別保証という枠に入っています。"}, {"t": 264.96666666666664, "x": "新車の登録から五年、または十万キロまでです。"}, {"t": 269.1333333333333, "x": "どちらか早いほうで終わります。"}, {"t": 271.6, "x": "この五年は買った日ではなく登録の日から数えます。"}, {"t": 275.53333333333336, "x": "車検証の日付を見て手帳に書いておくと安心です。"}, {"t": 279.8, "x": "もう一つ見落としやすいのが、保証を受けるための条件です。"}, {"t": 284.3666666666667, "x": "決められた点検を受けてその記録を残しておくこと。"}, {"t": 288.6666666666667, "x": "メンテナンスノートや点検の記録簿を持っておくことです。"}, {"t": 292.53333333333336, "x": "条件が守られていないと、保証の修理を断られることがあります。"}, {"t": 297.6666666666667, "x": "十年乗るなら、この冊子は車検証と同じくらい大事な紙です。"}, {"t": 302.8333333333333, "x": "気になる音や様子があれば、五年になる前に一度見てもらうのがおすすめです。"}, {"t": 308.3333333333333, "x": "五年を過ぎてからの備えもあります。"}, {"t": 311.1333333333333, "x": "アクアにはイーケアという仕組みがあります。"}, {"t": 314.23333333333335, "x": "警告灯がついたら、車の画面からコールセンターにつながります。"}, {"t": 318.93333333333334, "x": "二十四時間いつでも、どうすればいいかを教えてもらえます。"}, {"t": 323.6, "x": "夜中に見慣れない明かりがついても、ひとりで悩まずにすみます。"}, {"t": 329.8666666666667, "x": "部品のこともよく聞かれます。"}, {"t": 332.3333333333333, "x": "十年たったら部品がなくなるのでは、というご心配です。"}, {"t": 336.8666666666667, "x": "部品を何年出し続けるかは車種ごとにちがいます。"}, {"t": 341.0, "x": "店長がここで年数を言い切ることはできません。"}, {"t": 344.5, "x": "ですから買うときに販売店でこう聞いてください。"}, {"t": 348.3, "x": "「この車の部品は、いつごろまで手に入りますか」。"}, {"t": 352.4, "x": "きちんと答えてくれるお店は、十年付き合えるお店です。"}, {"t": 357.0, "x": "答えを濁すお店なら、別のお店にも聞いてみてください。"}, {"t": 361.2, "x": "部品の話を嫌がらないお店は、修理の話も嫌がりません。"}, {"t": 366.23333333333335, "x": "保証の長さもそこで一緒に確かめておきます。"}, {"t": 369.73333333333335, "x": "トヨタの一般保証は、登録から三年または六万キロまでです。"}, {"t": 375.0, "x": "さきほどの特別保証は五年、または十万キロまで。"}, {"t": 379.3, "x": "一般保証を五年まで延ばす有料のプランも用意されています。"}, {"t": 383.8666666666667, "x": "入れる時期に決まりがあります。買う日に聞くのが確実です。"}, {"t": 388.3333333333333, "x": "修理で困らないいちばんの近道はやはり点検です。"}, {"t": 392.9, "x": "小さな不具合のうちに見つかれば、直す手間も小さくすみます。"}, {"t": 397.6666666666667, "x": "アクアのような乗用車の車検は、新車から三年後が最初です。"}, {"t": 402.96666666666664, "x": "そのあとは二年ごとになります。"}, {"t": 405.5, "x": "十年乗れば、三年目、五年目、七年目、九年目の四回です。"}, {"t": 411.7, "x": "この四回を体の健康診断のように使ってください。"}, {"t": 415.6666666666667, "x": "いつも同じお店で見てもらうと、車の癖も覚えてもらえます。"}, {"t": 421.8333333333333, "x": "三つめの条件、十年後の安全のお話です。"}, {"t": 425.73333333333335, "x": "車の安全装備は、買った日のまま古くなっていくものでした。"}, {"t": 430.53333333333336, "x": "アクアはここが少しちがいます。"}, {"t": 433.23333333333335, "x": "トヨタ・セーフティ・センスという安全装備のまとまりがあります。"}, {"t": 437.4, "x": "このソフトを、お店に行かずに無線で新しくできるのです。"}, {"t": 441.96666666666664, "x": "ただし、ティーコネクトというサービスの契約が要ります。"}, {"t": 445.8333333333333, "x": "十年のあいだに何が新しくなるかは、まだ決まっていません。"}, {"t": 450.76666666666665, "x": "知らせが来たら、お店で中身を聞いてみてください。"}, {"t": 454.8, "x": "いまの中身も見ておきましょう。"}, {"t": 457.3333333333333, "x": "ここからは、二〇二六年七月現在の装備のお話です。"}, {"t": 462.5, "x": "ぶつかりそうなときに止まる装置は、前の車と歩行者を見ています。"}, {"t": 467.6666666666667, "x": "自転車は昼も夜も見分けます。バイクは昼に見分けます。"}, {"t": 472.23333333333335, "x": "交差点で曲がるときは、渡っている人や自転車にも気を配ります。"}, {"t": 477.3, "x": "高速道路などで、運転する人が動かなくなったときの備えもあります。"}, {"t": 482.56666666666666, "x": "車を止めるところまで、車が手伝ってくれる仕組みです。"}, {"t": 486.8666666666667, "x": "アクアは全車、国のサポカーSのワイドという区分に入っています。"}, {"t": 492.0, "x": "後ろから来る車に気づいて止まる装置は、Xにも付いています。"}, {"t": 496.96666666666664, "x": "後ろを歩く人まで見て止まる装置は、Zなら付いています。"}, {"t": 501.6333333333333, "x": "アクセルを急に強く踏んだときの備えもあります。"}, {"t": 505.3, "x": "こちらはお店で付ける装備で、全グレードに用意されています。"}, {"t": 510.0, "x": "十年のうちに体の具合も少しずつ変わります。"}, {"t": 513.8666666666667, "x": "そのとき足せる装備があるのは心強いことです。"}, {"t": 517.4666666666667, "x": "買う日の体だけでなく、十年後の体を思い浮かべて選んでください。"}, {"t": 524.3333333333334, "x": "四つめは、手放すときのことです。"}, {"t": 527.3666666666667, "x": "免許を返すときこの車はいくらで売れるのか。"}, {"t": 531.4, "x": "これはいまお約束できる数字がありません。"}, {"t": 534.6333333333333, "x": "十年後の値段は、そのときの景気や人気で決まるからです。"}, {"t": 539.2333333333333, "x": "ただ値がつきやすくなる準備はできます。"}, {"t": 542.3333333333334, "x": "一つは、さきほどの点検の記録です。"}, {"t": 545.4, "x": "次の持ち主にとって、記録のそろった車は安心の材料になります。"}, {"t": 551.2, "x": "二つめは、取扱説明書と予備の鍵をなくさないことです。"}, {"t": 556.0, "x": "そろっていないと、それだけで話が渋くなることがあります。"}, {"t": 560.5666666666667, "x": "三つめは、売るだけが道ではないということです。"}, {"t": 564.4666666666667, "x": "お子さんやお孫さんに譲るという手もあります。"}, {"t": 567.8333333333334, "x": "譲るなら、名義を変える手続きも早めに済ませておきます。"}, {"t": 572.6, "x": "乗らない車を置いたままにすると、税金だけがかかり続けるからです。"}, {"t": 577.9666666666667, "x": "アクアの自動車税は、二〇一九年十月以降の登録なら年に3万500円です。"}, {"t": 584.8333333333334, "x": "もらう側にとっても重すぎる額ではありません。"}, {"t": 588.3, "x": "譲る相手が決まっているなら、買う前に一度乗ってもらうのもよい方法です。"}, {"t": 593.8, "x": "それから、返納の前に考えられる道がもう一つあります。"}, {"t": 598.4666666666667, "x": "安全装備の付いた車だけを運転できる、限定の免許です。"}, {"t": 603.6333333333333, "x": "アクアがその車に当たるかは const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
