<script>
const D={"name": "ムーヴとワゴンRスマイルどっち", "file": "110_ムーヴとワゴンRスマイルどっち", "dur": 799.36665625, "segs": [], "subs": [{"t": 0.0, "x": "こんにちは、「となりの車屋さん」の店長です。"}, {"t": 2.8333333333333335, "x": "今日は後ろがスライドドアの軽の、どちらを選ぶかというお話です。"}, {"t": 7.933333333333334, "x": "ダイハツのムーヴと、スズキのワゴンRスマイルです。"}, {"t": 12.066666666666666, "x": "どちらも背の高すぎない軽に、後ろのスライドドアを付けた車です。"}, {"t": 17.466666666666665, "x": "狭い駐車場でも、隣の車にドアをぶつける心配が少ない作りです。"}, {"t": 22.933333333333334, "x": "今日も先に答えを言ってしまいます。"}, {"t": 25.766666666666666, "x": "70代のかたに店長が勧めるのはワゴンRスマイルです。"}, {"t": 30.566666666666666, "x": "決め手は5万円近く安い値段と、燃費のよさです。"}, {"t": 35.0, "x": "しかも、小回りの数字は2台ともまったく同じなのです。"}, {"t": 39.53333333333333, "x": "ここだけ聞くと、ムーヴを選ぶ理由が無いように思えるかもしれません。"}, {"t": 44.6, "x": "けれどもムーヴには、夜の運転で頼りになる装備があります。"}, {"t": 49.333333333333336, "x": "その装備にどれだけの値打ちがあるのかを、今日は一緒に確かめます。"}, {"t": 54.3, "x": "先日のことです。"}, {"t": 55.9, "x": "店長のお店にご夫婦でお見えになったかたがいました。"}, {"t": 59.733333333333334, "x": "「今の軽が古くなったので、この2台のどちらかにしたいんです」。"}, {"t": 64.46666666666667, "x": "ご主人は70代の半ばで、運転するのはほとんどご主人だそうです。"}, {"t": 70.06666666666666, "x": "奥さまはひざが少し痛くて、重いドアの開け閉めがつらいとのことでした。"}, {"t": 75.53333333333333, "x": "今日はこのご相談にお答えするつもりで順に数字を並べていきます。"}, {"t": 82.2, "x": "まずは今日比べる形をはっきりさせておきます。"}, {"t": 85.7, "x": "ムーヴはGという形の、前のタイヤを回す2WDです。"}, {"t": 90.73333333333333, "x": "ワゴンRスマイルはハイブリッドSという形の2WDです。"}, {"t": 96.1, "x": "どちらもスイッチで掛けるパーキングブレーキが付くいちばん安い形です。"}, {"t": 101.26666666666667, "x": "信号で止まったときにブレーキから足を離せる機能も2台そろっています。"}, {"t": 106.63333333333334, "x": "長い信号待ちで右足を休められるので、遠くへ出かける日も疲れにくくなります。"}, {"t": 113.2, "x": "左側のスライドドアは2台ともボタン1つで開け閉めできる電動です。"}, {"t": 118.76666666666667, "x": "エアバッグは2台とも6個で、横からぶつかられたときの備えもあります。"}, {"t": 124.03333333333333, "x": "長さは2台とも3395ミリで、幅も2台とも1475ミリです。"}, {"t": 131.06666666666666, "x": "軽自動車の決まりいっぱいの大きさで、ここに差はありません。"}, {"t": 135.86666666666667, "x": "地面から車の底までの高さも2台とも150ミリです。"}, {"t": 140.66666666666666, "x": "車の重さはムーヴが860キロで、ワゴンRスマイルが870キロです。"}, {"t": 147.43333333333334, "x": "雪の多い土地のための四輪駆動も、2台とも選べます。"}, {"t": 152.03333333333333, "x": "軽自動車なので、毎年の税金も2台で同じです。"}, {"t": 156.3, "x": "車線をはみ出しそうになると知らせる仕組みは、2台とも付いています。"}, {"t": 161.7, "x": "道路の標識を読み取って、制限速度などを画面に出す仕組みも同じです。"}, {"t": 167.13333333333333, "x": "運転がふらついたときに気づかせてくれる仕組みも、2台そろっています。"}, {"t": 172.23333333333332, "x": "ここまではどちらを選んでもほぼ同じと思ってください。"}, {"t": 176.1, "x": "違いが出るのは、背の高さと値段と燃費と、装備の中身です。"}, {"t": 182.76666666666668, "x": "最初に小回りの目安になる最小回転半径という数字です。"}, {"t": 187.83333333333334, "x": "ハンドルをいっぱいに切ったとき車が描く円の半径で、小さいほど小回りが利きます。"}, {"t": 194.63333333333333, "x": "ムーヴのこの形は4.4メートルです。"}, {"t": 197.96666666666667, "x": "ワゴンRスマイルも同じ4.4メートルです。"}, {"t": 201.56666666666666, "x": "前の回のヤリスクロスは5.3メートルでしたから、ずいぶん小さな円です。"}, {"t": 207.56666666666666, "x": "ただしムーヴには1つ気をつけたい形があります。"}, {"t": 211.2, "x": "いちばん上のRSという形は、4.7メートルになります。"}, {"t": 216.26666666666668, "x": "RSは15インチのタイヤを履いていて、回る円の半径が30センチ大きいのです。"}, {"t": 222.53333333333333, "x": "この差は、狭い駐車場で切り返しの回数に表れることがあります。"}, {"t": 227.73333333333332, "x": "ワゴンRスマイルはどの形を選んでも4.4メートルで変わりません。"}, {"t": 232.86666666666667, "x": "小回りは引き分けですが、ムーヴを選ぶなら小回りのためにGをお勧めします。"}, {"t": 240.2, "x": "では2台の形の違いはどこにあるのでしょうか。"}, {"t": 243.86666666666667, "x": "屋根の高さはムーヴが1655ミリです。"}, {"t": 247.73333333333332, "x": "ワゴンRスマイルは1695ミリで、4センチ高くなっています。"}, {"t": 254.06666666666666, "x": "車の中の天井までの高さはムーヴが1270ミリです。"}, {"t": 259.3333333333333, "x": "ワゴンRスマイルは1330ミリで、こちらは6センチの差になります。"}, {"t": 265.1333333333333, "x": "乗り込むときの頭の上のゆとりが、そのぶん大きくなります。"}, {"t": 270.26666666666665, "x": "車の中の長さも、ムーヴの2140ミリに対して、ワゴンRスマイルは2185ミリです。"}, {"t": 278.76666666666665, "x": "後ろの座席は、2台とも左右別々に前後へずらせます。"}, {"t": 283.56666666666666, "x": "ムーヴはずらせる幅が240ミリあり、足元と荷物の広さを分け合えます。"}, {"t": 289.5, "x": "中の広さは、ワゴンRスマイルが少し上です。"}, {"t": 293.96666666666664, "x": "なお高さ1550ミリまでの立体駐車場には、2台とも入りません。"}, {"t": 299.6333333333333, "x": "マンションの駐車場を使うかたは、高さの決まりを先に確かめてください。"}, {"t": 304.9, "x": "中の広さは、ワゴンRスマイルの勝ちです。"}, {"t": 310.3333333333333, "x": "次は値段です。"}, {"t": 312.1, "x": "ムーヴのGは176万5500円です。"}, {"t": 316.4, "x": "ワゴンRスマイルのハイブリッドSは171万7100円です。"}, {"t": 321.8666666666667, "x": "その差は4万8400円で、ワゴンRスマイ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
